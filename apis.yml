aid: kernel
name: Kernel
description: >-
  Kernel is browser infrastructure for AI agents and automations. It runs sandboxed
  cloud Chromium browsers that spin up in under 30ms, with Playwright execution,
  computer-use controls, managed authentication into third-party sites, reusable
  browser profiles, proxies, pre-warmed browser pools, session replays, live
  telemetry, and a serverless App platform for deploying and invoking agent actions.
  Kernel exposes a REST API (OpenAPI 3.1, 135 operations across 22 tags), first-party
  TypeScript, Python and Go SDKs, a CLI, and a centrally hosted MCP server so agents
  can drive real browsers. Backed by General Catalyst.
