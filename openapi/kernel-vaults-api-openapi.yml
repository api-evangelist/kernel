openapi: 3.2.0
info:
  description: Developer tools and cloud infrastructure for AI agents to use web browsers
  title: Kernel Vaults API
  version: 0.1.0
servers:
- description: API Server
  url: https://api.onkernel.com
security:
- bearerAuth: []
tags:
- name: Vaults
paths:
  /vault-provider-configs:
    get:
      description: Secret credentials are never returned.
      operationId: getVaultProviderConfigs
      parameters:
      - in: query
        name: limit
        schema:
          default: 20
          maximum: 100
          minimum: 1
          type: integer
      - in: query
        name: offset
        schema:
          default: 0
          minimum: 0
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/VaultProviderConfig'
                type: array
          description: Provider configurations
          headers:
            X-Has-More:
              schema:
                type: boolean
            X-Next-Offset:
              schema:
                type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - bearerAuth: []
      summary: List provider configurations in the organization
      tags:
      - Vaults
    post:
      description: Register a configuration shared across the organization's projects. Names are unique within the organization; duplicate names return 409 without replacing credentials. A configuration serves many wallets. Secret credentials are never returned. Requires an organization-scoped credential or dashboard authentication; project-scoped credentials receive 403.
      operationId: postVaultProviderConfig
      requestBody:
        content:
          application/json:
            examples:
              agentcard:
                value:
                  credentials:
                    client_id: example-client-id
                    client_secret: example-client-secret
                  name: my-agentcard
                  provider: agentcard
              link:
                value:
                  credentials:
                    client_id: example-client-id
                    client_secret: example-client-secret
                    publishable_key: pk_live_example
                  name: my-link-client
                  provider: link
            schema:
              $ref: '#/components/schemas/VaultProviderConfigRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              examples:
                agentcard:
                  $ref: '#/components/examples/ExampleAgentCardConfig'
                link:
                  $ref: '#/components/examples/ExampleLinkConfig'
              schema:
                $ref: '#/components/schemas/VaultProviderConfig'
          description: Provider configuration registered
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - bearerAuth: []
      summary: Register a provider configuration
      tags:
      - Vaults
  /vault-provider-configs/{id_or_name}:
    parameters:
    - description: Provider configuration ID or name in the organization.
      in: path
      name: id_or_name
      required: true
      schema:
        type: string
    delete:
      description: Delete a configuration in the organization. Returns 409 while any non-deleted vault item references the configuration, regardless of connection status. Does not delete the external OAuth client or revoke unrelated grants. Requires an organization-scoped credential or dashboard authentication; project-scoped credentials receive 403.
      operationId: deleteVaultProviderConfig
      responses:
        '204':
          description: Provider configuration deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - bearerAuth: []
      summary: Delete an unused provider configuration
      tags:
      - Vaults
    get:
      description: Look up a configuration by ID or name. Returns 404 when it does not exist in the organization.
      operationId: getVaultProviderConfig
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultProviderConfig'
          description: Provider configuration without secret credentials
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - bearerAuth: []
      summary: Get a provider configuration
      tags:
      - Vaults
    patch:
      description: Update the supplied fields; omitted fields remain unchanged. Names must remain unique within the organization. Requires an organization-scoped credential or dashboard authentication; project-scoped credentials receive 403.
      operationId: patchVaultProviderConfig
      requestBody:
        content:
          application/json:
            examples:
              agentcard:
                summary: Rotate the secret of the AgentCard configuration selected in the path
                value:
                  credentials:
                    client_secret: example-rotated-client-secret
              link:
                summary: Rename the Link configuration selected in the path
                value:
                  name: renamed-link-client
              link_publishable_key:
                summary: Set the Stripe publishable key of the Link configuration selected in the path
                value:
                  credentials:
                    publishable_key: pk_live_example
            schema:
              $ref: '#/components/schemas/VaultProviderConfigUpdateRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                agentcard:
                  $ref: '#/components/examples/ExampleAgentCardConfigRotated'
                link:
                  $ref: '#/components/examples/ExampleLinkConfigRenamed'
              schema:
                $ref: '#/components/schemas/VaultProviderConfig'
          description: Provider configuration updated without returning secrets
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - bearerAuth: []
      summary: Update a provider configuration
      tags:
      - Vaults
  /vaults:
    get:
      operationId: getVaults
      parameters:
      - in: query
        name: limit
        schema:
          default: 20
          maximum: 100
          minimum: 1
          type: integer
      - in: query
        name: offset
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: Case-insensitive substring match against vault name. IDs match by exact value.
        in: query
        name: query
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Vault'
                type: array
          description: List of vaults
          headers:
            X-Has-More:
              schema:
                type: boolean
            X-Next-Offset:
              schema:
                type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - bearerAuth: []
      summary: List vaults in the current project
      tags:
      - Vaults
    post:
      description: Free organizations can store up to 3 non-deleted vaults across all projects. Paid plans and active trials have no vault cap. Retrieving an existing vault by name succeeds even at the limit.
      operationId: postVaults
      requestBody:
        content:
          application/json:
            examples:
              checkout:
                summary: Create a provider-neutral vault; repeating this name retrieves it
                value:
                  name: checkout
            schema:
              $ref: '#/components/schemas/VaultRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                checkout:
                  $ref: '#/components/examples/ExampleVault'
              schema:
                $ref: '#/components/schemas/Vault'
          description: Existing vault
        '201':
          content:
            application/json:
              examples:
                checkout:
                  $ref: '#/components/examples/ExampleVault'
              schema:
                $ref: '#/components/schemas/Vault'
          description: Vault created
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - bearerAuth: []
      summary: Create or retrieve a vault by immutable name
      tags:
      - Vaults
  /vaults/{id_or_name}:
    parameters:
    - in: path
      name: id_or_name
      required: true
      schema:
        type: string
    delete:
      description: Unresolved payment operations block deletion. Deleting a connected Kernel wallet first blocks new payments on it, then removes its enrolled card. If that fails, the wallet is kept and keeps refusing payments; retry the deletion. Reconcile the original attempt with the provider or support first; deleting or recreating an item is not proof that a payment did not occur.
      operationId: deleteVaultByIdOrName
      responses:
        '204':
          description: Vault deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - bearerAuth: []
      summary: Delete a vault and invalidate its items
      tags:
      - Vaults
    get:
      operationId: getVaultByIdOrName
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vault'
          description: Vault
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - bearerAuth: []
      summary: Get a vault
      tags:
      - Vaults
  /vaults/{id_or_name}/encryption_key:
    parameters:
    - in: path
      name: id_or_name
      required: true
      schema:
        type: string
    get:
      description: Returns the public key that custom credential collection web apps use to encrypt values in the browser. Use this only if you run your own credential collection web app and want values encrypted in the browser, sent to your backend still encrypted, and forwarded to Kernel's API still encrypted. In every other case, including server-side code that already holds the plaintext, use value. The page encrypts each value to this key, your backend forwards the ciphertext unchanged as encrypted_value when creating or updating a credential item in this vault, and Kernel decrypts it.
      operationId: getVaultEncryptionKey
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultEncryptionKey'
          description: Vault encryption key
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - bearerAuth: []
      summary: Get a vault's public key for browser-encrypted credential values
      tags:
      - Vaults
  /vaults/{id_or_name}/items:
    parameters:
    - in: path
      name: id_or_name
      required: true
      schema:
        type: string
    get:
      description: Credential entries include safe field metadata and non-sensitive values. Listing never creates or renews collection sessions; only an existing unexpired active session is included. Use single-item GET or collect to obtain a fresh link.
      operationId: getVaultItems
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/VaultItem'
                type: array
          description: Vault items
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - bearerAuth: []
      summary: List vault items without secret values
      tags:
      - Vaults
  /vaults/{id_or_name}/items/{key}:
    parameters:
    - in: path
      name: id_or_name
      required: true
      schema:
        type: string
    - in: path
      name: key
      required: true
      schema:
        maxLength: 255
        minLength: 1
        type: string
    delete:
      description: Unresolved payment operations normally block deletion, including operations on child cards of a wallet. Deleting a connected Kernel wallet first blocks new payments on it, then removes its enrolled card. If that fails, the wallet is kept and keeps refusing payments; retry the deletion. A Link or Kernel card in recovery_required for issuance, or an AgentCard card in recovery_required whose checkout create response returned no authorization ID, may be explicitly abandoned by deleting that card directly; deleting its wallet or vault remains blocked until the card is deleted. Deleting or recreating an item is not proof that a payment did not occur. Deleting a managed auth credential item leaves the connection and its saved credential unchanged.
      operationId: deleteVaultItem
      responses:
        '204':
          description: Vault item deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - bearerAuth: []
      summary: Delete a vault item and invalidate its secret value
      tags:
      - Vaults
    get:
      description: The response advertises operations that are valid in the item's current state and live data that can be requested through `expand`. Read each operation's description before using it. Expanded data is fetched from the provider and is not persisted in the vault item. Requesting an unavailable expansion returns 409 instead of a partial item. Pending credential items return a collection action. Kernel-hosted active collection links are renewed atomically on expiry for ready or pending items without changing the item version. Invoke collect to open a form for a ready item without clearing values. Sensitive credential values are never returned.
      operationId: getVaultItem
      parameters:
      - description: Hold for up to this many seconds while the item is pending authorization, approval, or credential collection. Return the current item when ready or when the wait elapses. This does not wait for edits to an already-ready credential; poll GET without wait and compare version to observe changes after collect. Managed auth credentials are created ready, so wait returns immediately.
        in: query
        name: wait
        schema:
          default: 0
          maximum: 60
          minimum: 0
          type: integer
      - description: Live fields advertised by `available_expansions` to include in `expanded`.
        explode: false
        in: query
        name: expand
        schema:
          items:
            $ref: '#/components/schemas/VaultItemExpansionType'
          type: array
          uniqueItems: true
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultItem'
          description: Vault item
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - bearerAuth: []
      summary: Get a vault item, its currently available operations, and optionally expanded…
      tags:
      - Vaults
    patch:
      description: Credential updates require type credential and the current version, and change only values or description; omitted values are preserved, nonempty strings replace, and null or empty strings clear supported fields. Clearing required text/email/password values returns pending_collection; browser forms still require nonempty required inputs. Card updates may omit type for compatibility with legacy requests. Requested cards accept a replacement specification. Pending issuance requests may update provider-supported fields on their existing request, subject to atomic provider approval checks; omitted optional fields remain unchanged and explicit empty lists clear them. Wallet/provider binding and unsupported fields cannot change after authorization starts. An uncertain update enters recovery_required; delete the card and create a new one rather than retrying the update. Checkout cards may be edited between authorizations. A Link card authorized with browser_id and page_url cannot be changed; delete it and create a new card with the updated details.
      operationId: patchVaultItem
      requestBody:
        content:
          application/json:
            examples:
              agentcard:
                $ref: '#/components/examples/ExampleAgentCardCardEdit'
              credential:
                summary: Update one credential value at the current version
                value:
                  spec:
                    fields:
                      password:
                        value: new-password
                  type: credential
                  version: 1
              link:
                $ref: '#/components/examples/ExampleLinkCardEdit'
            schema:
              $ref: '#/components/schemas/VaultItemUpdateRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                agentcard:
                  $ref: '#/components/examples/ExampleAgentCardCardUpdated'
                credential:
                  summary: Updated credential metadata without sensitive values
                  value:
                    available_expansions: []
                    available_operations: []
                    created_at: '2026-01-01T12:00:00Z'
                    id: credential-example
                    key: login
                    spec:
                      description: Example account
                      fields:
                      - name: password
                        required: true
                        sensitive: true
                        type: password
                      provider: kernel
                    state:
                      fields:
                        password:
                          has_value: true
                      provider: kernel
                      status: ready
                    type: credential
                    updated_at: '2026-01-01T12:01:00Z'
                    version: 2
                link:
                  $ref: '#/components/examples/ExampleLinkCardUpdated'
              schema:
                $ref: '#/components/schemas/VaultItem'
          description: Vault item updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - bearerAuth: []
      summary: Update a card specification or credential values
      tags:
      - Vaults
    put:
      description: Create an item under a key unique within its vault, or retrieve the existing item when its specification matches. An identical card PUT returns the existing card in any lifecycle state without polling the provider, reauthorizing, replacing aliases, or resetting recovery. Conflicting specifications return 409. Provider-specific authorization requirements and retry behavior are described in the item's request schema. Do not use credential items to store, collect, or fill credit card data, including card numbers (PANs), security codes (CVV/CVC), or expiration dates. Use wallet and card item types for credit cards and payment checkout instead.
      operationId: putVaultItem
      requestBody:
        content:
          application/json:
            examples:
              agentcard_card:
                $ref: '#/components/examples/ExampleAgentCardCardInput'
              customer_managed_agentcard:
                summary: Create a wallet using customer-owned AgentCard credentials
                value:
                  spec:
                    provider: agentcard
                    provider_config:
                      name: my-agentcard
                  type: wallet
              imported_link:
                summary: Import a grant from a customer-owned Link client
                value:
                  spec:
                    authorization:
                      client:
                        provider_config:
                          name: my-link-client
                        type: customer_managed
                      method: oauth
                      tokens:
                        access_token: example-access-token
                        refresh_token: example-refresh-token
                    provider: link
                  type: wallet
              kernel_managed_agentcard:
                summary: Start hosted enrollment with Kernel-managed credentials
                value:
                  spec:
                    provider: agentcard
                  type: wallet
              kernel_managed_link:
                summary: Start Kernel-managed Link authorization
                value:
                  spec:
                    authorization:
                      client:
                        type: kernel_managed
                      method: oauth
                    provider: link
                  type: wallet
              link_card:
                $ref: '#/components/examples/ExampleLinkCardInput'
              managed_auth_credential:
                $ref: '#/components/examples/ExampleManagedAuthCredentialInput'
            schema:
              $ref: '#/components/schemas/VaultItemRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                agentcard_card:
                  $ref: '#/components/examples/ExampleAgentCardCard'
                imported_link:
                  $ref: '#/components/examples/ExampleImportedLinkWallet'
                link_card:
                  $ref: '#/components/examples/ExampleLinkCard'
                managed_auth_credential:
                  $ref: '#/components/examples/ExampleManagedAuthCredential'
              schema:
                $ref: '#/components/schemas/VaultItem'
          description: Existing matching item; card retries preserve identity and state
        '201':
          content:
            application/json:
              examples:
                agentcard_card:
                  $ref: '#/components/examples/ExampleAgentCardCard'
                customer_managed_agentcard:
                  $ref: '#/components/examples/ExampleConfiguredAgentCardWallet'
                imported_link:
                  $ref: '#/components/examples/ExampleImportedLinkWallet'
                kernel_managed_agentcard:
                  $ref: '#/components/examples/ExampleManagedAgentCardWallet'
                kernel_managed_link:
                  $ref: '#/components/examples/ExampleManagedLinkWallet'
                link_card:
                  $ref: '#/components/examples/ExampleLinkCard'
                managed_auth_credential:
                  $ref: '#/components/examples/ExampleManagedAuthCredential'
              schema:
                $ref: '#/components/schemas/VaultItem'
          description: Item created
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - bearerAuth: []
      summary: Create or retrieve an identical vault item by immutable key
      tags:
      - Vaults
  /vaults/{id_or_name}/items/{key}/events:
    get:
      operationId: getVaultItemEvents
      parameters:
      - in: path
        name: id_or_name
        required: true
        schema:
          type: string
      - in: path
        name: key
        required: true
        schema:
          type: string
      - description: Return events after this event ID.
        in: query
        name: after
        required: false
        schema:
          type: string
      - description: Long-poll for new events for up to this many seconds.
        in: query
        name: wait
        required: false
        schema:
          default: 0
          maximum: 60
          minimum: 0
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/VaultItemEvent'
                type: array
          description: Ordered vault item audit events
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - bearerAuth: []
      summary: List immutable audit events for a vault item
      tags:
      - Vaults
  /vaults/{id_or_name}/items/{key}/operations:
    post:
      description: 'Retrieve the item first and invoke only an operation listed in

        `available_operations`, following its natural-language description.

        Availability is rechecked at execution time; unavailable operations return 409.

        Authorization and preparation may call an external provider and return updated state.

        Link cards advertise authorize; pass browser_id and page_url from the final

        checkout page so Kernel can inspect the checkout. Eligible unused

        AgentCard cards advertise prepare_checkout, which requires checkout context

        and obtains device approval before native Square Pay. Keep the returned

        approval page open, poll until ready_to_submit, then submit before

        preparation.expires_at. Unused preparations expire automatically and cannot

        be reused. If spend-request creation is rejected with a non-retryable

        provider error, the card item is deleted and the provider''s error code and

        message are returned. Rate limits return HTTP 429 and retain the card item;

        stop, back off, and retry the same authorize operation.


        Ready Kernel cards advertise fill. Fill delivers card details for a few

        minutes; submit checkout promptly after filling. A repeated fill is safe.


        Fill returns a value-free execution result. Validation failures before

        writing return 400 (invalid request or targets), 403 (access or destination

        denied), 404 (resource not found), or 409 (item or browser not ready).

        Once writing starts, known partial failures and indeterminate field outcomes

        return 200 with status `failed` or `unknown`. Fill never submits the page, so

        it is safe to retry after a failure, an `unknown` outcome, or a transport error.'
      operationId: postVaultItemOperation
      parameters:
      - in: path
        name: id_or_name
        required: true
        schema:
          type: string
      - in: path
        name: key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            examples:
              agentcard_prepare_checkout:
                summary: Prepare an unused AgentCard card that advertises this operation
                value:
                  checkout:
                    browser_id: browser-session-id
                    environment: production
                    merchant_origin: https://shop.example.com
                  type: prepare_checkout
              link_authorize:
                summary: Authorize a Link card at its final checkout page
                value:
                  browser_id: browser-session-id
                  page_url: https://store.example.com/checkout
                  type: authorize
              one_password_fill:
                summary: Fill and submit an approved 1Password login
                value:
                  browser_id: browser-session-id
                  page_url: https://example.com/login
                  type: 1pw_fill
              one_password_recover:
                summary: Recover a failed 1Password account link
                value:
                  type: 1pw_recover
              one_password_request_access:
                summary: Request access to a 1Password credential
                value:
                  goal: Manage a SaaS subscription
                  keywords:
                  - personal
                  reason: Cancel the subscription
                  type: 1pw_create_access_request
            schema:
              $ref: '#/components/schemas/VaultItemOperationRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                agentcard_prepare_checkout:
                  $ref: '#/components/examples/ExampleAgentCardCard'
                link_authorize:
                  $ref: '#/components/examples/ExampleLinkApproval'
              schema:
                $ref: '#/components/schemas/VaultItemOperationResponse'
          description: Authorization or preparation completed or resumed, or fill execution outcomes returned
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      security:
      - bearerAuth: []
      summary: Perform an operation advertised by a vault item
      tags:
      - Vaults
components:
  schemas:
    CardEnrollmentAction:
      additionalProperties: false
      properties:
        name:
          enum:
          - card_enrollment
          type: string
        url:
          format: uri
          type: string
      required:
      - name
      - url
      type: object
    VaultCardAliases:
      additionalProperties: false
      properties:
        cvc:
          pattern: ^\d{3}$
          type: string
        exp_month:
          pattern: ^\d{2}$
          type: string
        exp_year:
          pattern: ^\d{4}$
          type: string
        number:
          pattern: ^\d{16}$
          type: string
      readOnly: true
      required:
      - number
      - cvc
      - exp_month
      - exp_year
      type: object
    CredentialVaultItemSpec:
      discriminator:
        mapping:
          1password: '#/components/schemas/OnePasswordCredentialVaultItemSpec'
          kernel: '#/components/schemas/KernelCredentialVaultItemSpec'
          managed_auth: '#/components/schemas/ManagedAuthCredentialVaultItemSpec'
        propertyName: provider
      oneOf:
      - $ref: '#/components/schemas/KernelCredentialVaultItemSpec'
      - $ref: '#/components/schemas/OnePasswordCredentialVaultItemSpec'
      - $ref: '#/components/schemas/ManagedAuthCredentialVaultItemSpec'
    ConfirmTransactionVaultItemOperationRequest:
      additionalProperties: false
      description: Report a real merchant transaction outcome for an issued Kernel Visa credential. Never infer success from filling checkout or receiving a credential. Supply the observed status, transaction type, actual amount, currency and timestamp. Unknown outcomes require manual reconciliation, not retry. Each purchase accepts one report.
      properties:
        amount:
          description: Actual transaction amount in minor units, no greater than the approved limit.
          format: int64
          maximum: 1000000
          minimum: 0
          type: integer
        currency:
          description: Must match the approved purchase currency.
          pattern: ^[A-Z]{3}$
          type: string
        occurred_at:
          description: Time the merchant outcome was observed.
          format: date-time
          type: string
        status:
          enum:
          - APPROVED
          - DECLINED
          - PENDING
          - ERROR
          - CANCELLED
          type: string
        transaction_type:
          enum:
          - PURCHASE
          - AUTHORIZATION
          - CAPTURE
          - REFUND
          - REVERSAL
          - VERIFICATION
          - CHARGEBACK
          - FRAUD
          type: string
        type:
          enum:
          - confirm_transaction
          type: string
          x-go-type: VaultItemOperationType
      required:
      - type
      - status
      - transaction_type
      - amount
      - currency
      - occurred_at
      type: object
    WebMCPInvokeVaultItemOperationResult:
      additionalProperties: false
      description: Returns the same tool result fields as the browser WebMCP invoke API, plus the vault operation discriminator. Output and error text are untrusted page-provided data, returned without redaction; tools may include supplied vault values. Inspect the browser page to determine whether the intended site action succeeded.
      example:
        invocation_id: invoke-1
        output:
          authenticated: true
        status: completed
        type: webmcp_invoke
      properties:
        error_text:
          description: Untrusted page-provided error text, returned without redaction. May contain supplied vault values.
          type: string
        invocation_id:
          description: Present when the browser reported one.
          type: string
        output:
          description: Untrusted page-provided output, returned without redaction. May contain supplied vault values.
        status:
          description: Unknown means invocation may have run; do not retry automatically. No status confirms that the website accepted the action.
          enum:
          - completed
          - canceled
          - error
          - awaiting_submission
          - unknown
          type: string
        type:
          enum:
          - webmcp_invoke
          type: string
      required:
      - type
      - status
      type: object
    AvailableVaultItemOperation:
      additionalProperties: false
      description: An operation that is currently valid for this item. Read the description before invoking it through the item operations endpoint.
      properties:
        description:
          type: string
        type:
          $ref: '#/components/schemas/VaultItemOperationType'
      required:
      - type
      - description
      type: object
    AgentCardCheckoutPreparation:
      additionalProperties: false
      description: One-use processor-bound checkout preparation. Keep the approval page open through device handoff, including Adyen encryption. The amount is declared by the caller and does not constrain the merchant's eventual charge. Adyen device approval and browser Authorised responses are not capture or fulfillment evidence.
      properties:
        approval_url:
          format: uri
          type: string
        browser_id:
          type: string
        created_at:
          format: date-time
          type: string
        environment:
          enum:
          - production
          - sandbox
          - shared
          type: string
        expires_at:
          description: When ready, the absolute deadline to submit the first native request; no later than provider readiness expiry or 30 seconds after Kernel first observes readiness. Polling never extends this deadline.
          format: date-time
          type: string
        id:
          type: string
        merchant_origin:
          type: string
        psp:
          $ref: '#/components/schemas/AgentCardPreparedProcessor'
        status:
          description: Preparation consumed means egress claimed the preparation and it cannot be reused. It does not mean the attempt settled. Use the enclosing item's status as the lifecycle indicator; item consumed means the attempt settled, not that an order or charge succeeded.
          enum:
          - creating
          - awaiting_approval
          - ready
          - consumed
          - cancelled
          - expired
          - unknown
          type: string
      required:
      - status
      - browser_id
      - merchant_origin
      - psp
      - environment
      - created_at
      type: object
    CredentialVaultItemUpdateRequest:
      additionalProperties: false
      description: 'Atomically update description, field definitions, and selected values.

        Omitted properties are preserved. `remove_fields` deletes definitions and

        their values, then `add_fields` appends definitions, then `fields` sets

        values, including for added fields. An existing field''s definition cannot

        be edited in place; to change it, remove the field and add it again, in

        the same update or a later one. The old value is deleted with it.

        Unknown field names return 400; stale versions or mismatched item types

        return 409 without changing the item. A successful update increments version

        and invalidates outstanding Kernel-hosted collection sessions. If required

        values remain missing, return pending_collection and a fresh collection

        action. Otherwise return ready without an action; collect can open the form

        again without clearing values. Customer URLs have no Kernel-managed expiry.

        1Password and managed auth credentials return 409.

        '
      properties:
        expected_item_id:
          description: Optional immutable item ID precondition. Returns 409 if the key now identifies a different item. Accepted writes target this immutable ID, preventing replacement-key races. Supply this when submitting a form bound to a previously read item.
          minLength: 1
          type: string
        spec:
          $ref: '#/components/schemas/CredentialVaultItemSpecUpdate'
        type:
          enum:
          - credential
          type: string
        version:
          description: Expected current item version from the latest read.
          minimum: 1
          type: integer
      required:
      - type
      - version
      - spec
      type: object
    LinkCardVaultItemSpec:
      additionalProperties: false
      description: 'Live Link card request. Test-mode card creation is not supported. The spec can be changed with PATCH until the card is authorized at a checkout. Authorize it with the browser at final checkout: Kernel inspects the checkout through WebMCP and internally chooses a merchant-bound Link Pay Token when supported or a virtual card otherwise. Callers never receive or choose how the credential is delivered.'
      properties:
        amount:
          description: Integer amount in minor currency units, at most 50000.
          maximum: 50000
          minimum: 1
          type: integer
        context:
          minLength: 100
          type: string
        currency:
          maxLength: 3
          minLength: 3
          pattern: ^[A-Za-z]{3}$
          type: string
        line_items:
          items:
            $ref: '#/components/schemas/LinkLineItem'
          type: array
        merchant_name:
          maxLength: 255
          minLength: 1
          type: string
        merchant_url:
          format: uri
          type: string
        metadata:
          additionalProperties:
            type: string
          type: object
        payment_method_id:
          description: Payment-method ID returned by the referenced wallet's payment-method listing. The provider decides whether the selected funding method can satisfy the card request.
          minLength: 1
          type: string
        provider:
          enum:
          - link
          type: string
        totals:
          items:
            $ref: '#/components/schemas/LinkTotal'
          type: array
        wallet:
          description: Connected Link wallet item key.
          type: string
      required:
      - provider
      - wallet
      - payment_method_id
      - amount
      - currency
      - merchant_name
      - merchant_url
      - context
      type: object
    CredentialAccountVaultItemRequest:
      additionalProperties: false
      properties:
        spec:
          $ref: '#/components/schemas/OnePasswordCredentialAccountSpec'
        type:
          enum:
          - credential_account
          type: string
      required:
      - type
      - spec
      type: object
    CredentialVaultFieldState:
      additionalProperties: false
      properties:
        has_value:
          type: boolean
        value:
          description: Present exactly when has_value is true and the field is not sensitive. Reflects the latest developer or human edit. For totp, has_value indicates a stored seed; neither the seed nor a generated code is returned.
          minLength: 1
          type: string
      required:
      - has_value
      type: object
    EmbeddedCeremonyAction:
      additionalProperties: false
      properties:
        name:
          enum:
          - embedded_ceremony
          type: string
      required:
      - name
      type: object
    ManagedAuthCredentialVaultField:
      additionalProperties: false
      properties:
        type:
          $ref: '#/components/schemas/CredentialVaultFieldType'
      required:
      - type
      type: object
    VaultOAuthClientCredentials:
      additionalProperties: false
      properties:
        client_id:
          minLength: 1
          type: string
        client_secret:
          minLength: 1
          type: string
          writeOnly: true
      required:
      - client_id
      - client_secret
      type: object
    LinkLineItem:
      additionalProperties: false
      properties:
        description:
          type: string
        image_url:
          type: string
        name:
          type: string
        product_url:
          type: string
        quantity:
          minimum: 1
          type: integer
        sku:
          type: string
        totals:
          items:
            $ref: '#/components/schemas/LinkTotal'
          type: array
        unit_amount:
          description: Unit amount in minor currency units.
          type: integer
        url:
          type: string
      required:
      - name
      type: object
    VaultItemEvent:
      additionalProperties: false
      properties:
        browser_id:
          description: Browser session associated with the event, when applicable.
          type: string
        created_at:
          format: date-time
          type: string
        data:
          additionalProperties: true
          type: object
        id:
          type: string
        name:
          type: string
      required:
      - id
      - name
      - created_at
      type: object
    OnePasswordReturnedRequest:
      additionalProperties: false
      description: The request object if returned by the extension. The observed create response may omit entries; no entry IDs are invented.
      properties:
        entries:
          items:
            $ref: '#/components/schemas/OnePasswordReturnedRequestEntry'
          type: array
        goal:
          type: string
        version:
          type: integer
      type: object
    OnePasswordCredentialVaultItemSpecInput:
      additionalProperties: false
      description: A login request backed by a connected 1Password account or by a customer-supplied access token and matching integration key. Supply either account or both secrets, never both. Supplied secrets are write-only and never returned. Supply requests for new items; website remains supported for existing account-backed callers.
      properties:
        access_token:
          description: Customer-supplied 1Password broker token. Requires integration_key; stored encrypted on this item. Omit if providing a connected credential_account item via the account field.
          maxLength: 16384
          minLength: 1
          type: string
        access_token_expires_at:
          description: Optional supplied token expiry metadata for stored-token credentials. Omit if providing a connected credential_account item via the account field.
          format: date-time
          type: string
        account:
          description: Key of a connected credential_account item in the same vault. Omit for stored-token credentials.
          minLength: 1
          type: string
        integration_key:
          description: Matching customer-supplied integration key. Requires access_token; stored encrypted on this item. Omit if providing a connected credential_account item via the account field.
          maxLength: 16384
          minLength: 1
          type: string
        provider:
          enum:
          - 1password
          type: string
        requests:
          $ref: '#/components/schemas/OnePasswordCredentialRequests'
        website:
          deprecated: true
          description: Legacy single-login shorthand. Supply requests instead.
          format: uri
          maxLength: 2083
          pattern: ^https://
          type: string
      required:
      - provider
      type: object
    CollectAction:
      additionalProperties: false
      properties:
        name:
          enum:
          - collect
          type: string
      required:
      - name
      type: object
    ImportedLinkAuthorizationInput:
      additionalProperties: false
      description: 'The customer''s backend completes Link OAuth and supplies the resulting tokens. For a new wallet, Kernel verifies the access token can access Link payment methods without consuming or rotating the refresh token. Valid access creates a wallet with state.status=connected. An expired, invalid, revoked, or insufficiently scoped access token returns 400 and no wallet is created. Refresh expired tokens in your backend before importing them. A failed import does not modify existing wallets.

        After successful import, Kernel owns subsequent refresh-token rotation; the customer must stop refreshing this grant. Import does not verify the refresh token: if it or the configured client credentials are rejected during a later refresh, the imported wallet becomes degraded. An unknown refresh outcome also leaves it degraded; Kernel does not retry a refresh token that may already have been consumed. There is no in-place reauthorization operation for an imported wallet.

        If this imported wallet''s credentials become unusable, obtain a fresh Link OAuth grant in your backend and create a wallet under a NEW wallet key. Use the new wallet for NEW cards and payments, not to retry an old payment whose outcome is uncertain. This does not replace the old grant, rebind existing cards, or resolve their payment outcomes. Retain the old wallet and its cards while reconciling any uncertain payments with the provider or support. Do not repeat an uncertain payment on the new wallet, and do not treat deletion as evidence that it did not execute. Deletion of the old wallet can remain blocked by unresolved child cards.

        Repeating a create for the same item key and non-secret spec returns the existing wallet without replacing tokens, even if they have rotated or the wallet needs reconnection. ID and name references resolving to the same config are equivalent. A different config or non-secret spec returns 409. This create operation does not replace an existing grant.'
      properties:
        client:
          $ref: '#/components/schemas/CustomerManagedOAuthClient'
        method:
          enum:
          - oauth
          type: string
        tokens:
          allOf:
          - $ref: '#/components/schemas/LinkWalletTokenInput'
          writeOnly: true
      required:
      - method
      - client
      - tokens
      type: object
    VaultItemRequest:
      discriminator:
        mapping:
          card: '#/components/schemas/CardVaultItemRequest'
          credential: '#/components/schemas/CredentialVaultItemRequest'
          credential_account: '#/components/schemas/CredentialAccountVaultItemRequest'
          wallet: '#/components/schemas/WalletVaultItemRequest'
        propertyName: type
      oneOf:
      - $ref: '#/components/schemas/WalletVaultItemRequest'
      - $ref: '#/components/schemas/CardVaultItemRequest'
      - $ref: '#/components/schemas/CredentialAccountVaultItemRequest'
      - $ref: '#/components/schemas/CredentialVaultItemRequest'
    ManagedAuthCredentialVaultItemState:
      additionalProperties: false
      properties:
        fields:
          additionalProperties:
            $ref: '#/components/schemas/ManagedAuthCredentialVaultField'
          description: One entry per non-empty value on the connection's saved credential, keyed by the field name to use in fill bindings. Included on single-item responses (create and get) and omitted from list responses, like `value_keys` on credentials. Empty when unavailable or when every stored value is empty. A stored value named totp_secret is never listed or filled. Values are never returned. A totp entry is present when the credential has a TOTP seed; fill writes a generated code for it. Entries follow the connection's credential.
          type: object
        provider:
          enum:
          - managed_auth
          type: string
        status:
          description: Items are created ready, which means the connection has a saved Kernel credential that stores values or a TOTP seed (what has_values or has_totp_secret report on credentials), not that a login succeeded. Unavailable means it no longer does; such items advertise no operations.
          enum:
          - ready
          - unavailable
          type: string
        status_reason:
          description: Present when status is unavailable. connection_not_found means the connection was deleted. no_credential means the connection's credential was deleted or emptied after the item was created. external_credential means the connection was moved to an external credential provider.
          enum:
          - connection_not_found
          - no_credential
          - external_credential
          type: string
      required:
      - provider
      - status
      type: object
    VaultItemExpansionType:
      enum:
      - payment_methods
      type: string
    VaultItemExpanded:
      additionalProperties: false
      description: Live, non-persisted data requested through the item GET expand parameter.
      properties:
        payment_methods:
          items:
            $ref: '#/components/schemas/VaultPaymentMethod'
          type: array
      type: object
    KernelManagedLinkAuthorizationInput:
      additionalProperties: false
      description: Kernel starts and completes the user's Link authorization flow.
      properties:
        client:
          $ref: '#/components/schemas/KernelManagedOAuthClient'
        method:
          enum:
          - oauth
          type: string
      required:
      - method
      - client
      type: object
    VaultPaymentMethodDisplay:
      additionalProperties: false
      properties:
        brand:
          type: string
        label:
          type: string
        last4:
          type: string
      type: object
    OnePasswordFillVaultItemOperationResult:
      additionalProperties: false
      description: The submission result reported by the 1Password extension when available. Kernel returns fill_unknown if the extension call has no conclusive result. Inspect the page to determine successful authentication on the website.
      properties:
        error_code:
          description: Present for fill_failed, and for fill_unknown when the extension reported autosubmitFailed (it filled and submitted the form but could not confirm the fill finished). These are allowlisted 1Password extension codes, never raw errors, secrets, or page content.
          enum:
          - fillFailed
          - autosubmitFailed
          - noExistingCredentials
          - authenticationFailed
          type: string
        status:
          description: Kernel's outcome of the extension call. fill_submitted means the extension reported submission, not website authentication. fill_failed means the extension returned a known failure and includes error_code. fill_unknown means the form may have been filled or submitted without a conclusive result; inspect the page to see the result of the fill.
          enum:
          - fill_submitted
          - fill_failed
          - fill_unknown
          type: string
        type:
          enum:
          - 1pw_fill
          type: string
      required:
      - type
      - status
      type: object
    LinkWalletVaultItemSpec:
      additionalProperties: false
      properties:
        authorization:
          $ref: '#/components/schemas/LinkOAuthAuthorization'
        provider:
          enum:
          - link
          type: string
      required:
      - provider
      - authorization
      type: object
    SpendApprovalAction:
      additionalProperties: false
      properties:
        name:
          enum:
          - spend_approval
          type: string
        url:
          format: uri
          type: string
      required:
      - name
      - url
      type: object
    LinkCardState:
      additionalProperties: false
      description: Issued Link cards retain encrypted card material for the fill operation. Link cards do not expose aliases or support egress substitution.
      properties:
        domains:
          items:
            type: string
          type: array
        masks:
          $ref: '#/components/schemas/VaultItemMasks'
        provider:
          enum:
          - link
          type: string
        status:
          description: recovery_required means an original provider operation has an unresolved outcome and the card cannot be used. Reads keep observing a known provider request and may clear the recovery. To continue, delete this card and create a new one; deleting cancels the original request when its ID is known and keeps the recovery evidence. The user may see an approval request for the original card and should approve only the new one.
          enum:
          - requested
          - pending_authorization
          - ready
          - consumed
          - expired
          - declined
          - recovery_required
          type: string
        status_reason:
          type: string
      required:
      - provider
      - status
      type: object
    LinkOAuthClient:
      discriminator:
        mapping:
          customer_managed: '#/components/schemas/CustomerManagedOAuthClient'
          kernel_managed: '#/components/schemas/KernelManagedOAuthClient'
        propertyName: type
      oneOf:
      - $ref: '#/components/schemas/KernelManagedOAuthClient'
      - $ref: '#/components/schemas/CustomerManagedOAuthClient'
    LinkOAuthAction:
      additionalProperties: false
      properties:
        name:
          enum:
          - link_oauth
          type: string
        url:
          format: uri
          type: string
      required:
      - name
      - url
      type: object
    VaultProviderConfigReference:
      additionalProperties: false
      description: Select a provider config by ID or name. Responses return the ID. Renaming a config does not change existing wallet bindings; an item cannot switch to a different config after creation.
      oneOf:
      - required:
        - id
      - required:
        - name
      properties:
        id:
          minLength: 1
          type: string
        name:
          pattern: ^[a-zA-Z0-9._-]{1,255}$
          type: string
      type: object
    CardVaultItem:
      additionalProperties: false
      properties:
        action:
          $ref: '#/components/schemas/VaultItemAction'
        available_expansions:
          items:
            $ref: '#/components/schemas/AvailableVaultItemExpansion'
          type: array
        available_operations:
          items:
            $ref: '#/components/schemas/AvailableVaultItemOperation'
          type: array
        created_at:
          format: date-time
          type: string
        expires_at:
          format: date-time
          type: string
        id:
          type: string
        key:
          description: Immutable item key assigned when the item is created.
          type: string
        spec:
          $ref: '#/components/schemas/CardVaultItemSpec'
        state:
          $ref: '#/components/schemas/CardVaultItemState'
        type:
          enum:
          - card
          type: string
        updated_at:
          format: date-time
          type: string
      required:
      - id
      - key
      - type
      - spec
      - state
      - available_operations
      - available_expansions
      - created_at
      - updated_at
      type: object
    CredentialVaultItemState:
      discriminator:
        mapping:
          1password: '#/components/schemas/OnePasswordCredentialVaultItemState'
          kernel: '#/components/schemas/KernelCredentialVaultItemState'
          managed_auth: '#/components/schemas/ManagedAuthCredentialVaultItemState'
        propertyName: provider
      oneOf:
      - $ref: '#/components/schemas/KernelCredentialVaultItemState'
      - $ref: '#/components/schemas/OnePasswordCredentialVaultItemState'
      - $ref: '#/components/schemas/ManagedAuthCredentialVaultItemState'
    FillVaultItemOperationResult:
      additionalProperties: false
      properties:
        fields:
          description: One result per request binding, in request order; empty when the fill used no bindings. After the first failed or unknown field, all remaining fields are not_attempted.
          items:
            $ref: '#/components/schemas/VaultFillFieldResult'
          maxItems: 32
          minItems: 0
          type: array
        status:
          description: Completed when the fill finished. Failed when execution stopped with known outcomes. Unknown when an outcome cannot be determined. Completed means values were supplied to the page, not that the site accepted or submitted them.
          enum:
          - completed
          - failed
          - unknown
          type: string
        type:
          enum:
          - fill
          type: string
      required:
      - type
      - status
      - fields
      type: object
    OnePasswordCredentialRequests:
      additionalProperties: false
      description: Credential Request v2 input sent to the extension. A credential item may request up to five login entries.
      properties:
        entries:
          items:
            $ref: '#/components/schemas/OnePasswordCredentialRequestEntry'
          maxItems: 5
          minItems: 1
          type: array
        goal:
          maxLength: 140
          type: string
        version:
          description: Must be 2.
          type: integer
      required:
      - version
      - entries
      type: object
    KernelCardState:
      additionalProperties: false
      description: A ready Kernel card supports authorize, fill, then submit checkout. Card details are delivered for a few minutes after fill; submit promptly. Repeated fill is safe and never submits checkout. Visa purchases require a spend_approval action before details are issued; Mastercard purchases need no hosted approval. masks.last4 is the enrolled card's last four digits; masks.token_last4, when present, is the token's last four digits shown to the merchant. Kernel does not observe whether the merchant charged the card.
      properties:
        domains:
          description: Informational registrable domain. Fill is locked to merchant_url's exact origin.
          items:
            type: string
          type: array
        masks:
          $ref: '#/components/schemas/VaultItemMasks'
        provider:
          enum:
          - kernel
          type: string
        status:
          description: pending_authorization on a Visa purchase waits for the cardholder to approve it through the spend_approval action; an unused link expires after 30 minutes. recovery_required means verification, approving the purchase or issuing the one-time code has an unresolved outcome. A server-classified initial attestation failure before intent dispatch may advertise restart_verification to prepare a fresh local verification link; this does not approve spending or replay any provider request. Unclassified legacy recovery and uncertain intent creation cannot restart. Kernel never approves again or issues another code for the item automatically. To continue, delete this card and create a new purchase; the cardholder approves the new purchase separately. Recovery while reporting a merchant transaction cannot be deleted and must be reconciled with support. When status_reason says the provider refused retrieval before acceptance, no code was issued and a later read retries. declined means the card network refused to issue a code.
          enum:
          - requested
          - pending_authorization
          - ready
          - consumed
          - expired
          - declined
          - recovery_required
          type: string
        status_reason:
          type: string
      required:
      - provider
      - status
      type: object
    AgentCardCardState:
      additionalProperties: false
      properties:
        aliases:
          $ref: '#/components/schemas/VaultCardAliases'
        authorization:
          $ref: '#/components/schemas/AgentCardCheckoutAuthorization'
        masks:
          $ref: '#/components/schemas/VaultItemMasks'
        preparation:
          $ref: '#/components/schemas/AgentCardCheckoutPreparation'
        provider:
          enum:
          - agentcard
          type: string
        status:
          description: ready_to_submit is device readiness for at most 30 seconds. consumed means the prepared attempt has settled, not that an order succeeded. stopped cannot be reused. outcome_unknown requires merchant reconciliation and blocks new requests. recovery_required means the original checkout outcome is unresolved. Automatic reuse is blocked. Known authorization IDs must be reconciled through provider observations or support. When no authorization ID was returned, an explicitly confirmed item deletion may abandon the unresolved attempt so the caller can create a replacement; deletion does not prove that the original attempt failed. It does not mean declined or expired.
          enum:
          - requested
          - ready
          - preparing
          - ready_to_submit
          - pending_approval
          - consumed
          - stopped
          - outcome_unknown
