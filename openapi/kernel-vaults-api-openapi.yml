    CardVaultItemSpec:
      discriminator:
        mapping:
          agentcard: '#/components/schemas/AgentCardCardVaultItemSpec'
          kernel: '#/components/schemas/KernelCardVaultItemSpec'
          link: '#/components/schemas/LinkCardVaultItemSpec'
        propertyName: provider
      oneOf:
      - $ref: '#/components/schemas/LinkCardVaultItemSpec'
      - $ref: '#/components/schemas/AgentCardCardVaultItemSpec'
      - $ref: '#/components/schemas/KernelCardVaultItemSpec'
    CredentialVaultFieldType:
      description: 'Text, email, and password have form inputs; totp and passkey do not and are omitted from

        both Kernel-hosted and customer React forms. Password, totp, and passkey must be sensitive.

        A totp value is an RFC 4648 Base32 generator seed (case-insensitive, optional

        trailing padding), not an otpauth URI or current code. Reject invalid or empty

        decoded seeds. Browser fill generates an RFC 6238 code at execution time using

        HMAC-SHA1, 6 digits, and a 30-second period. Preserve leading zeros; never fill

        the seed. Custom algorithms, digits, periods, and form enrollment are unsupported.

        A passkey value is a JSON-encoded FIDO Credential Exchange Format passkey object

        with unpadded base64url `credentialId`, `userHandle` (at most 64 bytes), and `key`

        (a PKCS#8 ECDSA P-256 private key), a lowercase `rpId` domain, and optional

        `username` and `userDisplayName`. Other CXF members are ignored. Passkeys are never

        filled into pages.

        '
      enum:
      - text
      - email
      - password
      - totp
      - passkey
      type: string
    LinkOAuthAuthorization:
      additionalProperties: false
      properties:
        client:
          $ref: '#/components/schemas/LinkOAuthClient'
        method:
          enum:
          - oauth
          type: string
      required:
      - method
      - client
      type: object
    VaultAgentCardProviderConfigRequest:
      additionalProperties: false
      description: Register application credentials for AgentCard wallet enrollment and checkout approvals. Kernel obtains application access tokens using client_credentials.
      properties:
        credentials:
          $ref: '#/components/schemas/VaultAgentCardProviderClientCredentials'
          writeOnly: true
        name:
          description: Unique within the organization.
          pattern: ^[a-zA-Z0-9._-]{1,255}$
          type: string
        provider:
          enum:
          - agentcard
          type: string
      required:
      - name
      - provider
      - credentials
      type: object
    AgentCardWalletVaultItemSpec:
      additionalProperties: false
      description: 'AgentCard wallet. Omit provider_config to use Kernel-managed credentials, or select a customer-owned configuration. Mode (sandbox vs live) is determined by the selected credential; there is no per-item test flag. Without user_id, creation returns a hosted enrollment action and Kernel polls until the user connects. With a customer-owned provider_config, user_id imports an existing connection after verifying access with the selected credentials in their sandbox or live mode; no hosted enrollment is needed, even if the connected user has no stored cards. With Kernel-managed credentials, user_id may only reference a user already enrolled by a wallet in this organization under the same configuration. The user and configuration bindings cannot be changed after creation. Import validation is read-only and runs before creation: a failed validation leaves no wallet or reserved key, so the user_id can be corrected and retried. Concurrent imports of the same key may both validate, but create at most one wallet and connected event.'
      properties:
        provider:
          enum:
          - agentcard
          type: string
        provider_config:
          $ref: '#/components/schemas/VaultProviderConfigReference'
          description: Select an AgentCard configuration. The wallet's configuration cannot be changed after creation.
        user_id:
          pattern: ^usr_[A-Za-z0-9_]+$
          type: string
      required:
      - provider
      type: object
    VaultProviderConfig:
      discriminator:
        mapping:
          agentcard: '#/components/schemas/VaultAgentCardProviderConfig'
          link: '#/components/schemas/VaultLinkProviderConfig'
        propertyName: provider
      oneOf:
      - $ref: '#/components/schemas/VaultLinkProviderConfig'
      - $ref: '#/components/schemas/VaultAgentCardProviderConfig'
    FillVaultItemOperationRequest:
      additionalProperties: false
      description: 'Use a vault item in a browser session, for example to fill a login or

        payment form. Only invoke when the item advertises `fill`; the advertised

        operation describes the inputs that item needs. Requires `browser_id` and

        usually `page_url`; some items also require `fields`. Browser and vault must

        belong to the same project. Kernel checks access and allowed destinations

        before filling; providing a page URL does not authorize a destination.


        Fill never submits forms or clicks buttons, though input and change events

        may trigger site behavior. It is not atomic: completed steps are not rolled

        back. Fill does not consume the item, so a failed or indeterminate fill is

        safe to retry. A retry right after an indeterminate fill may wait up to 15

        seconds for the earlier attempt''s browser lock to expire.


        Secret values are never returned or included in operation logs, traces,

        audit events, or error details. This does not prevent an agent with

        unrestricted browser access from reading values from the page or other

        browser observation surfaces.

        '
      example:
        browser_id: browser-session-id
        fields:
        - field: number
          selector: '#card-number'
        - field: exp_month
          selector: '#expiry-month'
        - field: exp_year
          selector: '#expiry-year'
        - field: cvc
          selector: '#security-code'
        page_url: https://shop.example/checkout
        type: fill
      properties:
        browser_id:
          description: Browser session ID, not a reusable browser name.
          minLength: 1
          type: string
        fields:
          description: 'Field bindings, when the item''s advertised fill operation requires them.

            Each selector is searched in the main frame and all descendant frames and

            must resolve to exactly one editable input or select, matched directly or

            through a containing element; zero or multiple candidates fail, and no two

            bindings may resolve to the same element. Select elements match an option

            by value, not label. All bindings are validated before any write, then

            filled in request order, stopping at the first failure. If the page

            navigates or a target disappears, fill stops rather than choosing another

            page or element.

            '
          items:
            $ref: '#/components/schemas/VaultFillField'
          maxItems: 32
          minItems: 1
          type: array
          x-go-type-skip-optional-pointer: true
        page_url:
          description: Exact current top-level page URL, including path, query, and fragment. Must match exactly one open page in the browser; zero or multiple matches fail. No prefix or glob matching. When an item allows omitting it, the browser must have exactly one open page.
          format: uri
          pattern: ^\S+$
          type: string
          x-go-type-skip-optional-pointer: true
        timeout_ms:
          default: 30000
          description: Total operation deadline in milliseconds, not a per-field timeout.
          maximum: 30000
          minimum: 1
          type: integer
        type:
          enum:
          - fill
          type: string
      required:
      - type
      - browser_id
      type: object
    WalletVaultItemSpec:
      discriminator:
        mapping:
          agentcard: '#/components/schemas/AgentCardWalletVaultItemSpec'
          kernel: '#/components/schemas/KernelWalletVaultItemSpec'
          link: '#/components/schemas/LinkWalletVaultItemSpec'
        propertyName: provider
      oneOf:
      - $ref: '#/components/schemas/LinkWalletVaultItemSpec'
      - $ref: '#/components/schemas/AgentCardWalletVaultItemSpec'
      - $ref: '#/components/schemas/KernelWalletVaultItemSpec'
    KernelCredentialVaultItemSpec:
      additionalProperties: false
      properties:
        description:
          description: Recognizable site or service name displayed verbatim as the form title, without suffixes such as sign-in credentials. Display text only, not an enforced destination policy.
          maxLength: 16384
          type: string
        fields:
          description: Ordered field definitions rendered in this order by credential collection forms.
          items:
            $ref: '#/components/schemas/CredentialVaultFieldDefinition'
          maxItems: 32
          minItems: 1
          type: array
        provider:
          enum:
          - kernel
          type: string
      required:
      - provider
      - fields
      type: object
    VaultRequest:
      additionalProperties: false
      properties:
        name:
          description: Immutable name used to create or retrieve the vault.
          maxLength: 255
          minLength: 1
          pattern: ^[a-zA-Z0-9._-]{1,255}$
          type: string
      required:
      - name
      type: object
    PushApprovalAction:
      additionalProperties: false
      properties:
        name:
          enum:
          - push_approval
          type: string
      required:
      - name
      type: object
    VaultFillField:
      additionalProperties: false
      properties:
        field:
          description: A credential field name from the item's declared fields (Kernel) or state.fields from a single-item read (managed auth), or a supported card field. Unset credential fields cannot be filled.
          minLength: 1
          type: string
        format:
          description: Required only for a card's combined expiration field. Forbidden for other card fields and all credential fields.
          enum:
          - MM/YY
          - MM/YYYY
          type: string
        selector:
          minLength: 1
          type: string
      required:
      - field
      - selector
      type: object
    AgentCardCardVaultItemSpec:
      additionalProperties: false
      description: AgentCard reusable live payment card. Test-mode card creation is not supported. Each checkout creates an authorization for spec.merchant / spec.amount that the cardholder approves, unless AgentCard runs it under one of the cardholder's autopilot rules. The card stays ready after each authorization.
      properties:
        amount:
          description: Integer amount in minor currency units.
          format: int64
          maximum: 9007199254740991
          minimum: 1
          type: integer
        card_id:
          description: Opaque card ID returned by AgentCard for a card in the connected wallet. Pass it through unchanged without assuming a prefix or format. Omitted, the cardholder picks on the approval screen.
          maxLength: 256
          minLength: 1
          type: string
        checkout_origin:
          description: 'Origin of the top-level checkout page, such as https://shop.example.com: https, a lowercase host, a port only when it is not 443, and no path. http is accepted only for localhost test pages. Checkouts without a preparation send it to AgentCard, which uses it to match the cardholder''s autopilot rules; prepared checkouts send the preparation''s merchant_origin instead. Kernel sends the declared value and does not compare it with the page the browser has open. Omitted, those checkouts ask the cardholder to approve. Card updates replace the whole spec, so an update that omits it removes it.'
          minLength: 1
          type: string
        currency:
          maxLength: 3
          minLength: 3
          pattern: ^[A-Za-z]{3}$
          type: string
        merchant:
          description: Merchant name shown on the cardholder's approval screen.
          maxLength: 120
          minLength: 1
          type: string
        provider:
          enum:
          - agentcard
          type: string
        wallet:
          description: Wallet item key used to authorize checkouts.
          type: string
      required:
      - provider
      - wallet
      - merchant
      - amount
      - currency
      type: object
    WalletVaultItemState:
      discriminator:
        mapping:
          agentcard: '#/components/schemas/AgentCardWalletState'
          kernel: '#/components/schemas/KernelWalletState'
          link: '#/components/schemas/LinkWalletState'
        propertyName: provider
      oneOf:
      - $ref: '#/components/schemas/LinkWalletState'
      - $ref: '#/components/schemas/AgentCardWalletState'
      - $ref: '#/components/schemas/KernelWalletState'
    OnePasswordCredentialVaultItemState:
      additionalProperties: false
      properties:
        access_request:
          $ref: '#/components/schemas/OnePasswordAccessRequestState'
        access_request_id:
          description: Opaque request ID returned by the 1Password broker after a successful createAccessRequest call.
          type: string
        provider:
          enum:
          - 1password
          type: string
        status:
          enum:
          - pending_authorization
          - ready
          - declined
          - failed
          type: string
        status_reason:
          type: string
      required:
      - provider
      - status
      type: object
    VaultItem:
      discriminator:
        mapping:
          card: '#/components/schemas/CardVaultItem'
          credential: '#/components/schemas/CredentialVaultItem'
          credential_account: '#/components/schemas/CredentialAccountVaultItem'
          wallet: '#/components/schemas/WalletVaultItem'
        propertyName: type
      oneOf:
      - $ref: '#/components/schemas/WalletVaultItem'
      - $ref: '#/components/schemas/CardVaultItem'
      - $ref: '#/components/schemas/CredentialAccountVaultItem'
      - $ref: '#/components/schemas/CredentialVaultItem'
    CardVaultItemUpdateRequest:
      additionalProperties: false
      properties:
        spec:
          $ref: '#/components/schemas/CardVaultItemSpec'
        type:
          enum:
          - card
          type: string
          x-go-type-skip-optional-pointer: true
      required:
      - spec
      type: object
    KernelWalletVaultItemSpec:
      additionalProperties: false
      description: 'One card stored with Kernel-managed credentials. Creation returns a card_enrollment action: the cardholder enters the card and their email on a Kernel-hosted page, and the wallet connects once the card is stored. Kernel then enrolls it for an agentic network token when the issuer supports it. The card number never reaches Kernel. The connected wallet''s payment_methods expansion lists the card; capabilities.single_use_card.eligible is false, with a network_token_* reason, until the card has a network token, and authorize returns 400 for such a card unless Kernel supports checkout delivery without a network token for that card. In that case, fill types the checkout details. Visa purchases require the cardholder to complete a spend_approval action before Kernel issues a one-time code; Mastercard purchases need no hosted approval.'
      properties:
        provider:
          enum:
          - kernel
          type: string
      required:
      - provider
      type: object
    VaultAgentCardProviderClientCredentials:
      $ref: '#/components/schemas/VaultOAuthClientCredentials'
    VaultPaymentMethod:
      additionalProperties: false
      properties:
        capabilities:
          $ref: '#/components/schemas/VaultPaymentMethodCapabilities'
        display:
          $ref: '#/components/schemas/VaultPaymentMethodDisplay'
        id:
          type: string
        is_default:
          type: boolean
        provider:
          description: Provider that issued this payment-method ID.
          type: string
        type:
          description: Provider-neutral payment-method type normalized to lowercase.
          type: string
      required:
      - id
      - provider
      - type
      - is_default
      - display
      - capabilities
      type: object
    CredentialAccountVaultItem:
      additionalProperties: false
      properties:
        action:
          $ref: '#/components/schemas/OnePasswordOAuthAction'
        available_expansions:
          items:
            $ref: '#/components/schemas/AvailableVaultItemExpansion'
          maxItems: 0
          type: array
        available_operations:
          description: Advertises 1pw_recover when Kernel can recover a failed account link. Recovery is unavailable while authorization is pending or after the connection has already been reset.
          items:
            $ref: '#/components/schemas/AvailableVaultItemOperation'
          maxItems: 1
          type: array
        created_at:
          format: date-time
          type: string
        expires_at:
          format: date-time
          type: string
        id:
          type: string
        key:
          description: Immutable item key assigned when the item is created.
          type: string
        spec:
          $ref: '#/components/schemas/OnePasswordCredentialAccountSpec'
        state:
          $ref: '#/components/schemas/OnePasswordCredentialAccountState'
        type:
          enum:
          - credential_account
          type: string
        updated_at:
          format: date-time
          type: string
      required:
      - id
      - key
      - type
      - spec
      - state
      - available_operations
      - available_expansions
      - created_at
      - updated_at
      type: object
    LinkWalletVaultItemRequestSpec:
      additionalProperties: false
      properties:
        authorization:
          oneOf:
          - $ref: '#/components/schemas/KernelManagedLinkAuthorizationInput'
          - $ref: '#/components/schemas/ImportedLinkAuthorizationInput'
        provider:
          enum:
          - link
          type: string
      required:
      - provider
      - authorization
      type: object
    KernelCardVaultItemSpec:
      additionalProperties: false
      description: 'One live purchase with a Kernel-enrolled card. Authorization obtains an agentic network token number, expiry and one-time 3-digit code. They are stored encrypted for the fill operation, which types them only on merchant_url''s origin; the merchant''s own checkout submits the payment. The one-time code is valid until the item''s expires_at; fill and submit checkout before then. Mastercard purchases need no cardholder approval. A Visa purchase returns a spend_approval action: the cardholder approves it with a Visa passkey, and Kernel registers a Visa intent for one transaction up to the amount before issuing the code. For supported cards whose network cannot be enrolled for agentic tokens, authorize prepares checkout details without issuing a one-time code. The card can be filled into one checkout before its expires_at, one hour after authorization. Fill types those details on merchant_url''s origin. The amount, merchant_url and merchant_country are recorded but do not restrict payment requests sent by the browser. Card updates are not supported; delete and create a new item instead.'
      properties:
        amount:
          description: Integer amount in minor currency units (at most 1000000), bound to the one-time code.
          format: int64
          maximum: 1000000
          minimum: 1
          type: integer
        currency:
          description: 'ISO 4217 code. Supported: aud, brl, cad, chf, czk, dkk, eur, gbp, hkd, inr, jpy, krw, mxn, nok, nzd, pln, sek, sgd, usd, zar.'
          maxLength: 3
          minLength: 3
          pattern: ^[A-Za-z]{3}$
          type: string
        merchant_category:
          description: Actual merchant category when known. Omit rather than invent a category.
          maxLength: 255
          minLength: 1
          type: string
        merchant_category_code:
          description: Actual merchant MCC when known. Omit rather than invent a code. 0000 is not accepted.
          pattern: ^[0-9]{4}$
          type: string
        merchant_country:
          description: The merchant's ISO 3166-1 alpha-2 country code. Required for Visa cards, whose one-time code is issued for the merchant's country.
          maxLength: 2
          minLength: 2
          pattern: ^[A-Za-z]{2}$
          type: string
        merchant_name:
          maxLength: 255
          minLength: 1
          type: string
        merchant_url:
          description: Merchant checkout URL. Fill is allowed only on this URL's origin.
          format: uri
          pattern: ^https://
          type: string
        provider:
          enum:
          - kernel
          type: string
        wallet:
          description: Key of the Kernel wallet item whose enrolled card pays.
          type: string
      required:
      - provider
      - wallet
      - amount
      - currency
      - merchant_name
      - merchant_url
      type: object
    ErrorDetail:
      properties:
        code:
          description: Lower-level error code providing more specific detail
          example: invalid_input
          type: string
        message:
          description: Further detail about the error
          example: Provided version string is not semver compliant
          type: string
      type: object
    KernelCredentialVaultItemSpecInput:
      additionalProperties: false
      description: Credential fields are for login and other non-payment credentials. Do not store, collect, or fill credit card data in credential items. Use wallet and card item types for credit cards and payment checkout instead. Field order is preserved in the user-facing collection form, so list fields in the same top-to-bottom order as the website.
      properties:
        description:
          description: The site's recognizable display name, used verbatim as the user-facing form title (for example, Hacker News). Use only the site or service name; do not append sign-in, login, credentials, or task instructions. This is display text, not an enforced destination policy. At most 16 KiB in UTF-8 bytes.
          maxLength: 16384
          type: string
        fields:
          description: Ordered field definitions. Use the website's top-to-bottom field order; the collection form renders this order unchanged.
          items:
            $ref: '#/components/schemas/CredentialVaultFieldInput'
          maxItems: 32
          minItems: 1
          type: array
        provider:
          enum:
          - kernel
          type: string
      required:
      - provider
      - fields
      type: object
    CredentialVaultFieldDefinitionInput:
      additionalProperties: false
      description: A field definition without a value. Field updates add fields with this shape and set their values in `fields`.
      properties:
        label:
          description: Optional human-readable display label. It is returned as non-secret metadata and never affects value keys, updates, or browser fills. Use single-line, trimmed display text without control or formatting characters. The server enforces a 128-byte UTF-8 limit.
          maxLength: 128
          minLength: 1
          pattern: ^\S(?:.*\S)?$
          type: string
        name:
          description: Unique stable field name used to key values, updates, and browser fills.
          pattern: ^[a-zA-Z][a-zA-Z0-9_]{0,63}$
          type: string
        required:
          default: true
          type: boolean
        sensitive:
          default: true
          description: Set false explicitly for ordinary usernames, email addresses, and other non-secret identifiers. Reserve true for secrets such as passwords, API tokens, and TOTP seeds. Password, totp, and passkey fields must be true. Omission defaults to true for safety; do not rely on that default for every field. False permits API reads and form prefilling.
          type: boolean
        type:
          $ref: '#/components/schemas/CredentialVaultFieldType'
      required:
      - name
      - type
      type: object
    VaultEncryptionKey:
      additionalProperties: false
      description: Public key for encrypted_value on credential fields. Use this only if you run your own credential collection web app and want values encrypted in the browser, sent to your backend still encrypted, and forwarded to Kernel's API still encrypted. In every other case, including server-side code that already holds the plaintext, use value. Each vault has its own key; a value encrypted for one vault is rejected by every other vault. The key is created on first request and stays the same for the vault's lifetime, so it may be cached.
      properties:
        alg:
          description: JWE key management algorithm.
          enum:
          - ECDH-ES
          type: string
        enc:
          description: JWE content encryption algorithm.
          enum:
          - A256GCM
          type: string
        jwk:
          $ref: '#/components/schemas/VaultEncryptionPublicJWK'
        kid:
          description: Key ID. Set it as the kid protected header of every encrypted_value.
          type: string
      required:
      - kid
      - alg
      - enc
      - jwk
      type: object
    VaultItemAction:
      discriminator:
        mapping:
          1password_oauth: '#/components/schemas/OnePasswordOAuthAction'
          card_enrollment: '#/components/schemas/CardEnrollmentAction'
          collect: '#/components/schemas/CollectAction'
          embedded_ceremony: '#/components/schemas/EmbeddedCeremonyAction'
          link_oauth: '#/components/schemas/LinkOAuthAction'
          mfa: '#/components/schemas/MfaAction'
          push_approval: '#/components/schemas/PushApprovalAction'
          spend_approval: '#/components/schemas/SpendApprovalAction'
        propertyName: name
      oneOf:
      - $ref: '#/components/schemas/LinkOAuthAction'
      - $ref: '#/components/schemas/OnePasswordOAuthAction'
      - $ref: '#/components/schemas/SpendApprovalAction'
      - $ref: '#/components/schemas/PushApprovalAction'
      - $ref: '#/components/schemas/CollectAction'
      - $ref: '#/components/schemas/MfaAction'
      - $ref: '#/components/schemas/EmbeddedCeremonyAction'
      - $ref: '#/components/schemas/CardEnrollmentAction'
    VaultItemOperationResponse:
      description: Authorization and preparation return the existing item shape. Fill returns a value-free result; WebMCP invocation returns the tool's output. Neither persists transient outcomes on the item.
      oneOf:
      - $ref: '#/components/schemas/VaultItem'
      - $ref: '#/components/schemas/FillVaultItemOperationResult'
      - $ref: '#/components/schemas/OnePasswordFillVaultItemOperationResult'
      - $ref: '#/components/schemas/WebMCPInvokeVaultItemOperationResult'
    RestartVerificationVaultItemOperationRequest:
      additionalProperties: false
      description: Explicitly prepare a fresh local verification session for the same Kernel Visa purchase and connected wallet, only when restart_verification is advertised. Kernel must have durable proof of an initial attestation failure before intent dispatch. Replaces the spend_approval capability and discards session-bound verification data without calling the provider or granting spend consent. The cardholder must use the new link, verify again and explicitly approve the purchase. Unknown intent creation, legacy unclassified recovery, enrollment completion, issuance and confirmation cannot restart. Do not automatically retry this operation.
      properties:
        type:
          enum:
          - restart_verification
          type: string
          x-go-type: VaultItemOperationType
      required:
      - type
      type: object
    AgentCardCheckoutAuthorization:
      additionalProperties: false
      description: The in-flight or most recent checkout authorization. Present while a checkout is pending approval and after it settles.
      properties:
        actual_cents:
          format: int64
          type: integer
        amount:
          description: Display amount shown on the approval screen.
          type: string
        amount_authority:
          enum:
          - display_only
          - stripe_payment_intent
          type: string
        amount_cents:
          format: int64
          type: integer
        amount_verified:
          type: boolean
        approval_url:
          format: uri
          type: string
        browser_id:
          description: Browser session that submitted the checkout.
          type: string
        charged_amount_cents:
          format: int64
          type: integer
        charged_currency:
          type: string
        charged_kind:
          enum:
          - captured
          - authorized
          - none
          type: string
        created_at:
          format: date-time
          type: string
        currency:
          type: string
        expected_cents:
          format: int64
          type: integer
        expires_at:
          format: date-time
          type: string
        id:
          type: string
        merchant:
          type: string
        psp:
          type: string
        psp_error_code:
          type: string
        reason:
          type: string
        replay_attempted:
          type: boolean
        replay_delivered:
          description: Whether the processor response was delivered to the browser.
          type: boolean
        replay_status:
          description: HTTP status of the replayed processor response.
          type: integer
        status:
          enum:
          - awaiting_approval
          - approved
          - declined
          - expired
          type: string
      required:
      - id
      - status
      - psp
      - merchant
      - amount_cents
      - currency
      - created_at
      type: object
    LinkWalletTokenInput:
      additionalProperties: false
      description: Send the token pair from your backend. Both tokens must be from the same Link grant under the referenced client. Supply a currently valid access token. Kernel refreshes when needed after import and uses the expiry returned by Link for subsequent tokens. Tokens are never returned in wallet responses, events, or logs.
      properties:
        access_token:
          minLength: 1
          type: string
          writeOnly: true
        refresh_token:
          minLength: 1
          type: string
          writeOnly: true
      required:
      - access_token
      - refresh_token
      type: object
    OnePasswordCredentialRequestEntry:
      additionalProperties: false
      properties:
        keywords:
          items:
            maxLength: 50
            minLength: 1
            type: string
          maxItems: 5
          minItems: 1
          type: array
        parameters:
          additionalProperties: false
          properties:
            website:
              format: uri
              maxLength: 2083
              pattern: ^https://
              type: string
          required:
          - website
          type: object
        reason:
          maxLength: 100
          type: string
        type:
          description: Must be login.
          type: string
      required:
      - type
      - parameters
      type: object
    VaultWebMCPBinding:
      additionalProperties: false
      properties:
        field:
          description: A declared, populated credential field or supported card field. A TOTP field supplies a fresh code, never its seed. Passkey fields cannot be filled.
          minLength: 1
          type: string
        format:
          description: Required for card expiration (MM/YY or MM/YYYY), forbidden for other fields. Invalid formats are rejected before invocation.
          type: string
        input_path:
          description: RFC 6901 JSON Pointer to an existing null value in input. Object keys are exact; array indices must be canonical and in range. No root or array-append paths. Each path and each field may occur only once.
          minLength: 1
          type: string
      required:
      - field
      - input_path
      type: object
    OnePasswordOAuthAction:
      additionalProperties: false
      properties:
        name:
          enum:
          - 1password_oauth
          type: string
        url:
          description: 1Password-hosted OAuth authorization URL for the human to open.
          format: uri
          type: string
      required:
      - name
      - url
      type: object
    MfaAction:
      additionalProperties: false
      properties:
        name:
          enum:
          - mfa
          type: string
      required:
      - name
      type: object
    CollectVaultItemOperationRequest:
      additionalProperties: false
      description: 'Return the credential item with its collection action. Supported for ready

        and pending_collection credential items. Always render the same form from

        every form-supported field; totp and passkey fields have no form input and are omitted.

        No caller-selected field subsets or form overrides are accepted.

        Reuse an active Kernel-hosted session or renew an expired session atomically.

        Customer-hosted forms use their own backend and ordinary item GET/PATCH. Opening

        the form does not clear values or change readiness or item version.

        To observe edits on a ready item, record its version and poll GET without

        wait until the version changes, then reconcile the returned state. Version

        changes may also come from PATCH; they do not identify a particular form

        submission. Customer-hosted apps use their own submission callback, including

        for unchanged forms. The wait parameter waits for readiness, not edits.

        '
      properties:
        type:
          enum:
          - collect
          type: string
      required:
      - type
      type: object
    ManagedAuthCredentialVaultItemSpec:
      additionalProperties: false
      properties:
        connection_id:
          description: ID of the managed auth connection whose saved credential this item reads. List connections with `GET /auth/connections`.
          type: string
        description:
          description: Display text supplied when the item was created. Omitted when none was given.
          maxLength: 16384
          type: string
        provider:
          enum:
          - managed_auth
          type: string
      required:
      - provider
      - connection_id
      type: object
    OnePasswordCredentialAccountSpec:
      additionalProperties: false
      properties:
        authorization:
          $ref: '#/components/schemas/OnePasswordOAuthAuthorization'
        provider:
          enum:
          - 1password
          type: string
      required:
      - provider
      - authorization
      type: object
    WalletVaultItemRequest:
      additionalProperties: false
      properties:
        spec:
          discriminator:
            mapping:
              agentcard: '#/components/schemas/AgentCardWalletVaultItemSpec'
              kernel: '#/components/schemas/KernelWalletVaultItemSpec'
              link: '#/components/schemas/LinkWalletVaultItemRequestSpec'
            propertyName: provider
          oneOf:
          - $ref: '#/components/schemas/LinkWalletVaultItemRequestSpec'
          - $ref: '#/components/schemas/AgentCardWalletVaultItemSpec'
          - $ref: '#/components/schemas/KernelWalletVaultItemSpec'
        type:
          enum:
          - wallet
          type: string
      required:
      - type
      - spec
      type: object
    VaultLinkProviderClientCredentials:
      additionalProperties: false
      properties:
        client_id:
          minLength: 1
          type: string
        client_secret:
          minLength: 1
          type: string
          writeOnly: true
        publishable_key:
          description: Stripe publishable key for the account that owns the Link OAuth client. Link requires it as the bearer credential when Kernel refreshes or revokes imported wallet grants; without it, those wallets stop working when the imported access token expires.
          pattern: ^pk_(live|test)_[A-Za-z0-9]+$
          type: string
      required:
      - client_id
      - client_secret
      type: object
    OnePasswordRecoverVaultItemOperationRequest:
      additionalProperties: false
      description: Kernel encountered a recoverable error while linking this 1Password account. Use this action to get a new link to recover the connection. After recovery completes, start a new authorization on the same item.
      properties:
        type:
          enum:
          - 1pw_recover
          type: string
          x-go-type: VaultItemOperationType
      required:
      - type
      type: object
    Error:
      properties:
        code:
          description: Application-specific error code (machine-readable)
          example: bad_request
          type: string
        details:
          description: Additional error details (for multiple errors)
          items:
            $ref: '#/components/schemas/ErrorDetail'
          type: array
        inner_error:
          $ref: '#/components/schemas/ErrorDetail'
        message:
          description: Human-readable error description for debugging
          example: 'Missing required field: app_name'
          type: string
      required:
      - code
      - message
      type: object
    OnePasswordPollAccessVaultItemOperationRequest:
      additionalProperties: false
      description: Retrieve the status of a 1Password access request after presenting the approval link. On a confirmed failed status, ask the end-user before deleting and recreating the credential item for at most one new request. Do not retry an uncertain dispatched request. The response remains non-secret; approved references are retained only for fill.
      properties:
        timeout_seconds:
          default: 10
          maximum: 120
          minimum: 0
          type: integer
        type:
          enum:
          - 1pw_access_request_status
          type: string
          x-go-type: VaultItemOperationType
      required:
      - type
      type: object
    CredentialVaultEncryptedValue:
      description: Alternative to value for custom credential collection web apps. Use this only if you run your own credential collection web app and want values encrypted in the browser, sent to your backend still encrypted, and forwarded to Kernel's API still encrypted. In every other case, including server-side code that already holds the plaintext, use value. The field's value encrypted client-side as a compact JWE with alg ECDH-ES and enc A256GCM to the key from GET /vaults/{id_or_name}/encryption_key, with that key's kid in the protected header. Compression is not supported. The decrypted value follows the same rules as value, including that an empty string clears the field on update. A kid that is not this vault's key returns 400 encryption_key_mismatch; fetch the key again and re-encrypt. Other malformed or undecryptable values return 400 invalid_request. The whole request body is limited to 128 KiB.
      maxLength: 24576
      minLength: 1
      type: string
    OnePasswordAccessRequestState:
      additionalProperties: false
      description: Non-secret broker state. Granted credential references stay encrypted server-side and can only be used by the fill operation.
      properties:
        createdAt:
          description: Provider-created timestamp as returned by the broker.
          type: string
        entries:
          description: Login entries returned directly on accessRequest by the observed extension build. Omitted when the provider does not supply them.
          items:
            $ref: '#/components/schemas/OnePasswordReturnedRequestEntry'
          type: array
        goal:
          description: Goal echoed by the observed createAccessRequest response when present.
          type: string
        granted_count:
          minimum: 0
          type: integer
        has_autofill_token:
          type: boolean
        id:
          type: string
        identity:
          description: Opaque provider identity returned by the broker.
          type: string
        path:
          description: Provider path if supplied in the broker response.
          type: string
        request:
          $ref: '#/components/schemas/OnePasswordReturnedRequest'
        state:
          description: One of pending, resolved, denied, or failed.
          type: string
      required:
      - id
      - state
      - has_autofill_token
      type: object
    VaultItemUpdateRequest:
      description: Type must match the stored item; an update cannot change item type. Legacy card updates may omit type. Credential updates require explicit type and version. Wallet updates are unsupported.
      oneOf:
      - $ref: '#/components/schemas/CardVaultItemUpdateRequest'
      - $ref: '#/components/schemas/CredentialVaultItemUpdateRequest'
    VaultPaymentMethodCapabilities:
      additionalProperties: false
      description: Provider-reported advisory capabilities. A missing capability is unknown, not ineligible; only eligible=false is an explicit negative signal.
      properties:
        single_use_card:
          $ref: '#/components/schemas/VaultPaymentMethodCapability'
      type: object
    KernelWalletState:
      additionalProperties: false
      properties:
        provider:
          enum:
          - kernel
          type: string
        status:
          description: pending_authorization asks the cardholder to use the card_enrollment action. connected means the card is stored; it can pay once payment_methods reports capabilities.single_use_card.eligible. reconnect_required asks the cardholder to use a new card_enrollment action after an uncertain enrollment was safely removed. degraded means the enrollment outcome is unknown and the wallet must be deleted before adding another card.
          enum:
          - pending_authorization
          - connected
          - reconnect_required
          - degraded
          type: string
        status_reason:
          type: string
      required:
      - provider
      - status
      type: object
    CredentialVaultItemRequest:
      additionalProperties: false
      description: 'Ask the end-user whether to link their site credential through 1Password.

        If they choose 1Password, connect their account and request access to a login

        in their own non-shared vault; passkeys are not supported. If they decline

        or that path fails, collect a Kernel-hosted credential item instead. Never

        automatically retry an uncertain 1Password request. After an uncertain fill,

        inspect the page to see the result of the fill.

        Do not use credential items for credit card data. Use wallet and card item types instead.

        Kernel credentials declare fields and may enter pending_collection.

        1Password credentials either reference a connected credential_account or

        store a supplied access token and integration key encrypted on the item.

        They store no login values or selectors.

        Managed auth credentials reference a managed auth connection in the same

        project that already has a saved credential, and read it at fill time;

        they store no values.

        Repeating the original creation request returns the current item without

        overwriting later state. A different request at the same key returns 409.

        '
      properties:
        spec:
          $ref: '#/components/schemas/CredentialVaultItemSpecInput'
        type:
          enum:
          - credential
          type: string
      required:
      - type
      - spec
      type: object
    CredentialVaultFieldDefinition:
      additionalProperties: false
      properties:
        label:
          description: Optional human-readable display label. It is returned as non-secret metadata and never affects value keys, updates, or browser fills. Use single-line, trimmed display text without control or formatting characters. The server enforces a 128-byte UTF-8 limit.
          maxLength: 128
          minLength: 1
          pattern: ^\S(?:.*\S)?$
          type: string
        name:
          description: Stable field name used to key values, updates, and browser fills.
          pattern: ^[a-zA-Z][a-zA-Z0-9_]{0,63}$
          type: string
        required:
          description: Whether a nonempty value is required for readiness and form submission.
          type: boolean
        sensitive:
          description: Whether the value is omitted from every item response. Reserve true for secrets such as passwords, API tokens, and TOTP seeds. Ordinary usernames and email addresses should be false so the form can display and prefill them.
          type: boolean
        type:
          $ref: '#/components/schemas/CredentialVaultFieldType'
      required:
      - name
      - type
      - required
      - sensitive
      type: object
    AgentCardPreparedProcessor:
      enum:
      - square
      - braintree
      - worldpay
      - bambora
      - mercado_pago
      - adyen
      type: string
    WalletVaultItem:
      additionalProperties: false
      properties:
        action:
          $ref: '#/components/schemas/VaultItemAction'
        available_expansions:
          items:
            $ref: '#/components/schemas/AvailableVaultItemExpansion'
          type: array
        available_operations:
          items:
            $ref: '#/components/schemas/AvailableVaultItemOperation'
          type: array
        created_at:
          format: date-time
          type: string
        description:
          description: Server-generated provider and lifecycle guidance for agents.
          readOnly: true
          type: string
        expanded:
          $ref: '#/components/schemas/VaultItemExpanded'
        expires_at:
          format: date-time
          type: string
        id:
          type: string
        key:
          description: Immutable item key assigned when the item is created.
          type: string
        spec:
          $ref: '#/components/schemas/WalletVaultItemSpec'
        state:
          $ref: '#/components/schemas/WalletVaultItemState'
        type:
          enum:
          - wallet
          type: string
        updated_at:
          format: date-time
          type: string
      required:
      - id
      - key
      - type
      - spec
      - state
      - available_operations
      - available_expansions
      - created_at
      - updated_at
      type: object
    VaultItemOperationRequest:
      discriminator:
        mapping:
          1pw_access_request_status: '#/components/schemas/OnePasswordPollAccessVaultItemOperationRequest'
          1pw_create_access_request: '#/components/schemas/OnePasswordRequestAccessVaultItemOperationRequest'
          1pw_fill: '#/components/schemas/OnePasswordFillVaultItemOperationRequest'
          1pw_recover: '#/components/schemas/OnePasswordRecoverVaultItemOperationRequest'
          1pw_update_access_token: '#/components/schemas/OnePasswordUpdateAccessTokenVaultItemOperationRequest'
          authorize: '#/components/schemas/AuthorizeVaultItemOperationRequest'
          collect: '#/components/schemas/CollectVaultItemOperationRequest'
          confirm_transaction: '#/components/schemas/ConfirmTransactionVaultItemOperationRequest'
          fill: '#/components/schemas/FillVaultItemOperationRequest'
          prepare_checkout: '#/components/schemas/PrepareCheckoutVaultItemOperationRequest'
          restart_verification: '#/components/schemas/RestartVerificationVaultItemOperationRequest'
          webmcp_invoke: '#/components/schemas/WebMCPInvokeVaultItemOperationRequest'
        propertyName: type
      oneOf:
      - $ref: '#/components/schemas/AuthorizeVaultItemOperationRequest'
      - $ref: '#/components/schemas/RestartVerificationVaultItemOperationRequest'
      - $ref: '#/components/schemas/ConfirmTransactionVaultItemOperationRequest'
      - $ref: '#/components/schemas/CollectVaultItemOperationRequest'
      - $ref: '#/components/schemas/PrepareCheckoutVaultItemOperationRequest'
      - $ref: '#/components/schemas/FillVaultItemOperationRequest'
      - $ref: '#/components/schemas/OnePasswordRequestAccessVaultItemOperationRequest'
      - $ref: '#/components/schemas/OnePasswordPollAccessVaultItemOperationRequest'
      - $ref: '#/components/schemas/OnePasswordFillVaultItemOperationRequest'
      - $ref: '#/components/schemas/OnePasswordRecoverVaultItemOperationRequest'
      - $ref: '#/components/schemas/OnePasswordUpdateAccessTokenVaultItemOperationRequest'
      - $ref: '#/components/schemas/WebMCPInvokeVaultItemOperationRequest'
    CredentialVaultFieldInput:
      additionalProperties: false
      properties:
        encrypted_value:
          $ref: '#/components/schemas/CredentialVaultEncryptedValue'
        label:
          description: Optional human-readable display label. It is returned as non-secret metadata and never affects value keys, updates, or browser fills. Use single-line, trimmed display text without control or formatting characters. The server enforces a 128-byte UTF-8 limit.
          maxLength: 128
          minLength: 1
          pattern: ^\S(?:.*\S)?$
          type: string
        name:
          description: Unique stable field name used to key values, updates, and browser fills.
          pattern: ^[a-zA-Z][a-zA-Z0-9_]{0,63}$
          type: string
        required:
          default: true
          type: boolean
        sensitive:
          default: true
          description: Set false explicitly for ordinary usernames, email addresses, and other non-secret identifiers. Reserve true for secrets such as passwords, API tokens, and TOTP seeds. Password, totp, and passkey fields must be true. Omission defaults to true for safety; do not rely on that default for every field. False permits API reads and form prefilling.
          type: boolean
        type:
          $ref: '#/components/schemas/CredentialVaultFieldType'
        value:
          description: Optional initial value satisfying the declared type, at most 16 KiB in UTF-8 bytes. Omit to leave unset; null and empty strings are rejected on creation. Sensitive values are encrypted and never copied into the returned spec. Use this unless your own credential collection web app encrypts values in the browser; mutually exclusive with encrypted_value.
          maxLength: 16384
          minLength: 1
          type: string
      required:
      - name
      - type
      type: object
    OnePasswordRequestAccessVaultItemOperationRequest:
      additionalProperties: false
      description: Request access to login entries in the end-user's own, non-shared 1Password vault. No browser is needed; the end-user approves access in the 1Password app. Shared-vault items and passkeys are not supported. Per-entry reason and keywords overrides are only supported for a single login entry.
      properties:
        goal:
          maxLength: 140
          type: string
        keywords:
          items:
            maxLength: 50
            minLength: 1
            type: string
          maxItems: 5
          minItems: 1
          type: array
        reason:
          maxLength: 100
          type: string
        type:
          enum:
          - 1pw_create_access_request
          type: string
          x-go-type: VaultItemOperationType
      required:
      - type
      type: object
    VaultLinkProviderConfig:
      additionalProperties: false
      description: Response schema for a Link configuration, without secret credentials. Kernel generates the ID and timestamps. Configuration creation uses VaultLinkProviderConfigRequest.
      properties:
        client_id:
          description: OAuth client identity; immutable. Secret credentials are never returned.
          type: string
        created_at:
          format: date-time
          readOnly: true
          type: string
        id:
          readOnly: true
          type: string
        name:
          description: Unique within the organization.
          pattern: ^[a-zA-Z0-9._-]{1,255}$
          type: string
        provider:
          enum:
          - link
          type: string
        publishable_key:
          description: Stripe publishable key sent to Link when refreshing and revoking wallet grants. Omitted when not configured.
          type: string
        updated_at:
          format: date-time
          readOnly: true
          type: string
      required:
      - id
      - name
      - provider
      - client_id
      - created_at
      - updated_at
      type: object
    KernelCredentialVaultItemState:
      additionalProperties: false
      properties:
        fields:
          additionalProperties:
            $ref: '#/components/schemas/CredentialVaultFieldState'
          description: Exactly one entry for each declared field.
          minProperties: 1
          type: object
        provider:
          enum:
          - kernel
          type: string
        status:
          description: Ready means all required fields have values, not that a login succeeded. Optional fields may remain unset.
          enum:
          - pending_collection
          - ready
          type: string
      required:
      - provider
      - status
      - fields
      type: object
    CredentialCollectionAction:
      additionalProperties: false
      description: 'One schema-derived form for the item, available in ready or pending_collection

        state. Render every form-supported field as editable; omit totp and passkey

        fields and preserve their stored values. Prefill non-sensitive values,

        and allow existing sensitive values to be preserved or replaced without ever

        revealing them. No field subsets or per-request form configuration exist.

        Validate required fields against the resulting values, including preserved

        secrets. Submit changed values only, using the version used to render the form.

        Scoped hosted submission rejects totp and passkey edits; those writes require the ordinary

        authenticated item API. Customer forms likewise omit them from their payloads.

        Save edits atomically. A successful hosted submission increments the version,

        marks ready, and consumes the session; an empty edit may complete collection

        while preserving values. A customer form uses PATCH for changed values and

        does not send an empty PATCH when nothing changed.

        Kernel-hosted bearer sessions require no Kernel account and are bound to the

        item version. Expired, superseded, consumed, or deleted-item sessions cannot

        submit. Authenticated item GET renews expired active sessions for ready or pending items; pending

        items always receive an action. A ready item with no active session omits the

        action until collect is invoked. Concurrent renewals return the same link.

        Renewal changes neither values nor item version. An expired link cannot renew

        itself. The hosted form handles its collection protocol; callers only open

        the returned URL and do not extract or submit its token through the public API.

        For customer-hosted forms, use @onkernel/vault-react and an authenticated

        customer backend calling the ordinary item GET/PATCH API. Kernel does not

        store customer collection URLs or authenticate the customer''s end users.

        Treat URLs and submitted values as secrets and exclude them from logs,

        traces, and errors.

        '
      properties:
        expires_at:
          description: Expiry of the Kernel-hosted collection link (30 minutes after issuance).
          format: date-time
          type: string
        name:
          enum:
          - collect
          type: string
        url:
          description: Time-scoped hosted form URL (vault.kernel.sh in production). Open this URL as returned; treat it as a secret.
          format: uri
          type: string
      required:
      - name
      - url
      - expires_at
      type: object
    OnePasswordFillVaultItemOperationRequest:
      additionalProperties: false
      description: Fill and submit an approved 1Password login in the selected browser page. The page must share the selected entry's login origin. Supply entry_id when more than one approved entry matches the page origin. The extension selects fields; callers cannot supply selectors or secret values. Submission does not confirm website authentication.
      properties:
        browser_id:
          description: Browser session ID, not a reusable browser name.
          minLength: 1
          type: string
        entry_id:
          description: ID of an approved request entry. Required when several approved entries have the page's origin.
          minLength: 1
          type: string
        page_url:
          description: Exact current top-level page URL. Must match exactly one open page in the browser.
          format: uri
          pattern: ^\S+$
          type: string
        timeout_ms:
          default: 30000
          maximum: 30000
          minimum: 1
          type: integer
        type:
          enum:
          - 1pw_fill
          type: string
          x-go-type: VaultItemOperationType
      required:
      - type
      - browser_id
      - page_url
      type: object
    CustomerManagedOAuthClient:
      additionalProperties: false
      properties:
        provider_config:
          $ref: '#/components/schemas/VaultProviderConfigReference'
        type:
          enum:
          - customer_managed
          type: string
      required:
      - type
      - provider_config
      type: object
    LinkWalletState:
      additionalProperties: false
      properties:
        provider:
          enum:
          - link
          type: string
        status:
          enum:
          - pending_authorization
          - connected
          - declined
          - reconnect_required
          - degraded
          type: string
        status_reason:
          type: string
      required:
      - provider
      - status
      type: object
    AgentCardWalletState:
      additionalProperties: false
      properties:
        provider:
          enum:
          - agentcard
          type: string
        status:
          enum:
          - pending_authorization
          - connected
          - degraded
          type: string
        status_reason:
          type: string
        user_id:
          description: AgentCard user id linked to this wallet. Present once connected.
          type: string
      required:
      - provider
      - status
      type: object
    KernelManagedOAuthClient:
      additionalProperties: false
      properties:
        type:
          enum:
          - kernel_managed
          type: string
      required:
      - type
      type: object
    OnePasswordUpdateAccessTokenVaultItemOperationRequest:
      additionalProperties: false
      description: Replace only the access token on a stored-token 1Password credential. Preserves its integration key, request and approved references. Does not invoke 1Password or retry a pending/uncertain operation.
      properties:
        access_token:
          maxLength: 16384
          minLength: 1
          type: string
          writeOnly: true
        access_token_expires_at:
          description: Optional supplied expiry. Omit to clear the old expiry.
          format: date-time
          type: string
        type:
          enum:
          - 1pw_update_access_token
          type: string
          x-go-type: VaultItemOperationType
      required:
      - type
      - access_token
      type: object
    OnePasswordReturnedRequestEntry:
      additionalProperties: false
      properties:
        id:
          type: string
        keywords:
          items:
            type: string
          type: array
        parameters:
          additionalProperties: false
          properties:
            website:
              format: uri
              type: string
          type: object
        reason:
          type: string
        type:
          type: string
      type: object
    OnePasswordAccessApprovalAction:
      additionalProperties: false
      properties:
        instructions:
          description: Steps for the agent to hand approval to the human and poll the resulting decision.
          type: string
        name:
          enum:
          - 1password_access_approval
          type: string
        url:
          description: Native 1Password approval link. Present it to the account owner without modifying it; it does not grant access until they approve in their app.
          format: uri
          pattern: ^onepassword://grant-brokered-access\?access_request_reference=
          type: string
      required:
      - name
      - url
      - instructions
      type: object
    WebMCPInvokeVaultItemOperationRequest:
      additionalProperties: false
      description: 'Invoke a WebMCP tool using values from a vaulted item. The browser must be

        attached to the item''s vault. Discover the tool_ref, inputSchema, and source

        with GET /browsers/{id_or_name}/webmcp/tools or webmcp.listTools() in the

        Browser REPL (POST /browsers/{id_or_name}/repl) before invoking it.

        Input paths replace existing null slots in input. Tool output is returned

        without redaction and may include the supplied values. The tool may submit

        or perform other side effects. Any item destination

        restrictions apply to the tool''s top-level page and registering frame (if any).

        '
      example:
        bindings:
        - field: email
          input_path: /email
        - field: password
          input_path: /password
        browser_id: browser-session-id
        input:
          email: null
          password: null
        page_url: https://accounts.example.com/signin
        tool_ref: opaque-live-tool-ref
        type: webmcp_invoke
      properties:
        bindings:
          items:
            $ref: '#/components/schemas/VaultWebMCPBinding'
          maxItems: 32
          minItems: 1
          type: array
        browser_id:
          description: Browser session ID, not a reusable browser name.
          minLength: 1
          type: string
        input:
          additionalProperties: true
          description: Public tool arguments with an existing null slot at each binding path. At most 64 KiB after JSON serialization, including substituted values. Never include vault values here.
          type: object
        page_url:
          description: Exact top-level URL from the discovered tool source (fragment omitted). This pins the target page; it does not authorize a destination.
          format: uri
          type: string
        timeout_sec:
          default: 15
          description: Tool invocation timeout in seconds; preflight and response handling have an additional bounded allowance. An indeterminate outcome is not retried.
          maximum: 120
          minimum: 1
          type: integer
        tool_ref:
          description: Opaque reference to the exact live WebMCP registration.
          maxLength: 128
          minLength: 1
          type: string
        type:
          enum:
          - webmcp_invoke
          type: string
      required:
      - type
      - browser_id
      - tool_ref
      - page_url
      - input
      - bindings
      type: object
    VaultLinkProviderConfigRequest:
      additionalProperties: false
      description: Register a customer-owned Link OAuth client for refreshing and revoking imported wallet grants. The customer is responsible for initiating OAuth flows to connect a user's wallet and handling the redirect to obtain a Link access token and refresh token.
      properties:
        credentials:
          allOf:
          - $ref: '#/components/schemas/VaultLinkProviderClientCredentials'
          writeOnly: true
        name:
          description: Unique within the organization.
          pattern: ^[a-zA-Z0-9._-]{1,255}$
          type: string
        provider:
          enum:
          - link
          type: string
      required:
      - name
      - provider
      - credentials
      type: object
    VaultProviderConfigUpdateRequest:
      additionalProperties: false
      description: Update a provider configuration. Omitted fields are left unchanged. Renaming preserves item bindings. Credential updates apply to all wallets using this configuration. Provider and client ID are immutable; changing clients requires a new configuration. The selected configuration determines how credentials are validated; its identity and mode must not change during secret rotation.
      properties:
        credentials:
          additionalProperties: false
          description: Fields to update. Omitted credentials are left unchanged. A rejected update leaves existing credentials unchanged.
          properties:
            client_secret:
              minLength: 1
              type: string
              writeOnly: true
            publishable_key:
              description: Link configurations only. Stripe publishable key sent to Link when refreshing and revoking wallet grants.
              pattern: ^pk_(live|test)_[A-Za-z0-9]+$
              type: string
          type: object
          writeOnly: true
        name:
          description: Unique within the organization.
          pattern: ^[a-zA-Z0-9._-]{1,255}$
          type: string
      type: object
    AuthorizeVaultItemOperationRequest:
      additionalProperties: false
      description: 'Authorize a Link or Kernel card using its existing purchase specification. Use only after explicit user approval and when the item advertises authorize; follow the advertised operation''s description. For a Link card, pass browser_id and page_url together while the browser is on the final checkout page: Kernel inspects that checkout, chooses how the credential is delivered, and limits fill to that checkout''s origin in any browser with this vault attached. Omitting both issues a virtual card that fills any page on the merchant origin. Once approval has been requested, browser_id and page_url are ignored and authorize only re-checks the request. Browser and checkout inspection errors occur before any provider request and can be retried once the browser is on the checkout page. Kernel cards do not accept browser_id or page_url.'
      properties:
        browser_id:
          description: Browser session ID, not a reusable browser name. The browser must have this vault attached.
          minLength: 1
          type: string
        page_url:
          description: Exact current top-level URL of the final checkout page open in browser_id.
          format: uri
          pattern: ^https://[^/?#@*\s]+(?:[/?#][^\s]*)?$
          type: string
        type:
          enum:
          - authorize
          type: string
          x-go-type: VaultItemOperationType
      required:
      - type
      type: object
  responses:
    BadRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Bad Request – invalid input
    TooManyRequests:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Too Many Requests – rate limit exceeded
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: integer
    Forbidden:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Forbidden – insufficient permissions or plan
    Conflict:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Conflict – resource already exists
    InternalError:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Internal Server Error
    ServiceUnavailable:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Service unavailable
    Unauthorized:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Unauthorized – missing or invalid authorization token
    NotFound:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Resource not found
  examples:
    ExampleLinkCard:
      summary: Requested Link card; identical PUT returns the same item without authorization
      value:
        available_expansions: []
        available_operations:
        - description: Request cardholder approval for this payment at the final checkout page.
          type: authorize
        created_at: '2026-01-01T12:00:00Z'
        id: card_link_example
        key: link-card
        spec:
          amount: 2599
          context: Purchase one notebook for USD 25.99 including shipping and taxes. This is a new order at Example Store, not a retry of an earlier payment.
          currency: usd
          merchant_name: Example Store
          merchant_url: https://store.example.com
          payment_method_id: pm_example
          provider: link
          wallet: link-wallet
        state:
          provider: link
          status: requested
        type: card
        updated_at: '2026-01-01T12:00:00Z'
    ExampleLinkConfigRenamed:
      summary: Renaming preserves the configuration ID and wallet bindings
      value:
        client_id: example-client-id
        created_at: '2026-01-01T12:00:00Z'
        id: vpc_link_example
        name: renamed-link-client
        provider: link
        publishable_key: pk_live_example
        updated_at: '2026-01-02T12:00:00Z'
    ExampleAgentCardConfigRotated:
      summary: Rotating the secret preserves client identity and mode
      value:
        client_id: example-client-id
        created_at: '2026-01-01T12:00:00Z'
        id: vpc_agentcard_example
        name: my-agentcard
        provider: agentcard
        test_mode: false
        updated_at: '2026-01-02T12:00:00Z'
    ExampleAgentCardCardInput:
      summary: Create a reusable USD 25.99 card at key agentcard-card after its wallet connects
      value:
        spec:
          amount: 2599
          card_id: vc_example
          currency: usd
          merchant: Example Store
          provider: agentcard
          wallet: agentcard-wallet
        type: card
    ExampleConfiguredAgentCardWallet:
      summary: Hosted enrollment using a customer-owned configuration
      value:
        action:
          name: card_enrollment
          url: https://example.com/card-enrollment
        available_expansions: []
        available_operations: []
        created_at: '2026-01-01T12:00:00Z'
        expires_at: '2026-01-01T13:00:00Z'
        id: wallet_agentcard_example
        key: agentcard-wallet
        spec:
          provider: agentcard
          provider_config:
            id: vpc_agentcard_example
        state:
          provider: agentcard
          status: pending_authorization
        type: wallet
        updated_at: '2026-01-01T12:00:00Z'
    ExampleLinkCardUpdated:
      summary: Updated Link request retains its key and ID
      value:
        available_expansions: []
        available_operations:
        - description: Request cardholder approval for this payment.
          type: authorize
        created_at: '2026-01-01T12:00:00Z'
        id: card_link_example
        key: link-card
        spec:
          amount: 3000
          context: The order total changed to USD 30.00 including shipping and taxes for one notebook. Update this unapproved request rather than creating a second payment.
          currency: usd
          merchant_name: Example Store
          merchant_url: https://store.example.com
          payment_method_id: pm_example
          provider: link
          wallet: link-wallet
        state:
          provider: link
          status: requested
        type: card
        updated_at: '2026-01-02T12:00:00Z'
    ExampleLinkConfig:
      summary: Link configuration response; no secret credentials
      value:
        client_id: example-client-id
        created_at: '2026-01-01T12:00:00Z'
        id: vpc_link_example
        name: my-link-client
        provider: link
        publishable_key: pk_live_example
        updated_at: '2026-01-01T12:00:00Z'
    ExampleManagedLinkWallet:
      summary: Pending OAuth through Kernel-managed credentials at key link-wallet
      value:
        action:
          name: link_oauth
          url: https://example.com/link-authorization
        available_expansions: []
        available_operations: []
        created_at: '2026-01-01T12:00:00Z'
        expires_at: '2026-01-01T12:10:00Z'
        id: wallet_link_example
        key: link-wallet
        spec:
