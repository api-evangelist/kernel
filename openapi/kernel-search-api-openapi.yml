    SearchBrowserOptions:
      additionalProperties: false
      properties:
        browser_id:
          description: 'Existing browser session ID authorized for the caller and selected

            project. Reuses its cookies, proxy, and browser configuration; requests

            follow that browser''s existing network access behavior, with no additional

            destination allowlist in this endpoint. Kernel does not delete a caller-supplied

            browser. Render mode uses a temporary tab; website activity may still change

            shared cookies and storage.

            When omitted and any result needs browser retrieval, Kernel creates one temporary

            browser for the request using the dashboard launch defaults (headful, stealth,

            default proxy), tags it with search_id, and deletes it when the request finishes.

            It is billed and counts toward browser concurrency like any other browser. A

            concurrency rejection returns 429 for source=browser; for source=auto, results

            with retained content are still returned and the rest report the rejection.

            '
          type: string
        mode:
          default: curl
          description: 'Curl uses the browser HTTP stack without navigation or JavaScript

            execution. Render navigates a temporary page and extracts from its

            DOM. The selected mode is used for the retrieval.

