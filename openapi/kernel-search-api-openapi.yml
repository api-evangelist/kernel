        format:
          $ref: '#/components/schemas/SearchContentFormat'
          default: markdown
        max_age_hours:
          default: 24
          description: For source=auto, maximum acceptable age of retained provider content, measured from when the search received it from the provider. A value of 0 disables reuse of retained content, so every result is fetched through a browser. source=provider reuses retained provider content without freshness validation. source=browser always fetches through a browser and does not use this age limit.
          minimum: 0
