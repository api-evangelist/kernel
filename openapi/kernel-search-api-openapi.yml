openapi: 3.2.0
info:
  description: Developer tools and cloud infrastructure for AI agents to use web browsers
  title: Kernel Search API
  version: 0.1.0
servers:
- description: API Server
  url: https://api.onkernel.com
security:
- bearerAuth: []
tags:
- description: Search the web and retrieve content for selected results.
  name: Search
paths:
  /search:
    post:
      description: Returns ranked results from one serving provider. The default strategy selects a provider that supports the requested options. The fallback strategy tries providers in the supplied order. Results are not blended across providers. Portable filters may be approximated or omitted according to provider capabilities; warnings describe those outcomes unless strict_params is true. Native options apply only to their selected provider.
      operationId: postSearch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Search'
          description: 'Completed search, including valid zero-result responses. Inline

            retrieval failures are reported per result. Arrays are never null.

            '
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/SearchProviderError'
        '503':
          $ref: '#/components/responses/SearchUnavailable'
        '504':
          $ref: '#/components/responses/SearchTimeout'
      security:
      - bearerAuth: []
      summary: Search the web
      tags:
      - Search
  /search/providers:
    get:
      description: 'Lists providers, capabilities, and machine-readable native-option schemas. Auto and fallback

        are strategies, not provider entries. The list is not paginated and contains no latency

        benchmarks. X-Request-Id identifies the request.'
      operationId: getSearchProviders
      parameters:
      - description: Optional concrete provider slug filter. Omit to list every provider. A slug that is not listed returns an empty array.
        in: query
        name: slug
        required: false
        schema:
          $ref: '#/components/schemas/SearchProviderSlug'
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SearchProvider'
                type: array
          description: List of available search providers. Returns an empty array, never null.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/SearchUnavailable'
      security:
      - bearerAuth: []
      summary: List search providers
      tags:
      - Search
  /search/{id}:
    get:
      description: 'Returns the retained search resource exactly as it was returned by

        POST /search: results, attempts, warnings, usage, and expires_at. No

        provider is called and nothing is billed. Use it to look up a search

        by ID for debugging, cost review, or to recover result IDs before

        calling the contents endpoint. Inline content fetched at search time

        is included; content fetched later through the contents endpoint is

        not merged in. Missing, expired, or inaccessible searches return 404.'
      operationId: getSearch
      parameters:
      - description: Search resource ID returned by POST /search.
        example: srch_abc123
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Search'
          description: The retained search.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/SearchUnavailable'
      security:
      - bearerAuth: []
      summary: Retrieve a search
      tags:
      - Search
  /search/{id}/contents:
    post:
      description: 'Retrieves selected results from a retained search. Provide exactly one of

        result_ids or limit; the latter fetches the top results. Content defaults to

        source:auto. Responses preserve result_ids order. Unknown result IDs are rejected before retrieval starts.

        Missing, expired, or inaccessible searches return 404. Once retrieval begins,

        return one outcome per selected result, including timeout entries for work

        unfinished at the overall deadline. Browser retrievals run sequentially in

        result order, so later results may time out when earlier pages are slow.

        X-Request-Id identifies this request separately from the search resource.'
      operationId: postSearchContents
      parameters:
      - description: Search resource ID returned by POST /search.
        example: srch_abc123
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchContentsRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchContentsResponse'
          description: One outcome per selected result, even if every fetch fails. Arrays are never null.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/SearchUnavailable'
      security:
      - bearerAuth: []
      summary: Fetch search result content
      tags:
      - Search
components:
  schemas:
    SearchContextTarget:
      additionalProperties: false
      properties:
        options:
          $ref: '#/components/schemas/SearchContextOptions'
        provider:
          const: context
          type: string
      required:
      - provider
      type: object
    SearchRequest:
      additionalProperties: false
      properties:
        content:
          description: Optional portable content retrieval. Pass true for defaults or an options object. Omission never starts Kernel browser work; provider-supplied content is still returned when available, including when requested through native options. Both inline and deferred retrieval use the same options schema.
          oneOf:
          - description: Pass true to enable default portable content retrieval (auto source, markdown format, 10,000 char cap).
            enum:
            - true
            type: boolean
          - $ref: '#/components/schemas/SearchContentOptions'
        country:
          description: ISO 3166-1 alpha-2 search locale preference.
          pattern: ^[A-Za-z]{2}$
          type: string
        end_date:
          description: Inclusive publication-date upper bound; must not precede start_date. If recency is also supplied, recency takes precedence with a warning. Unsupported or approximated filtering is reported, or rejected under strict_params.
          format: date
          type: string
        exclude_domains:
          description: Hostname exclusions, with the same best-effort/strict behavior as include_domains. Provider-specific combinations that cannot be represented are reported via warnings or rejected in strict mode.
          items:
            type: string
          maxItems: 100
          type: array
          uniqueItems: true
        include_domains:
          description: Hostname inclusion preference, matching a hostname and its subdomains. Empty means unrestricted. Translated, emulated, or dropped with a warning according to provider capability unless strict_params is true. Native boost modes remain advisory and are identified in warnings.
          items:
            type: string
          maxItems: 100
          type: array
          uniqueItems: true
        include_raw:
          default: false
          description: Include untouched per-result payloads and the full serving-provider response in raw fields. Off by default; native top-level outputs such as answer remain available without it.
          type: boolean
        language:
          description: BCP 47 search language preference.
          type: string
        max_results:
          default: 10
          description: Requested result count from 1 through 100. The effective count is clamped to the serving provider's cap with a warning. Effective native counts are the lower of this limit and supplied provider-native count aliases. Strict mode rejects unsupported counts.
          maximum: 100
          minimum: 1
          type: integer
        query:
          description: Primary search query. A provider-native multi-query option applies only to that provider; other providers in a fallback chain receive this query.
          maxLength: 2048
          minLength: 1
          type: string
        recency:
          description: Relative search window. Takes precedence over start_date/end_date with a warning if both are set. Provider-native recency behavior is retained, including documented hour-to-day widening. Unsupported filters are rejected only in strict mode.
          enum:
          - hour
          - day
          - week
          - month
          - year
          type: string
          x-enum-varnames:
          - SearchRecencyHour
          - SearchRecencyDay
          - SearchRecencyWeek
          - SearchRecencyMonth
          - SearchRecencyYear
        safe_search:
          description: Optional safety preference. Omit to use provider defaults. Unsupported values are dropped with a warning unless strict_params is true. A search filter is not an authorization boundary.
          enum:
          - 'off'
          - moderate
          - strict
          type: string
          x-enum-varnames:
          - SearchSafeSearchOff
          - SearchSafeSearchModerate
          - SearchSafeSearchStrict
        start_date:
          description: Inclusive publication-date lower bound. If recency is also supplied, recency takes precedence with a warning. Provider date semantics, precision, and unsupported filters are reported; unknown source dates are not fabricated or universally post-filtered.
          format: date
          type: string
        strategy:
          $ref: '#/components/schemas/SearchStrategy'
          default:
            type: auto
          description: Omitted strategy defaults to auto.
        strict_params:
          default: false
          description: When false, unsupported portable parameters are omitted and approximations are described in warnings. When true, every supplied portable parameter must be honored exactly. Requests that cannot be served with those parameters are rejected. This does not guarantee identical rankings or document timestamps across indexes. Authentication and project isolation are always enforced.
          type: boolean
        timeout_ms:
          default: 30000
          description: 'Overall deadline across search attempts and inline retrieval.

            No new attempt starts after the deadline. Completed search results

            survive inline retrieval timeouts.

            '
          maximum: 120000
          minimum: 1000
          type: integer
      required:
      - query
      type: object
    SearchAttempt:
      properties:
        duration_ms:
          minimum: 0
          type: integer
        error_code:
          type: string
        outcome:
          enum:
          - success
          - empty
          - error
          - timeout
          type: string
          x-enum-varnames:
          - SearchAttemptOutcomeSuccess
          - SearchAttemptOutcomeEmpty
          - SearchAttemptOutcomeError
          - SearchAttemptOutcomeTimeout
        provider:
          type: string
        retryable:
          type: boolean
      required:
      - provider
      - outcome
      - duration_ms
      type: object
    SearchContentCompleteness:
      description: 'Describes source coverage before max_chars truncation. Full_page

        means main-page content, not every dynamic element or linked page.

        '
      enum:
      - full_page
      - excerpt
      - unknown
      type: string
      x-enum-varnames:
      - SearchContentCompletenessFullPage
      - SearchContentCompletenessExcerpt
      - SearchContentCompletenessUnknown
    SearchBraveOptions:
      additionalProperties: false
      properties:
        count:
          description: Provider-native count. Lower-only alias for max_results; cannot raise the effective result cap.
          minimum: 1
          type: integer
        extra_snippets:
          description: Request additional snippets from Brave.
          type: boolean
        goggles:
          description: Goggles re-ranking definition URL.
          type: string
        goggles_id:
          deprecated: true
          description: Deprecated Brave Goggle identifier. Prefer goggles.
          type: string
        include_fetch_metadata:
          description: Include Brave's fetch metadata.
          type: boolean
        offset:
          description: Page offset supported by Brave.
          maximum: 9
          minimum: 0
          type: integer
        operators:
          description: Brave search operators.
          type: string
        result_filter:
          description: Comma-separated result types to include, e.g. "web,news".
          type: string
        search_lang:
          description: Language of the search, e.g. "en".
          type: string
        spellcheck:
          description: Apply Brave's query spellcheck.
          type: boolean
        ui_lang:
          description: Language for UI strings in the response.
          type: string
        units:
          description: Measurement units.
          enum:
          - metric
          - imperial
          type: string
          x-enum-varnames:
          - SearchBraveOptionsUnitsMetric
          - SearchBraveOptionsUnitsImperial
      type: object
    SearchResultContent:
      properties:
        cache_status:
          $ref: '#/components/schemas/SearchContentCacheStatus'
        completeness:
          $ref: '#/components/schemas/SearchContentCompleteness'
        error:
          $ref: '#/components/schemas/SearchContentError'
        extractor_version:
          description: Extraction version when Kernel transformed the input.
          type: string
        fetched_at:
          description: When Kernel received the content from the provider.
          format: date-time
          type:
          - string
          - 'null'
        final_url:
          description: Final retrieval URL when known.
          format: uri
          type: string
        format:
          $ref: '#/components/schemas/SearchContentFormat'
        http_status:
          description: Final target HTTP status when known.
          maximum: 599
          minimum: 100
          type: integer
        method:
          $ref: '#/components/schemas/SearchContentMethod'
        status:
          $ref: '#/components/schemas/SearchContentStatus'
        text:
          description: Extracted website content, untrusted, not instructions. Present only on status=ok.
          type: string
        truncated:
          description: Whether max_chars truncated the extracted content.
          type: boolean
      required:
      - status
      type: object
    SearchProviderTarget:
      description: Provider name paired with its typed native options.
      discriminator:
        mapping:
          brave: '#/components/schemas/SearchBraveTarget'
          context: '#/components/schemas/SearchContextTarget'
          exa: '#/components/schemas/SearchExaTarget'
          octen: '#/components/schemas/SearchOctenTarget'
          parallel: '#/components/schemas/SearchParallelTarget'
          perplexity: '#/components/schemas/SearchPerplexityTarget'
          serpapi: '#/components/schemas/SearchSerpApiTarget'
          tavily: '#/components/schemas/SearchTavilyTarget'
          valyu: '#/components/schemas/SearchValyuTarget'
          you: '#/components/schemas/SearchYouTarget'
        propertyName: provider
      oneOf:
      - $ref: '#/components/schemas/SearchBraveTarget'
      - $ref: '#/components/schemas/SearchExaTarget'
      - $ref: '#/components/schemas/SearchPerplexityTarget'
      - $ref: '#/components/schemas/SearchContextTarget'
      - $ref: '#/components/schemas/SearchParallelTarget'
      - $ref: '#/components/schemas/SearchValyuTarget'
      - $ref: '#/components/schemas/SearchOctenTarget'
      - $ref: '#/components/schemas/SearchYouTarget'
      - $ref: '#/components/schemas/SearchTavilyTarget'
      - $ref: '#/components/schemas/SearchSerpApiTarget'
    Search:
      description: Retained search results and provider attempt history.
      properties:
        answer:
          description: Provider-generated answer when requested (e.g. via Tavily include_answer or Perplexity). Preserved independently of include_raw.
          type: string
        attempts:
          items:
            $ref: '#/components/schemas/SearchAttempt'
          type: array
        expires_at:
          description: 'Expiration of result IDs for deferred retrieval. Results expire 24 hours

            after search completion.

            '
          format: date-time
          type: string
        id:
          description: Search resource ID. Request tracing uses X-Request-Id.
          example: srch_abc123
          type: string
        provider:
          description: Concrete serving provider, never auto or fallback.
          type: string
        query:
          description: Echo of the query. Native multi-query inputs are visible in the selected strategy target and the optional raw response.
          type: string
        raw:
          description: Full serving-provider response, including top-level metadata that does not belong to a result. Present only with include_raw=true; untrusted provider data.
        results:
          items:
            $ref: '#/components/schemas/SearchResult'
          type: array
        usage:
          $ref: '#/components/schemas/SearchUsage'
        warnings:
          items:
            $ref: '#/components/schemas/SearchWarning'
          type: array
      required:
      - id
      - expires_at
      - provider
      - results
      - attempts
      - warnings
      - query
      - usage
      type: object
    SearchValyuTarget:
      additionalProperties: false
      properties:
        options:
          $ref: '#/components/schemas/SearchValyuOptions'
        provider:
          const: valyu
          type: string
      required:
      - provider
      type: object
    SearchExaOptions:
      additionalProperties: false
      properties:
        category:
          description: Provider data-category hint.
          type: string
        compliance:
          description: Provider-native compliance controls. Requires support and authorization on the provider account.
          type: string
        contents:
          $ref: '#/components/schemas/SearchExaOptionsContents'
        maxAgeHours:
          description: Provider-native cache-age control. Unlike content.max_age_hours, this retains Exa semantics, including any native sentinel values. It does not imply a cross-provider freshness guarantee.
          type: number
        numResults:
          description: Provider-native count. Lower-only alias for max_results.
          minimum: 1
          type: integer
        type:
          default: auto
          description: Search mode supported by Exa.
          enum:
          - auto
          - fast
          - instant
          type: string
          x-enum-varnames:
          - SearchExaOptionsTypeAuto
          - SearchExaOptionsTypeFast
          - SearchExaOptionsTypeInstant
      type: object
    SearchProviderOptionsDiscovery:
      additionalProperties: false
      properties:
        examples:
          items:
            additionalProperties: true
            type: object
          type: array
        schema:
          additionalProperties: true
          description: JSON Schema for the provider-native options accepted by POST /search.
          type: object
        schema_ref:
          description: OpenAPI component name for the matching typed provider-options schema.
          type: string
      required:
      - schema_ref
      - schema
      type: object
    SearchTavilyOptions:
      additionalProperties: false
      properties:
        auto_parameters:
          description: Allow the provider to choose search parameters. May select a different billing tier; explicit caller values retain provider-native precedence.
          type: boolean
        chunks_per_source:
          description: Provider excerpts per source, up to 500 characters each.
          maximum: 3
          minimum: 1
          type: integer
        exact_match:
          description: Require the quoted phrases in the query verbatim, bypassing semantic matches.
          type: boolean
        filter_by_language:
          description: Strictly filter non-matching languages. Requires `language`.
          type: boolean
        include_answer:
          anyOf:
          - type: boolean
          - enum:
            - basic
            - advanced
            type: string
            x-enum-varnames:
            - SearchTavilyOptionsIncludeAnswerVariant1Basic
            - SearchTavilyOptionsIncludeAnswerVariant1Advanced
          description: Request the provider's generated answer. Returned as answer on the search response, independently of include_raw.
        include_domains_mode:
          description: Native filter versus ranking boost semantics. Boost influences ranking rather than restricting results to the listed domains. Requires include_domains.
          enum:
          - filter
          - boost
          type: string
          x-enum-varnames:
          - SearchTavilyOptionsIncludeDomainsModeFilter
          - SearchTavilyOptionsIncludeDomainsModeBoost
        include_favicon:
          description: Favicon URL per result.
          type: boolean
        include_image_descriptions:
          description: Describe each image. Needs include_images.
          type: boolean
        include_images:
          description: Query-related images plus per-result images.
          type: boolean
        include_raw_content:
          anyOf:
          - type: boolean
          - enum:
            - markdown
            - text
            type: string
            x-enum-varnames:
            - SearchTavilyOptionsIncludeRawContentVariant1Markdown
            - SearchTavilyOptionsIncludeRawContentVariant1Text
          description: Request native full-page content. Defaults to markdown when omitted for this provider, False disables that native retrieval; it does not disable explicitly requested Kernel browser retrieval.
        language:
          description: ISO 639-1 code or English language name. Ranking boost unless filter_by_language.
          type: string
        max_results:
          description: Provider-native count. Lower-only alias for max_results.
          minimum: 1
          type: integer
        search_depth:
          description: Provider relevance and latency tier. Some tiers cannot be combined with native safe search; conflicts are described in warnings.
          enum:
          - advanced
          - basic
          - fast
          - ultra-fast
          type: string
          x-enum-varnames:
          - SearchTavilyOptionsSearchDepthAdvanced
          - SearchTavilyOptionsSearchDepthBasic
          - SearchTavilyOptionsSearchDepthFast
          - SearchTavilyOptionsSearchDepthUltraFast
        topic:
          description: Provider corpus selector. Publication metadata depends on the selected topic.
          enum:
          - general
          - news
          - finance
          type: string
          x-enum-varnames:
          - SearchTavilyOptionsTopicGeneral
          - SearchTavilyOptionsTopicNews
          - SearchTavilyOptionsTopicFinance
      type: object
    SearchPerplexityTarget:
      additionalProperties: false
      properties:
        options:
          $ref: '#/components/schemas/SearchPerplexityOptions'
        provider:
          const: perplexity
          type: string
      required:
      - provider
      type: object
    SearchContentStatus:
      description: 'Ok means non-empty extracted content, not merely HTTP 200. Blocked

        includes detected challenges or access denials. Detection is

        best-effort, not a guarantee of page completeness. Error details

        are present for non-ok outcomes; text is present only on ok.

        '
      enum:
      - ok
      - unavailable
      - blocked
      - timeout
      - unsupported_type
      - extraction_failed
      - error
      type: string
      x-enum-varnames:
      - SearchContentStatusOk
      - SearchContentStatusUnavailable
      - SearchContentStatusBlocked
      - SearchContentStatusTimeout
      - SearchContentStatusUnsupportedType
      - SearchContentStatusExtractionFailed
      - SearchContentStatusError
    SearchSerpApiOptions:
      additionalProperties: false
      properties:
        device:
          description: Device profile used for the search.
          enum:
          - desktop
          - mobile
          - tablet
          type: string
        engine:
          description: SerpApi engine identifier. The Kernel integration currently supports google only.
          minLength: 1
          type: string
        filter:
          description: Google duplicate-content filter.
          enum:
          - 0
          - 1
          type: integer
        gl:
          description: Two-letter Google country code.
          maxLength: 2
          minLength: 2
          type: string
        google_domain:
          description: Google domain to search when using the google engine.
          type: string
        hl:
          description: Interface language code.
          maxLength: 8
          minLength: 2
          type: string
        location:
          description: Free-form geographic location used for localized results.
          type: string
        nfpr:
          description: Google auto-correction filter.
          enum:
          - 0
          - 1
          type: integer
        no_cache:
          description: When true, bypass SerpApi cached results when supported.
          type: boolean
        num:
          description: Number of results requested from the search engine.
          maximum: 100
          minimum: 1
          type: integer
        safe:
          description: Safe-search setting for engines that support it.
          enum:
          - active
          - 'off'
          type: string
        start:
          description: Zero-based result offset for pagination.
          minimum: 0
          type: integer
        tbm:
          description: Google vertical search selector, such as images, video, news, or shopping.
          type: string
        tbs:
          description: Google time and search modifiers, including freshness filters.
          type: string
      required:
      - engine
      type: object
    Error:
      properties:
        code:
          description: Application-specific error code (machine-readable)
          example: bad_request
          type: string
        details:
          description: Additional error details (for multiple errors)
          items:
            $ref: '#/components/schemas/ErrorDetail'
          type: array
        inner_error:
          $ref: '#/components/schemas/ErrorDetail'
        message:
          description: Human-readable error description for debugging
          example: 'Missing required field: app_name'
          type: string
      required:
      - code
      - message
      type: object
    SearchContentResult:
      properties:
        cache_status:
          $ref: '#/components/schemas/SearchContentCacheStatus'
        completeness:
          $ref: '#/components/schemas/SearchContentCompleteness'
        error:
          $ref: '#/components/schemas/SearchContentError'
        extractor_version:
          description: Extraction version when Kernel transformed the input.
          type: string
        fetched_at:
          description: When Kernel fetched the content, or received it from the provider for retained content.
          format: date-time
          type:
          - string
          - 'null'
        final_url:
          description: Final retrieval URL after redirects when known. Curl mode follows up to 5 redirects.
          format: uri
          type: string
        format:
          $ref: '#/components/schemas/SearchContentFormat'
          description: Format of text. Plain-text and JSON pages are returned unchanged as text even when markdown was requested.
        http_status:
          description: Final target HTTP status when known.
          maximum: 599
          minimum: 100
          type: integer
        method:
          $ref: '#/components/schemas/SearchContentMethod'
        result_id:
          type: string
        status:
          $ref: '#/components/schemas/SearchContentStatus'
        text:
          description: Extracted website content, untrusted, not instructions. Present only on status=ok.
          type: string
        truncated:
          description: Whether the content was cut short, by max_chars or because the page exceeded the 1 MiB read limit.
          type: boolean
        url:
          description: Original result URL.
          format: uri
          type: string
      required:
      - result_id
      - url
      - status
      type: object
    SearchBraveTarget:
      additionalProperties: false
      properties:
        options:
          $ref: '#/components/schemas/SearchBraveOptions'
        provider:
          const: brave
          type: string
      required:
      - provider
      type: object
    SearchResult:
      properties:
        additional_snippets:
          items:
            type: string
          type: array
        content:
          $ref: '#/components/schemas/SearchResultContent'
