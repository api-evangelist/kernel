        truncated:
          type: boolean
          description: True if the data field was truncated due to size limits.
    BrowserNetworkIdleEvent:
      type: object
      title: network_idle
      description: A browser network idle event emitted after a 500ms quiet period with no in-flight HTTP requests.
      required:
      - ts
      - type
      - category
      - source
      properties:
        ts:
          type: integer
          format: int64
          description: Event timestamp in Unix microseconds.
        type:
          type: string
          const: network_idle
        category:
          type: string
          const: network
        source:
          $ref: '#/components/schemas/BrowserEventSource'
        data:
          $ref: '#/components/schemas/BrowserEventContext'
        truncated:
          type: boolean
          description: True if the data field was truncated due to size limits.
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Application-specific error code (machine-readable)
          example: bad_request
        message:
          type: string
          description: Human-readable error description for debugging
          example: 'Missing required field: app_name'
        details:
          type: array
          description: Additional error details (for multiple errors)
          items:
            $ref: '#/components/schemas/ErrorDetail'
        inner_error:
          $ref: '#/components/schemas/ErrorDetail'
    BrowserEventSource:
      type: object
      description: Provenance metadata identifying which producer emitted the event.
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - cdp
          - kernel_api
          - extension
          - local_process
          description: 'Event producer. cdp: Chrome DevTools Protocol events from the browser. kernel_api: Kernel API server. extension: injected Chrome extension. local_process: system process running alongside the browser.'
        event:
          type: string
          description: Producer-specific event name (e.g. Runtime.consoleAPICalled for CDP-sourced console events, Runtime.exceptionThrown for uncaught exceptions).
        metadata:
          type: object
          description: Producer-specific context (e.g. CDP target/session/frame IDs).
          additionalProperties:
            type: string
    BrowserNetworkResponseEvent:
      type: object
      title: network_response
      description: A browser network response received event. Fired after the response body is fully received, not when headers arrive.
      required:
      - ts
      - type
      - category
      - source
      properties:
        ts:
          type: integer
          format: int64
          description: Event timestamp in Unix microseconds.
        type:
          type: string
          const: network_response
        category:
          type: string
          const: network
        source:
          $ref: '#/components/schemas/BrowserEventSource'
        data:
          allOf:
          - $ref: '#/components/schemas/BrowserEventContext'
          - type: object
            properties:
              request_id:
                type: string
                description: CDP request identifier matching the originating network_request event.
              method:
                type: string
                description: HTTP method of the original request.
              status:
                type: integer
                description: HTTP response status code.
              status_text:
                type: string
                description: HTTP response status text (e.g. OK, Not Found).
              headers:
                $ref: '#/components/schemas/BrowserHttpHeaders'
                description: Response headers.
              mime_type:
                type: string
                description: MIME type of the response (e.g. text/html, application/json).
              resource_type:
                type: string
                description: CDP Network.ResourceType for the request, passed through as-is from Chrome. Known values include Document, Fetch, XHR, Script, Stylesheet, Image, Media, Font, TextTrack, EventSource, WebSocket, Manifest, Prefetch, Other, and more.
              body:
                type: string
                description: Truncated response body, present only for text MIME types.
        truncated:
          type: boolean
          description: True if the data field was truncated due to size limits.
    BrowserPageLayoutShiftEvent:
      type: object
      title: page_layout_shift
      description: A browser cumulative layout shift (CLS) event from the Performance Timeline API.
      required:
      - ts
      - type
      - category
      - source
      properties:
        ts:
          type: integer
          format: int64
          description: Event timestamp in Unix microseconds.
        type:
          type: string
          const: page_layout_shift
        category:
          type: string
          const: page
        source:
          $ref: '#/components/schemas/BrowserEventSource'
        data:
          allOf:
          - $ref: '#/components/schemas/BrowserEventContext'
          - type: object
            properties:
              source_frame_id:
                type: string
                description: CDP frame identifier of the frame where the layout shift occurred.
              time:
                type: number
                description: Performance Timeline timestamp of the layout shift in milliseconds.
              duration:
                type: number
                description: Duration of the layout shift entry in milliseconds (always 0 for layout shifts per spec).
              layout_shift_details:
                type: object
                additionalProperties: false
                description: PerformanceLayoutShift attributes from the Performance Timeline entry.
                properties:
                  value:
                    type: number
                    description: Layout shift score for this entry (contribution to CLS).
                  had_recent_input:
                    type: boolean
                    description: True if the layout shift was preceded by user input within 500ms, excluding it from CLS.
        truncated:
          type: boolean
          description: True if the data field was truncated due to size limits.
    BrowserInteractionKeyEvent:
      type: object
      title: interaction_key
      description: A browser keyboard event captured via injected page script.
      required:
      - ts
      - type
      - category
      - source
      properties:
        ts:
          type: integer
          format: int64
          description: Event timestamp in Unix microseconds.
        type:
          type: string
          const: interaction_key
        category:
          type: string
          const: interaction
        source:
          $ref: '#/components/schemas/BrowserEventSource'
        data:
          allOf:
          - $ref: '#/components/schemas/BrowserEventContext'
          - type: object
            properties:
              key:
                type: string
                description: Key value from the KeyboardEvent (e.g. Enter, Backspace, a).
              selector:
                type: string
                description: CSS selector path to the element that had focus when the key was pressed.
              tag:
                type: string
                description: HTML tag name of the focused element in uppercase (e.g. INPUT, TEXTAREA, DIV).
        truncated:
          type: boolean
          description: True if the data field was truncated due to size limits.
    BrowserLiveViewDisconnectEvent:
      type: object
      description: A live view client disconnected from the headful browser's WebRTC server. Pair with live_view_connect by session_id.
      required:
      - ts
      - type
      - category
      - source
      properties:
        ts:
          type: integer
          format: int64
          description: Event timestamp in Unix microseconds.
        type:
          type: string
          const: live_view_disconnect
        category:
          type: string
          const: connection
        source:
          $ref: '#/components/schemas/BrowserEventSource'
        data:
          type: object
          additionalProperties: false
          required:
          - session_id
          - duration_ms
          properties:
            session_id:
              type: string
              description: Live view session identifier; matches the corresponding live_view_connect event.
            duration_ms:
              type: number
              description: Wall-clock duration of the connection in milliseconds.
        truncated:
          type: boolean
          description: True if the data field was truncated due to size limits.
    BrowserCdpDisconnectEvent:
      type: object
      description: An external client disconnected from the CDP WebSocket proxy on this VM. Pair with the immediately preceding cdp_connect on the same stream.
      required:
      - ts
      - type
      - category
      - source
      properties:
        ts:
          type: integer
          format: int64
          description: Event timestamp in Unix microseconds.
        type:
          type: string
          const: cdp_disconnect
        category:
          type: string
          const: connection
        source:
          $ref: '#/components/schemas/BrowserEventSource'
        data:
          type: object
          additionalProperties: false
          required:
          - duration_ms
          - message_count
          - reason
          properties:
            duration_ms:
              type: number
              description: Wall-clock duration of the connection in milliseconds.
            message_count:
              type: integer
              description: Number of CDP messages relayed across the connection in either direction.
            reason:
              type: string
              x-go-type: string
              description: 'Why the connection ended. client_close: the client initiated the close. upstream_changed: Chromium restarted mid-session and the proxy tore down so the client could reconnect against the new upstream. upstream_error: upstream dial or message pump errored. context_cancelled: the request context was cancelled (typically server shutdown).'
              enum:
              - client_close
              - upstream_changed
              - upstream_error
              - context_cancelled
        truncated:
          type: boolean
          description: True if the data field was truncated due to size limits.
    BrowserTargetType:
      type: string
      description: CDP target type of the page that produced the event.
      enum:
      - page
      - background_page
      - service_worker
      - shared_worker
      - other
    BrowserHttpHeaders:
      type: object
      description: HTTP headers map forwarded as-is from CDP without normalization. Values are typically strings but may be any JSON type.
      additionalProperties: true
    BrowserPageDomContentLoadedEvent:
      type: object
      title: page_dom_content_loaded
      description: A browser DOMContentLoaded event (CDP Page.domContentEventFired).
      required:
      - ts
      - type
      - category
      - source
      properties:
        ts:
          type: integer
          format: int64
          description: Event timestamp in Unix microseconds.
        type:
          type: string
          const: page_dom_content_loaded
        category:
          type: string
          const: page
        source:
          $ref: '#/components/schemas/BrowserEventSource'
        data:
          allOf:
          - $ref: '#/components/schemas/BrowserEventContext'
          - type: object
            properties:
              cdp_timestamp:
                type: number
                description: Chrome monotonic clock value in seconds at which DOMContentLoaded fired, relative to browser process start (not Unix epoch). Use ts for wall-clock time.
        truncated:
          type: boolean
          description: True if the data field was truncated due to size limits.
    BrowserLiveViewConnectEvent:
      type: object
      description: A live view client connected to the headful browser's WebRTC server. Headful only; not emitted for headless images.
      required:
      - ts
      - type
      - category
      - source
      properties:
        ts:
          type: integer
          format: int64
          description: Event timestamp in Unix microseconds.
        type:
          type: string
          const: live_view_connect
        category:
          type: string
          const: connection
        source:
          $ref: '#/components/schemas/BrowserEventSource'
        data:
          type: object
          additionalProperties: false
          required:
          - session_id
          properties:
            session_id:
              type: string
              description: Live view session identifier. Stable across reconnects, so a transient network blip can emit two events with the same session_id.
        truncated:
          type: boolean
          description: True if the data field was truncated due to size limits.
    BrowserNetworkLoadingFailedEvent:
      type: object
      title: network_loading_failed
      description: A browser network loading failed event. If the request was already in flight when CDP attached (no prior network_request was emitted for it), url, frame_id, loader_id, and resource_type are absent; BrowserEventContext is partially populated in that case.
      required:
      - ts
      - type
      - category
      - source
      properties:
        ts:
          type: integer
          format: int64
          description: Event timestamp in Unix microseconds.
        type:
          type: string
          const: network_loading_failed
        category:
          type: string
          const: network
        source:
          $ref: '#/components/schemas/BrowserEventSource'
        data:
          allOf:
          - $ref: '#/components/schemas/BrowserEventContext'
          - type: object
            properties:
              request_id:
                type: string
                description: CDP request identifier matching the originating network_request event.
              error_text:
                type: string
                description: Network error description (e.g. net::ERR_CONNECTION_REFUSED).
              canceled:
                type: boolean
                description: True if the request was canceled by the browser or page script.
              resource_type:
                type: string
                description: CDP Network.ResourceType for the request, passed through as-is from Chrome. Known values include Document, Fetch, XHR, Script, Stylesheet, Image, Media, Font, TextTrack, EventSource, WebSocket, Manifest, Prefetch, Other, and more.
        truncated:
          type: boolean
          description: True if the data field was truncated due to size limits.
    BrowserTelemetryEvent:
      oneOf:
      - $ref: '#/components/schemas/BrowserConsoleLogEvent'
      - $ref: '#/components/schemas/BrowserConsoleErrorEvent'
      - $ref: '#/components/schemas/BrowserNetworkRequestEvent'
      - $ref: '#/components/schemas/BrowserNetworkResponseEvent'
      - $ref: '#/components/schemas/BrowserNetworkLoadingFailedEvent'
      - $ref: '#/components/schemas/BrowserNetworkIdleEvent'
      - $ref: '#/components/schemas/BrowserPageNavigationEvent'
      - $ref: '#/components/schemas/BrowserPageDomContentLoadedEvent'
      - $ref: '#/components/schemas/BrowserPageLoadEvent'
      - $ref: '#/components/schemas/BrowserPageTabOpenedEvent'
      - $ref: '#/components/schemas/BrowserPageLayoutShiftEvent'
      - $ref: '#/components/schemas/BrowserPageLcpEvent'
      - $ref: '#/components/schemas/BrowserPageLayoutSettledEvent'
      - $ref: '#/components/schemas/BrowserPageNavigationSettledEvent'
      - $ref: '#/components/schemas/BrowserInteractionClickEvent'
      - $ref: '#/components/schemas/BrowserInteractionKeyEvent'
      - $ref: '#/components/schemas/BrowserInteractionScrollSettledEvent'
      - $ref: '#/components/schemas/BrowserMonitorScreenshotEvent'
      - $ref: '#/components/schemas/BrowserMonitorDisconnectedEvent'
      - $ref: '#/components/schemas/BrowserMonitorReconnectedEvent'
      - $ref: '#/components/schemas/BrowserMonitorReconnectFailedEvent'
      - $ref: '#/components/schemas/BrowserMonitorInitFailedEvent'
      - $ref: '#/components/schemas/BrowserApiCallEvent'
      - $ref: '#/components/schemas/BrowserCdpConnectEvent'
      - $ref: '#/components/schemas/BrowserCdpDisconnectEvent'
      - $ref: '#/components/schemas/BrowserLiveViewConnectEvent'
      - $ref: '#/components/schemas/BrowserLiveViewDisconnectEvent'
      - $ref: '#/components/schemas/BrowserCaptchaSolveResultEvent'
      - $ref: '#/components/schemas/BrowserSystemOomKillEvent'
      - $ref: '#/components/schemas/BrowserServiceCrashedEvent'
      discriminator:
        propertyName: type
        mapping:
          console_log: '#/components/schemas/BrowserConsoleLogEvent'
          console_error: '#/components/schemas/BrowserConsoleErrorEvent'
          network_request: '#/components/schemas/BrowserNetworkRequestEvent'
          network_response: '#/components/schemas/BrowserNetworkResponseEvent'
          network_loading_failed: '#/components/schemas/BrowserNetworkLoadingFailedEvent'
          network_idle: '#/components/schemas/BrowserNetworkIdleEvent'
          page_navigation: '#/components/schemas/BrowserPageNavigationEvent'
          page_dom_content_loaded: '#/components/schemas/BrowserPageDomContentLoadedEvent'
          page_load: '#/components/schemas/BrowserPageLoadEvent'
          page_tab_opened: '#/components/schemas/BrowserPageTabOpenedEvent'
          page_layout_shift: '#/components/schemas/BrowserPageLayoutShiftEvent'
          page_lcp: '#/components/schemas/BrowserPageLcpEvent'
          page_layout_settled: '#/components/schemas/BrowserPageLayoutSettledEvent'
          page_navigation_settled: '#/components/schemas/BrowserPageNavigationSettledEvent'
          interaction_click: '#/components/schemas/BrowserInteractionClickEvent'
          interaction_key: '#/components/schemas/BrowserInteractionKeyEvent'
          interaction_scroll_settled: '#/components/schemas/BrowserInteractionScrollSettledEvent'
          monitor_screenshot: '#/components/schemas/BrowserMonitorScreenshotEvent'
          monitor_disconnected: '#/components/schemas/BrowserMonitorDisconnectedEvent'
          monitor_reconnected: '#/components/schemas/BrowserMonitorReconnectedEvent'
          monitor_reconnect_failed: '#/components/schemas/BrowserMonitorReconnectFailedEvent'
          monitor_init_failed: '#/components/schemas/BrowserMonitorInitFailedEvent'
          api_call: '#/components/schemas/BrowserApiCallEvent'
          cdp_connect: '#/components/schemas/BrowserCdpConnectEvent'
          cdp_disconnect: '#/components/schemas/BrowserCdpDisconnectEvent'
          live_view_connect: '#/components/schemas/BrowserLiveViewConnectEvent'
          live_view_disconnect: '#/components/schemas/BrowserLiveViewDisconnectEvent'
          captcha_solve_result: '#/components/schemas/BrowserCaptchaSolveResultEvent'
          system_oom_kill: '#/components/schemas/BrowserSystemOomKillEvent'
          service_crashed: '#/components/schemas/BrowserServiceCrashedEvent'
      description: 'Union type representing any browser telemetry event. Discriminated on `type`. Each event''s `category` determines when it is captured. The CDP collector-health events (monitor_disconnected, monitor_reconnected, monitor_reconnect_failed, monitor_init_failed) use the `monitor` category, which is not user-configurable: it flows automatically whenever any CDP category (console, network, page, interaction) is captured, and is silent otherwise. monitor_screenshot uses the opt-in `screenshot` category. All other event types are controlled by their per-category enable/disable flags.

        '
    BrowserServiceCrashedEvent:
      type: object
      description: A managed service exited unexpectedly. Intentional stops do not produce this event; only unexpected exits and terminal restart-give-up transitions do.
      required:
      - ts
      - type
      - category
      - source
      properties:
        ts:
          type: integer
          format: int64
          description: Event timestamp in Unix microseconds.
        type:
          type: string
          const: service_crashed
        category:
          type: string
          const: system
        source:
          $ref: '#/components/schemas/BrowserEventSource'
        data:
          type: object
          additionalProperties: false
          required:
          - service_name
          - phase
          properties:
            service_name:
              type: string
              description: Program name of the crashed service (e.g. chromium, mutter, kernel-images-api).
            pid:
              type: integer
              description: PID of the crashed process. Absent when the process manager gave up after exhausting restart attempts.
            phase:
              type: string
              x-go-type: string
              description: 'Lifecycle phase the crash occurred in. startup: the process died before reaching a healthy running state. running: a previously healthy process died unexpectedly. gave_up: the process manager exhausted its restart attempts and stopped trying.'
              enum:
              - startup
              - running
              - gave_up
        truncated:
          type: boolean
          description: True if the data field was truncated due to size limits.
    BrowserTelemetryEventEnvelope:
      type: object
      description: 'Envelope wrapping a browser telemetry event with its monotonic sequence number. Each SSE data: frame carries one envelope as JSON. The seq value is also emitted as the SSE id: field so clients can pass it as Last-Event-ID on reconnect.

        '
      required:
      - seq
      - event
      properties:
        seq:
          type: integer
          format: int64
          minimum: 1
          description: 'Process-monotonic sequence number assigned by the browser VM. Pass as Last-Event-ID on reconnect to resume without gaps. Gaps in received seq values indicate dropped events.

            '
        event:
          $ref: '#/components/schemas/BrowserTelemetryEvent'
      additionalProperties: false
  responses:
    BadRequest:
      description: Bad Request – invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized – missing or invalid authorization token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Forbidden – insufficient permissions or plan
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
