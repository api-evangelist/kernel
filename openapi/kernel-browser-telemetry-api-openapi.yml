openapi: 3.2.0
info:
  description: Developer tools and cloud infrastructure for AI agents to use web browsers
  title: Kernel Browser Telemetry API
  version: 0.1.0
servers:
- description: API Server
  url: https://api.onkernel.com
security:
- bearerAuth: []
tags:
- description: Stream live telemetry events from a browser session, and manage the destinations sessions export them to.
  name: Browser Telemetry
paths:
  /browsers/{id_or_name}/telemetry/events:
    get:
      description: Reads a page of telemetry events for the browser session. To page through results, pass the X-Next-Offset value from the previous response as offset and repeat while X-Has-More is true. The category and type filters apply within each page, so a filtered page may be empty while X-Has-More is true. Returns an empty list when telemetry data is unavailable.
      operationId: readBrowserTelemetryEvents
      parameters:
      - description: Browser session ID or name
        example: htzv5orfit78e1m2biiifpbv
        in: path
        name: id_or_name
        required: true
        schema:
          type: string
      - description: 'Opaque pagination cursor: pass the X-Next-Offset value from the previous response to fetch the next page. When set, paging continues from this cursor and since is ignored, while until still bounds the page. It is not an event''s seq field, so do not derive it from the response body.

          '
        in: query
        name: offset
        required: false
        schema:
          minimum: 0
          type: integer
      - description: 'Start of the window: an RFC-3339 timestamp, or a duration like 5m meaning that long ago. Defaults to 5m. Ignored when offset is set.

          '
        in: query
        name: since
        required: false
        schema:
          type: string
      - description: 'End of the window (exclusive): an RFC-3339 timestamp, or a duration like 5m meaning that long ago.

          '
        in: query
        name: until
        required: false
        schema:
          type: string
      - description: Maximum number of events per page. Defaults to 20.
        in: query
        name: limit
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          type: integer
      - description: Restrict results to these event categories. Repeat the parameter for multiple values.
        in: query
        name: category
        required: false
        schema:
          items:
            enum:
            - console
            - network
            - page
            - interaction
            - control
            - platform
            - connection
            - system
            - screenshot
            - captcha
            - monitor
            type: string
          type: array
      - description: 'Restrict results to these event types, such as page_crashed or captcha_challenge_result. Repeat the parameter for multiple values. Combines with category: when both are set an event must match both.

          '
        in: query
        name: type
        required: false
        schema:
          items:
            type: string
          type: array
      - description: 'Read direction. asc (default) reads oldest first, starting from since or the offset cursor. desc reads newest first: each request returns one page of up to limit records ending at the offset cursor (or until, or the newest archived event); combining desc with since is rejected with a 400.

          '
        in: query
        name: order
        required: false
        schema:
          default: asc
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/BrowserTelemetryEventEnvelope'
                type: array
          description: A page of telemetry events.
          headers:
            X-Has-More:
              description: Whether more results are available
              schema:
                type: boolean
            X-Next-Offset:
              description: The offset where the next page starts. 0 when there are no more results.
              schema:
                type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - bearerAuth: []
      summary: Read telemetry events for a browser session
      tags:
      - Browser Telemetry
  /browsers/{id_or_name}/telemetry/stream:
    get:
      description: 'Streams browser telemetry events as a server-sent events (SSE) stream. The stream closes when the browser session terminates. Each event frame includes an id: field containing a monotonically increasing sequence number; pass it as Last-Event-ID on reconnect to resume without gaps. The event: field is never set; event frames carry JSON in the data: field. A frame with an id: field and no data: field moves Last-Event-ID past events that were not delivered, because a type filter excluded them or they could not be decoded or exceeded the size limit; SSE clients dispatch no event for it. A keepalive comment frame is sent every 15 seconds when no events arrive. Returns 404 if the browser session does not exist. If telemetry was not enabled on the session, the stream opens but no events are delivered. Fresh connections only see new events; pass replay=all to start from the oldest retained event instead.'
      operationId: streamBrowserTelemetry
      parameters:
      - description: Browser session ID or name
        example: htzv5orfit78e1m2biiifpbv
        in: path
        name: id_or_name
        required: true
        schema:
          type: string
      - description: Last event sequence number for SSE reconnection (sent by SSE clients on reconnect). Takes precedence over replay when both are present, so reconnect resumes instead of re-replaying.
        in: header
        name: Last-Event-ID
        schema:
          type: string
      - description: Pass `all` to start from the oldest retained event instead of only new events; any other value is treated as from-now. The buffer is bounded, so the first event id may be greater than 1 if older events were evicted.
        in: query
        name: replay
        schema:
          type: string
      - description: 'Deliver only these event types, such as captcha_solve_started or captcha_challenge_result. Repeat the parameter or pass comma-separated values for multiple types. Keepalive frames are always delivered. Filtered-out events are not sent. An id-only frame carrying the latest skipped id is sent about every 15 seconds while skipped events keep arriving, and otherwise with the next keepalive or when the stream ends, so the connection stays active and Last-Event-ID moves past them; a reconnect resumes after the skipped events.

          '
        in: query
        name: type
        required: false
        schema:
          items:
            type: string
          type: array
      responses:
        '200':
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/BrowserTelemetryEventEnvelope'
          description: SSE stream of telemetry events
          headers:
            X-SSE-Content-Type:
              description: Media type of SSE data events (always application/json).
              schema:
                const: application/json
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        default:
          $ref: '#/components/responses/BrowserProxyError'
      security:
      - bearerAuth: []
      summary: Stream telemetry events via SSE
      tags:
      - Browser Telemetry
  /telemetry/destinations:
    get:
      description: List customer-visible OTLP export destinations in the authenticated organization. Project-scoped credentials can list these destinations for selection by workloads in their project. Non-dashboard reads return header values redacted.
      operationId: getTelemetryDestinations
      parameters:
      - description: Limit the number of destinations to return.
        in: query
        name: limit
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          type: integer
      - description: Offset the number of destinations to return.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: Case-insensitive substring match against destination name or endpoint. IDs match by exact value.
        in: query
        name: query
        required: false
        schema:
          type: string
      - description: Exact-match filter on destination name using the database collation. In production, matching is case- and accent-insensitive.
        in: query
        name: name
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/OTLPDestination'
                type: array
          description: List of OTLP destinations
          headers:
            X-Has-More:
              description: Whether there are more destinations to fetch.
              schema:
                default: false
                type: boolean
            X-Limit:
              description: Limit the number of destinations to return.
              schema:
                default: 20
                maximum: 100
                minimum: 1
                type: integer
            X-Next-Offset:
              description: The offset where the next page starts. 0 when there are no more results.
              schema:
                nullable: true
                type: integer
            X-Offset:
              description: The offset of destinations to return.
              schema:
                default: 0
                minimum: 0
                type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - bearerAuth: []
      summary: List OTLP destinations
      tags:
      - Browser Telemetry
    post:
      description: Create an OTLP export destination in the authenticated organization. Names must be unique within the organization. Requires an organization-scoped credential or dashboard authentication; project-scoped credentials receive a 403.
      operationId: postTelemetryDestinations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTLPDestinationCreateRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OTLPDestination'
          description: OTLP destination created
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - bearerAuth: []
      summary: Create an OTLP destination
      tags:
      - Browser Telemetry
  /telemetry/destinations/{id_or_name}:
    delete:
      description: Delete an OTLP destination. Sessions bound to it are still exporting, so the delete is refused with a 409 while any exist; either wait for those sessions to end or delete them first. It is refused the same way while a managed auth connection still selects it, because that connection re-resolves the destination on every login, and while a managed auth login using it is still in progress. Requires an organization-scoped credential or dashboard authentication; project-scoped credentials receive a 403.
      operationId: deleteTelemetryDestinationByIdOrName
      parameters:
      - description: OTLP destination ID or name
        in: path
        name: id_or_name
        required: true
        schema:
          type: string
      responses:
        '204':
          description: OTLP destination deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - bearerAuth: []
      summary: Delete OTLP destination by ID or name
      tags:
      - Browser Telemetry
    get:
      description: Retrieve a customer-visible OTLP destination in the authenticated organization by its ID or name. Project-scoped credentials can retrieve these destinations for selection by workloads in their project. Non-dashboard reads return header values redacted.
      operationId: getTelemetryDestinationByIdOrName
      parameters:
      - description: OTLP destination ID or name
        in: path
        name: id_or_name
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OTLPDestination'
          description: OTLP destination details
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - bearerAuth: []
      summary: Get OTLP destination by ID or name
      tags:
      - Browser Telemetry
    patch:
      description: 'Update an OTLP destination. Sessions already exporting to it pick up the new values without restarting, which makes this the way to rotate credentials without interrupting export.


        Names must be unique within the organization. Renaming is refused with a 409 while a managed auth connection selects this destination by name, since that connection resolves the name on every login. Every other field, including `headers`, stays editable. Requires an organization-scoped credential or dashboard authentication; project-scoped credentials receive a 403.'
      operationId: patchTelemetryDestinationByIdOrName
      parameters:
      - description: OTLP destination ID or name
        in: path
        name: id_or_name
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTLPDestinationUpdateRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OTLPDestination'
          description: OTLP destination updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - bearerAuth: []
      summary: Update OTLP destination by ID or name
      tags:
      - Browser Telemetry
components:
  responses:
    BadRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Bad Request – invalid input
    Forbidden:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Forbidden – insufficient permissions or plan
    Conflict:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Conflict – resource already exists
    InternalError:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Internal Server Error
    Unauthorized:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Unauthorized – missing or invalid authorization token
    NotFound:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Resource not found
    BrowserProxyError:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InstanceProxyError'
      description: Error returned by the browser or its proxy
  schemas:
    BrowserPageCrashedEvent:
      description: 'A page''s renderer process crashed (an "Aw, Snap!" failure) while the browser process itself stayed alive. Reported on the crashed page''s session, with the session and target ids on `source.metadata`. Captured only while the `page` category is enabled.

        '
      properties:
        category:
          const: page
          type: string
        data:
          additionalProperties: false
          properties:
            target_id:
              description: CDP target identifier of the crashed page.
              type: string
            target_type:
              $ref: '#/components/schemas/BrowserTargetType'
            url:
              description: URL the page was on when its renderer process crashed.
              type: string
          required:
          - target_id
          - target_type
          - url
          type: object
        source:
          $ref: '#/components/schemas/BrowserEventSource'
        truncated:
          description: True if the data field was truncated due to size limits.
          type: boolean
        ts:
          description: Event timestamp in Unix microseconds.
          format: int64
          type: integer
        type:
          const: page_crashed
          type: string
      required:
      - ts
      - type
      - category
      - source
      title: page_crashed
      type: object
    BrowserCallStack:
      description: CDP Runtime.StackTrace representing the JavaScript call stack at the time of an event. Fields use CDP naming conventions rather than snake_case to match the Chrome DevTools Protocol wire format.
      properties:
        callFrames:
          description: Ordered list of call frames, outermost first.
          items:
            properties:
              columnNumber:
                description: Zero-based column number within the line.
                type: integer
              functionName:
                description: JavaScript function name, or empty string for anonymous functions.
                type: string
              lineNumber:
                description: Zero-based line number within the script.
                type: integer
              scriptId:
                description: CDP script identifier.
                type: string
              url:
                description: URL or name of the script file.
                type: string
            required:
            - functionName
            - scriptId
            - url
            - lineNumber
            - columnNumber
            type: object
          type: array
        description:
          description: Optional label for the stack trace (e.g. async cause).
          type: string
        parent:
          $ref: '#/components/schemas/BrowserCallStack'
          description: Parent stack trace for async stacks.
      required:
      - callFrames
      type: object
    BrowserEventContext:
      description: Browser event context stamped by the browser monitor onto all CDP-sourced events. Identifies the target, frame, and navigation epoch in which the event occurred.
      properties:
        frame_id:
          description: CDP frame identifier within the target.
          type: string
        loader_id:
          description: CDP document loader identifier, reset on each navigation.
          type: string
        nav_seq:
          description: Monotonically increasing navigation sequence number, incremented on each top-level navigation within the target.
          format: int64
          type: integer
        session_id:
          description: CDP session identifier for the target connection.
          type: string
        target_id:
          description: Browser target identifier (stable across navigations within a tab).
          type: string
        target_type:
          $ref: '#/components/schemas/BrowserTargetType'
        url:
          description: URL relevant to this event — page URL for navigation and page events, request URL for network events.
          type: string
      type: object
    InstanceProxyError:
      properties:
        code:
          $ref: '#/components/schemas/InstanceProxyErrorCode'
        message:
          description: Human-readable error description for debugging
          type: string
      required:
      - code
      - message
      type: object
    BrowserCdpBrowserCancelDownloadCommandData:
      additionalProperties: false
      description: 'Sanitized `Browser.cancelDownload` arguments. Canonical input: `Browser.cancelDownload` in devtools-protocol@2d019e73, pinned at https://github.com/ChromeDevTools/devtools-protocol/blob/2d019e73eb371d1d6985d26d395d78bd8f8a22ba/json/browser_protocol.json. Every argument of this command has a retained or redacted decision in lib/devtoolsproxy/testdata/cdp_arguments.yaml.

        '
      properties:
        browser_context_id:
          description: 'Opaque browser context identifier. Clipped to 128 characters; a longer value is not a real identifier.

            '
          maxLength: 128
          type: string
        command_id:
          description: 'The command''s JSON-RPC id, so the command can be joined to the result the browser returned for it. Absent when the client sent none.

            '
          format: int64
          type: integer
        connection_id:
          description: 'Identifies the CDP proxy connection the command arrived on, matching `cdp_connect` and `cdp_disconnect`. Two clients driving the same browser are told apart by this.

            '
          maxLength: 128
          type: string
        download_guid:
          description: 'Opaque identifier of the download that was cancelled. Clipped to 128 characters; a longer value is not a real identifier.

            '
          maxLength: 128
          type: string
        method:
          const: Browser.cancelDownload
          type: string
        session_id:
          description: 'CDP session identifier the command was addressed to. Absent for browser-level commands. Clipped to 128 characters.

            '
          maxLength: 128
          type: string
      required:
      - method
      - download_guid
      type: object
    BrowserConsoleErrorEvent:
      description: 'A browser console error or uncaught JavaScript exception event. Emitted from two distinct CDP sources with different data shapes. Runtime.consoleAPICalled (console.error calls) produces level, text, args, and stack_trace. Runtime.exceptionThrown (uncaught exceptions) produces text, line, column, source_url, and stack_trace. Fields not applicable to the source are absent.

        '
      properties:
        category:
          const: console
          type: string
        data:
          allOf:
          - $ref: '#/components/schemas/BrowserEventContext'
          - properties:
              args:
                description: All console arguments coerced to strings. Present only when sourced from Runtime.consoleAPICalled.
                items:
                  type: string
                type: array
              column:
                description: Column number in the script where the exception was thrown. Present only when sourced from Runtime.exceptionThrown.
                type: integer
              level:
                description: CDP console type value, always "error". Present only when sourced from Runtime.consoleAPICalled.
                type: string
              line:
                description: Line number in the script where the exception was thrown. Present only when sourced from Runtime.exceptionThrown.
                type: integer
              source_url:
                description: URL of the script file that threw the exception. Present only when sourced from Runtime.exceptionThrown.
                type: string
              stack_trace:
                $ref: '#/components/schemas/BrowserCallStack'
              text:
                description: 'Human-readable error text, as the browser console would display it. For console.error() calls, the first argument coerced to a string. For uncaught exceptions, the prefix and error message, e.g. "Uncaught Error: boom" or "Uncaught (in promise) TypeError: x is not a function".

                  '
                type: string
            required:
            - text
            type: object
        source:
          $ref: '#/components/schemas/BrowserEventSource'
        truncated:
          description: True if the data field was truncated due to size limits.
          type: boolean
        ts:
          description: Event timestamp in Unix microseconds.
          format: int64
          type: integer
        type:
          const: console_error
          type: string
      required:
      - ts
      - type
      - category
      - source
      title: console_error
      type: object
    BrowserInteractionKeyEvent:
      description: A browser keyboard event captured via injected page script.
      properties:
        category:
          const: interaction
          type: string
        data:
          allOf:
          - $ref: '#/components/schemas/BrowserEventContext'
          - properties:
              key:
                description: Key value from the KeyboardEvent (e.g. Enter, Backspace, a).
                type: string
              selector:
                description: CSS selector path to the element that had focus when the key was pressed.
                type: string
              tag:
                description: HTML tag name of the focused element in uppercase (e.g. INPUT, TEXTAREA, DIV).
                type: string
            type: object
        source:
          $ref: '#/components/schemas/BrowserEventSource'
        truncated:
          description: True if the data field was truncated due to size limits.
          type: boolean
        ts:
          description: Event timestamp in Unix microseconds.
          format: int64
          type: integer
        type:
          const: interaction_key
          type: string
      required:
      - ts
      - type
      - category
      - source
      title: interaction_key
      type: object
    BrowserPageLcpEvent:
      description: A browser Largest Contentful Paint (LCP) event from the Performance Timeline API.
      properties:
        category:
          const: page
          type: string
        data:
          allOf:
          - $ref: '#/components/schemas/BrowserEventContext'
          - properties:
              lcp_details:
                additionalProperties: false
                description: LargestContentfulPaint attributes from the Performance Timeline entry.
                properties:
                  element_id:
                    description: id attribute of the LCP element, if present.
                    type: string
                  load_time:
                    description: Load time of the LCP element in milliseconds.
                    type: number
                  node_id:
                    description: CDP DOM node identifier of the LCP element.
                    type: integer
                  render_time:
                    description: Render time of the LCP element in milliseconds; 0 for cross-origin images without Timing-Allow-Origin.
                    type: number
                  size:
                    description: Visible area of the LCP element in pixels squared.
                    type: number
                  url:
                    description: URL of the LCP element for image or video elements.
                    type: string
                type: object
              source_frame_id:
                description: CDP frame identifier of the frame where the LCP element was rendered.
                type: string
              time:
                description: Performance Timeline timestamp of the LCP entry in milliseconds.
                type: number
            type: object
        source:
          $ref: '#/components/schemas/BrowserEventSource'
        truncated:
          description: True if the data field was truncated due to size limits.
          type: boolean
        ts:
          description: Event timestamp in Unix microseconds.
          format: int64
          type: integer
        type:
          const: page_lcp
          type: string
      required:
      - ts
      - type
      - category
      - source
      title: page_lcp
      type: object
    BrowserEventSource:
      description: Provenance metadata identifying which producer emitted the event.
      properties:
        event:
          description: Producer-specific event name (e.g. Runtime.consoleAPICalled for CDP-sourced console events, Runtime.exceptionThrown for uncaught exceptions).
          type: string
        kind:
          description: 'Event producer. cdp: Chrome DevTools Protocol events from the browser. kernel_api: Kernel API server. extension: injected Chrome extension. local_process: system process running alongside the browser.'
          enum:
          - cdp
          - kernel_api
          - extension
          - local_process
          type: string
        metadata:
          additionalProperties:
            type: string
          description: Producer-specific context (e.g. CDP target/session/frame IDs).
          type: object
      required:
      - kind
      type: object
    BrowserCdpTransitionType:
      description: 'Navigation reason reported by the caller. Canonical values from devtools-protocol@2d019e73. `other` stands for a value outside that set, so a client cannot put an arbitrary string into the stream.

        '
      enum:
      - link
      - typed
      - address_bar
      - auto_bookmark
      - auto_subframe
      - manual_subframe
      - generated
      - auto_toplevel
      - form_submit
      - reload
      - keyword
      - keyword_generated
      - other
      type: string
      x-enum-varnames:
      - BrowserCdpTransitionTypeLink
      - BrowserCdpTransitionTypeTyped
      - BrowserCdpTransitionTypeAddressBar
      - BrowserCdpTransitionTypeAutoBookmark
      - BrowserCdpTransitionTypeAutoSubframe
      - BrowserCdpTransitionTypeManualSubframe
      - BrowserCdpTransitionTypeGenerated
      - BrowserCdpTransitionTypeAutoToplevel
      - BrowserCdpTransitionTypeFormSubmit
      - BrowserCdpTransitionTypeReload
