          x-enum-varnames:
          - BrowserCaptchaSolveStartedEventCategoryCaptcha
        data:
          additionalProperties: false
          description: Per-task payload. A visible challenge may create multiple tasks. When present, task_id correlates this event with a captcha_solve_result, while challenge_id groups tasks from the same challenge. Events may arrive out of order or be absent, so their arrival does not indicate current solve state.
