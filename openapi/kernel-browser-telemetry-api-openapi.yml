    BrowserCaptchaChallengeResultEvent:
      description: A captcha challenge reached an observed or inferred terminal outcome.
      properties:
        category:
          const: captcha
          type: string
          x-enum-varnames:
          - BrowserCaptchaChallengeResultEventCategoryCaptcha
        data:
          additionalProperties: false
          description: 'An observed challenge emits one outcome across any number of solver tasks. For eligible providers without a widget observer, each successful token task emits an inferred solved result instead; multiple such results may belong to one challenge. Failed tasks and image_challenge rounds produce no inferred result. Exactly one of challenge_id or task_id is present: challenge_id on an observed result, task_id on an inferred one. A challenge whose tasks all fail produces task events only, so consumers fall back to captcha_solve_result for it.'
          properties:
            captcha_provider:
              $ref: '#/components/schemas/BrowserCaptchaProvider'
            captcha_type:
              $ref: '#/components/schemas/BrowserCaptchaType'
              deprecated: true
              description: 'Deprecated: use captcha_provider.'
            challenge_id:
              $ref: '#/components/schemas/BrowserCaptchaChallengeID'
            duration_ms:
              description: Wall-clock duration from the challenge appearing to its terminal outcome, covering every solver attempt in between. For an inferred result, the duration of its solver task.
              type: number
            inferred:
              description: True when the relay derived this result from a successful token task without observing the page. An inferred result has task_id instead of challenge_id. Absent on page-observed results.
              type: boolean
            status:
              description: 'Terminal outcome of a challenge. solved: the page observed the challenge clear after a solver attempt, or an inferred result reports a token for the whole widget without page observation. failure: a terminal solver failure occurred, or all attempts ended while the challenge remained. timeout: the challenge-level wait budget expired while the challenge remained. abandoned: observation ended without an attributable terminal challenge outcome. This includes a dismissed widget or page unload without a solved signal or terminal solver outcome, and a token appearing while multiple same-provider challenges are open, because the producer cannot attribute that token to this visible challenge. A captcha_solve_result with the same challenge_id may therefore report success while the challenge result reports abandoned. A solved challenge does not prove the site accepted the token or that the guarded action succeeded.'
              enum:
              - solved
              - failure
              - timeout
              - abandoned
              type: string
              x-enum-varnames:
              - ChallengeSolved
              - ChallengeFailure
              - ChallengeTimeout
              - ChallengeAbandoned
            task_id:
              description: The task_id of the solver task an inferred result was derived from. Join on it to pair the result with that task's captcha_solve_started and captcha_solve_result. Present only when inferred is true.
              type: string
            website_host:
              description: Host of the page where the challenge appeared.
              type: string
            website_path:
              description: Path of the page where the challenge appeared. Query string excluded.
              type: string
          required:
          - captcha_type
          - status
          - duration_ms
          type: object
        source:
          $ref: '#/components/schemas/BrowserEventSource'
        truncated:
          description: True if the data field was truncated due to size limits.
          type: boolean
        ts:
          description: Event timestamp in Unix microseconds.
          format: int64
          type: integer
        type:
          const: captcha_challenge_result
          type: string
      required:
      - ts
      - type
      - category
      - source
      - data
      type: object
