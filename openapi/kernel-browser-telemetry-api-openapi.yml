    BrowserProxyErrorEvent:
      description: 'A branded proxy-layer failure observed by the browser. Emitted when the metro egress host-proxy serves a branded error page whose response carries the X-Kernel-Proxy-Error header: a 502 for proxy-layer failures, or a 403 when the session''s network policy blocks the destination. Low-volume and carries a typed code. Its value is per-session and per-URL attribution for sessions that already capture the network stream: proxy failures are only observable while the CDP network collector is running, so this is an opt-in refinement of the raw network events rather than a default-on alerting signal.

        '
      properties:
        category:
          const: network
          type: string
        data:
          allOf:
          - $ref: '#/components/schemas/BrowserEventContext'
          - properties:
              code:
                description: 'Proxy-layer error code: the X-Kernel-Proxy-Error response header value from a branded error page served by the metro egress host-proxy. Values mirror what the proxy emits: destination_blocked, destination_route_unavailable, network_policy_denied, provider_blacklisted, provider_unreachable, provider_rejected, origin_tls_timeout, origin_response_incomplete, proxy_unavailable, restricted_route_unavailable, upstream_timeout, upstream_dns_failure, upstream_connect_failed. A header value the browser image does not recognize is reported as unknown, with the header value in raw_code.

                  '
                enum:
                - destination_blocked
                - destination_route_unavailable
                - network_policy_denied
                - provider_blacklisted
                - provider_unreachable
                - provider_rejected
                - origin_tls_timeout
                - origin_response_incomplete
                - proxy_unavailable
                - restricted_route_unavailable
                - upstream_timeout
                - upstream_dns_failure
                - upstream_connect_failed
                - unknown
                type: string
                x-enum-varnames:
                - BrowserProxyErrorEventDataCodeDestinationBlocked
                - BrowserProxyErrorEventDataCodeDestinationRouteUnavailable
                - BrowserProxyErrorEventDataCodeNetworkPolicyDenied
                - BrowserProxyErrorEventDataCodeProviderBlacklisted
                - BrowserProxyErrorEventDataCodeProviderUnreachable
                - BrowserProxyErrorEventDataCodeProviderRejected
                - BrowserProxyErrorEventDataCodeOriginTLSTimeout
                - BrowserProxyErrorEventDataCodeOriginResponseIncomplete
                - BrowserProxyErrorEventDataCodeProxyUnavailable
                - BrowserProxyErrorEventDataCodeRestrictedRouteUnavailable
                - BrowserProxyErrorEventDataCodeUpstreamTimeout
                - BrowserProxyErrorEventDataCodeUpstreamDNSFailure
                - BrowserProxyErrorEventDataCodeUpstreamConnectFailed
                - BrowserProxyErrorEventDataCodeUnknown
              method:
                description: HTTP method of the failed request, when known.
                type: string
              raw_code:
                description: 'Sanitized X-Kernel-Proxy-Error header value, present only when code is unknown. Surrounding whitespace is removed, the value is lowercased, characters outside [a-z0-9_] are replaced with _, and the result is truncated to at most 64 characters.

                  '
                maxLength: 64
                pattern: ^[a-z0-9_]*$
                type: string
              request_id:
                description: CDP request identifier matching the originating request.
                type: string
              resource_type:
                description: CDP Network.ResourceType for the request, when known.
                type: string
              status:
                description: HTTP response status of the branded error page (502, or 403 for network_policy_denied).
                type: integer
            required:
            - request_id
            - code
            - status
            type: object
        source:
          $ref: '#/components/schemas/BrowserEventSource'
        truncated:
          description: True if the data field was truncated due to size limits.
          type: boolean
        ts:
          description: Event timestamp in Unix microseconds.
          format: int64
          type: integer
        type:
          const: proxy_error
          type: string
      required:
      - ts
      - type
      - category
      - source
      title: proxy_error
      type: object
