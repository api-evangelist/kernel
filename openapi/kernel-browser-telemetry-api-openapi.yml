    BrowserCdpDisconnectEvent:
      description: An external client disconnected from the CDP WebSocket proxy on this VM. Pair with the immediately preceding cdp_connect on the same stream.
      properties:
        category:
          const: connection
          type: string
        data:
          additionalProperties: false
          properties:
            connection_id:
              description: Identifies this CDP proxy connection, matching the connection_id on the cdp_command events that arrived on it. Two clients driving the same browser are told apart by this.
              maxLength: 128
              type: string
            duration_ms:
              description: Wall-clock duration of the connection in milliseconds.
              type: number
            message_count:
              description: Number of CDP messages relayed across the connection in either direction.
              type: integer
            reason:
              description: 'Why the connection ended. client_close: the client initiated the close. upstream_changed: Chromium restarted mid-session and the proxy tore down so the client could reconnect against the new upstream. upstream_error: upstream dial or message pump errored. context_cancelled: the request context was cancelled (typically server shutdown).'
              enum:
              - client_close
              - upstream_changed
              - upstream_error
              - context_cancelled
              type: string
              x-go-type: string
            telemetry_dropped:
              description: 'Number of forwarded client frames the classifier never saw, because it could not keep up or because classification failed. An upper bound on lost commands rather than a count: a saturated queue turns away whatever arrives next, which may be library traffic that would have produced no event. Telemetry loss only; every command was still relayed to the browser. Absent on events from a browser image predating the field, which is not the same as zero.'
              type: integer
            telemetry_excluded:
              description: Number of forwarded client commands that produced no cdp_command event because their method is listed in control.cdp.excluded_methods. Configuration rather than loss, so it is counted apart from telemetry_dropped.
              type: integer
          required:
          - duration_ms
          - message_count
          - reason
          type: object
        source:
          $ref: '#/components/schemas/BrowserEventSource'
        truncated:
          description: True if the data field was truncated due to size limits.
          type: boolean
        ts:
          description: Event timestamp in Unix microseconds.
          format: int64
          type: integer
        type:
          const: cdp_disconnect
          type: string
      required:
      - ts
      - type
      - category
      - source
      type: object
