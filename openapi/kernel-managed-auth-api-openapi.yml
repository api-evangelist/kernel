          type: string
        event:
          const: managed_auth_state
          description: Event type identifier (always "managed_auth_state").
          type: string
        external_action_message:
          description: Instructions for external action (present when flow_step=AWAITING_EXTERNAL_ACTION).
          type: string
        fields:
          description: Canonical fields awaiting input. Prefer this over discovered_fields when present.
          items:
            $ref: '#/components/schemas/ManagedAuthField'
          type: array
        flow_status:
          description: Current flow status.
          enum:
          - IN_PROGRESS
          - SUCCESS
          - FAILED
          - EXPIRED
          - CANCELED
          type: string
        flow_step:
          description: Current step in the flow.
          enum:
          - DISCOVERING
          - AWAITING_INPUT
          - AWAITING_EXTERNAL_ACTION
          - SUBMITTING
          - COMPLETED
          type: string
        flow_type:
          description: Type of the current flow.
          enum:
          - LOGIN
          - REAUTH
          type: string
        hosted_url:
          description: URL to redirect user to for hosted login.
          format: uri
          type: string
        interaction_id:
          description: Opaque identifier for the current canonical interaction. Required when submitting fields or choices and changes for each new actionable pause.
          example: mai_abc123xyz
          type: string
        live_view_url:
          description: Browser live view URL for debugging.
          format: uri
          type: string
        mfa_options:
          description: MFA method options (present when flow_step=AWAITING_INPUT; may also be present with AWAITING_EXTERNAL_ACTION as fallback actions).
          items:
            $ref: '#/components/schemas/MFAOption'
          type: array
        pending_sso_buttons:
          description: SSO buttons available (present when flow_step=AWAITING_INPUT; may also be present with AWAITING_EXTERNAL_ACTION as fallback actions).
          items:
            $ref: '#/components/schemas/SSOButton'
          type: array
        post_login_url:
          description: URL where the browser landed after successful login.
          format: uri
          type: string
        sign_in_options:
          description: Non-MFA choices presented during the auth flow, such as account selection or org pickers (present when flow_step=AWAITING_INPUT; may also be present with AWAITING_EXTERNAL_ACTION as fallback actions).
          items:
            $ref: '#/components/schemas/SignInOption'
          type: array
        timestamp:
          description: Time the state was reported.
          format: date-time
          type: string
        website_error:
          description: Visible error message from the website (e.g., 'Incorrect password'). Present when the website displays an error during login.
          type: string
      required:
      - event
      - timestamp
      - flow_status
      - flow_step
      type: object
    ManagedAuthBrowserConfig:
      additionalProperties: false
      description: Browser configuration applied to browser sessions created for a managed auth connection. Managed auth controls the profile, headless mode, timeout, start URL, kiosk mode, and viewport.
      properties:
        proxy:
          $ref: '#/components/schemas/BrowserProxyConfig'
          description: Proxy configuration for managed auth browser sessions. Omit on create to derive the default from stealth, or on update and login to preserve or inherit the connection default.
        region:
          $ref: '#/components/schemas/Region'
          description: 'Browser region. Omit on create to use us-east, on update to keep the current region, or on login to inherit it. Login overrides apply only to that login. Non-default regions require an eligible plan and organization access.

            '
