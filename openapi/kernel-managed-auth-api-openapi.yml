openapi: 3.2.0
info:
  description: Developer tools and cloud infrastructure for AI agents to use web browsers
  title: Kernel Managed Auth API
  version: 0.1.0
servers:
- description: API Server
  url: https://api.onkernel.com
security:
- bearerAuth: []
tags:
- description: Create and manage auth connections for automated credential capture and login.
  name: Managed Auth
paths:
  /auth/connections:
    get:
      description: List auth connections with optional filters for profile_name and domain.
      operationId: getAuthConnections
      parameters:
      - description: Filter by profile name
        in: query
        name: profile_name
        required: false
        schema:
          type: string
      - description: Filter by domain
        in: query
        name: domain
        required: false
        schema:
          type: string
      - description: Maximum number of results to return
        in: query
        name: limit
        required: false
        schema:
          default: 20
          maximum: 100
          type: integer
      - description: Number of results to skip
        in: query
        name: offset
        required: false
        schema:
          default: 0
          type: integer
      - description: Search auth connections by ID, domain, or profile name.
        in: query
        name: query
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ManagedAuth'
                type: array
          description: List of auth connections
          headers:
            X-Has-More:
              description: Whether there are more results
              schema:
                type: boolean
            X-Next-Offset:
              description: The offset where the next page starts. 0 when there are no more results.
              schema:
                type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - bearerAuth: []
      summary: List auth connections
      tags:
      - Managed Auth
    post:
      description: Creates an auth connection for a profile and domain combination. If the provided profile_name does not exist, it is created automatically. Returns 409 Conflict if an auth connection already exists for the given profile and domain.
      operationId: postAuthConnections
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagedAuthCreateRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedAuth'
          description: Auth connection created
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          content:
            application/json:
              schema:
                properties:
                  code:
                    example: already_exists
                    type: string
                  existing_id:
                    description: ID of the existing auth connection
                    type: string
                  message:
                    example: Auth connection already exists for this profile and domain
                    type: string
                required:
                - code
                - message
                - existing_id
                type: object
          description: Auth connection already exists for this profile and domain
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - bearerAuth: []
      summary: Create auth connection
      tags:
      - Managed Auth
  /auth/connections/{id}:
    delete:
      description: 'Deletes an auth connection and terminates its workflow. This will:

        - Delete the auth connection record

        - Terminate the Temporal workflow

        - Cancel any in-progress login flows'
      operationId: deleteAuthConnectionsById
      parameters:
      - description: Auth connection ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Auth connection deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - bearerAuth: []
      summary: Delete auth connection
      tags:
      - Managed Auth
    get:
      description: Retrieve an auth connection by its ID. Includes current flow state if a login is in progress.
      operationId: getAuthConnectionsById
      parameters:
      - description: Auth connection ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedAuth'
          description: Auth connection details
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - bearerAuth: []
      summary: Get auth connection
      tags:
      - Managed Auth
    patch:
      description: Update an auth connection's configuration. Only the fields provided will be updated.
      operationId: patchAuthConnectionsById
      parameters:
      - description: Auth connection ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagedAuthUpdateRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedAuth'
          description: Auth connection updated successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - bearerAuth: []
      summary: Update auth connection
      tags:
      - Managed Auth
  /auth/connections/{id}/events:
    get:
      description: 'Establishes a Server-Sent Events (SSE) stream that delivers real-time

        login flow state updates. The stream terminates automatically once

        the flow reaches a terminal state (SUCCESS, FAILED, EXPIRED, CANCELED).'
      operationId: getAuthConnectionsEventsById
      parameters:
      - description: The auth connection ID to follow.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ManagedAuthEvent'
          description: SSE stream of auth connection state updates.
          headers:
            X-SSE-Content-Type:
              description: Media type of SSE data events (always application/json).
              schema:
                const: application/json
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - bearerAuth: []
      summary: Stream login flow events via SSE
      tags:
      - Managed Auth
  /auth/connections/{id}/exchange:
    post:
      description: Validates the handoff code and returns a JWT token for subsequent requests. Used by the hosted login UI.
      operationId: postAuthConnectionsExchange
      parameters:
      - description: Auth connection ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagedAuthExchangeRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedAuthExchangeResponse'
          description: Exchange successful, JWT returned
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '500':
          $ref: '#/components/responses/InternalError'
      summary: Exchange handoff code for JWT
      tags:
      - Managed Auth
      x-cli-skip: true
      x-hidden: true
      x-stainless-skip: true
  /auth/connections/{id}/login:
    post:
      description: Starts a login flow for the auth connection. Returns immediately with a hosted URL for the user to complete authentication, or triggers automatic re-auth if credentials are stored.
      operationId: postAuthConnectionsLogin
      parameters:
      - description: Auth connection ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: false
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: Login flow started
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Login flow already in progress
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - bearerAuth: []
      summary: Start login flow
      tags:
      - Managed Auth
  /auth/connections/{id}/submit:
    post:
      description: Submits field values for the login form. Poll the auth connection to track progress and get results.
      operationId: postAuthConnectionsSubmit
      parameters:
      - description: Auth connection ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitFieldsRequest'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitFieldsResponse'
          description: Submission accepted for processing
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - bearerAuth: []
      summary: Submit field values
      tags:
      - Managed Auth
  /auth/connections/{id}/timeline:
    get:
      description: 'Returns a chronological timeline of events for an auth connection —

        login attempts, automatic re-auth attempts, and health checks. Events

        are returned newest-first.'
      operationId: getAuthConnectionsTimelineById
      parameters:
      - description: Auth connection ID
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Filter the timeline to a single event type.
        in: query
        name: type
        required: false
        schema:
          enum:
          - login
          - reauth
          - health_check
          type: string
      - description: Maximum number of events to return
        in: query
        name: limit
        required: false
        schema:
          default: 20
          maximum: 100
          type: integer
      - description: Number of events to skip
        in: query
        name: offset
        required: false
        schema:
          default: 0
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ManagedAuthTimelineEvent'
                type: array
          description: Event timeline for the auth connection
          headers:
            X-Has-More:
              description: Whether there are more results
              schema:
                type: boolean
            X-Next-Offset:
              description: The offset where the next page starts. 0 when there are no more results.
              schema:
                type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - bearerAuth: []
      summary: Get auth connection event timeline
      tags:
      - Managed Auth
components:
  schemas:
    BrowserTelemetryCategoryConfig:
      description: Per-category telemetry configuration.
      properties:
        enabled:
          description: Whether this category is captured. Operational categories (control, connection, system, captcha) default to true; set false to opt out. CDP categories (console, network, page, interaction), screenshot and platform default to false; set true to opt in.
          type: boolean
      type: object
    ManagedAuthExchangeResponse:
      additionalProperties: false
      description: Response from exchange endpoint
      properties:
        invocation_id:
          description: Invocation ID
          example: abc123xyz
          type: string
        jwt:
          description: JWT token with invocation_id claim (30 minute TTL)
          example: eyJ0eXAi...
          type: string
      required:
      - invocation_id
      - jwt
      type: object
    Region:
      description: 'Geographic region for hosting browser sessions or pools.

        '
      enum:
      - us-east
      - us-west
      - eu-west
      - ap-southeast
      type: string
    SubmitFieldsRequest:
      additionalProperties: false
      description: Request to submit field values, click an SSO button, select an MFA method, or select a sign-in option. Prefer canonical selected_choice_id/field_values when the API returns fields/choices; legacy fields/sso_button_selector/sso_provider/mfa_option_id/sign_in_option_id remain supported during deprecation.
      properties:
        field_values:
          additionalProperties:
            type: string
          description: Canonical map of field ID to submitted value.
          example:
            field_email: user@example.com
            field_password: secret
          type: object
        fields:
          additionalProperties:
            type: string
          description: Map of field name to value
          example:
            email: user@example.com
            password: secret
          type: object
        interaction_id:
          description: Opaque interaction ID returned with canonical fields and choices. Required for canonical submissions.
          example: mai_abc123xyz
          type: string
        mfa_option_id:
          description: The MFA method type to select (when mfa_options were returned)
          example: sms
          type: string
        selected_choice_id:
          description: Canonical choice ID selected by the user.
          example: google
          type: string
        sign_in_option_id:
          description: The sign-in option ID to select (when sign_in_options were returned)
          example: work-account
          type: string
        sso_button_selector:
          description: XPath selector for the SSO button to click (ODA). Use sso_provider instead for CUA.
          example: xpath=//button[contains(text(), 'Continue with Google')]
          type: string
        sso_provider:
          description: SSO provider to click, matching the provider field from pending_sso_buttons (e.g., "google", "github"). Cannot be used with sso_button_selector.
          example: google
          type: string
      type: object
    BrowserProxyConfig:
      additionalProperties: false
      description: 'Browser proxy configuration. Provide exactly one of mode, id, or name; an empty object is invalid.

        Set mode to direct for no proxy regardless of stealth. Set mode to default to use the browser''s stealth-derived default: Kernel''s default stealth proxy when stealth=true, or direct egress when stealth=false.

        Select id or name to use that proxy regardless of stealth. The selected proxy must be in the same project as the browser. Names must match exactly one active proxy; use id for stable references.

        Proxy configuration changes only egress and does not change stealth or CAPTCHA solver behavior. A stealth browser using mode=direct still runs in stealth mode with the CAPTCHA solver enabled.

        When proxy is omitted on browser creation, stealth browsers use Kernel''s default stealth proxy and non-stealth browsers use direct egress. When omitted on update, the current configuration is unchanged.

        '
      oneOf:
      - required:
        - mode
      - required:
        - id
      - required:
        - name
      properties:
        id:
          description: Proxy ID.
          minLength: 1
          type: string
        mode:
          $ref: '#/components/schemas/BrowserProxyMode'
        name:
          description: Proxy name. Must match exactly one active proxy in the project.
          minLength: 1
          type: string
      type: object
    SSEHeartbeatEvent:
      description: Heartbeat event sent periodically to keep SSE connection alive.
      properties:
        event:
          const: sse_heartbeat
          description: Event type identifier (always "sse_heartbeat").
          type: string
        timestamp:
          description: Time the heartbeat was sent.
          format: date-time
          type: string
      required:
      - event
      - timestamp
      type: object
    BrowserCdpCommandMethod:
      description: 'A browser-control CDP method the proxy reports. The set covers the commands an agent drives the browser with; configuration, DOM and Runtime bookkeeping, and Chrome-specific UI commands are outside it. Canonical definitions: devtools-protocol@2d019e73.

        '
      enum:
      - Input.dispatchMouseEvent
      - Input.dispatchKeyEvent
      - Input.insertText
      - Input.imeSetComposition
      - Input.dispatchTouchEvent
      - Input.dispatchDragEvent
      - Input.cancelDragging
      - Input.emulateTouchFromMouseEvent
      - Input.synthesizePinchGesture
      - Input.synthesizeScrollGesture
      - Input.synthesizeTapGesture
      - DOM.setFileInputFiles
      - DOM.focus
      - DOM.scrollIntoViewIfNeeded
      - Page.bringToFront
      - Page.captureScreenshot
      - Page.captureSnapshot
      - Page.handleJavaScriptDialog
      - Page.navigate
      - Page.navigateToHistoryEntry
      - Page.reload
      - Page.printToPDF
      - Page.startScreencast
      - Page.stopScreencast
      - Page.stopLoading
      - Page.close
      - Page.setWebLifecycleState
      - Target.activateTarget
      - Target.closeTarget
      - Target.createTarget
      - Target.createBrowserContext
      - Target.disposeBrowserContext
      - Target.openDevTools
      - Browser.cancelDownload
      - Browser.close
      - Browser.setWindowBounds
      - Browser.setContentsSize
      - Autofill.trigger
      type: string
    BrowserTelemetryControlConfig:
      description: Configuration for the control category. Same enabled semantics as any other category, plus settings for the browser-control commands the CDP proxy reports.
      properties:
        cdp:
          $ref: '#/components/schemas/BrowserTelemetryCdpControlConfig'
          description: Settings for the cdp_command events the CDP proxy reports. Merged independently of enabled, so a later update that only sets enabled keeps the current exclusion list.
        enabled:
          description: Whether this category is captured. Control is on by default; set false to opt out.
          type: boolean
      type: object
    Error:
      properties:
        code:
          description: Application-specific error code (machine-readable)
          example: bad_request
          type: string
        details:
          description: Additional error details (for multiple errors)
          items:
            $ref: '#/components/schemas/ErrorDetail'
          type: array
        inner_error:
          $ref: '#/components/schemas/ErrorDetail'
        message:
          description: Human-readable error description for debugging
          example: 'Missing required field: app_name'
          type: string
      required:
      - code
      - message
      type: object
    SubmitFieldsResponse:
      additionalProperties: false
      description: Response from submitting field values
      properties:
        accepted:
          description: Whether the submission was accepted for processing
          type: boolean
      required:
      - accepted
      type: object
    MFAType:
      description: The MFA delivery method type. Includes 'password' for auth method selection pages and 'switch' for generic method-switcher links like "Use another method" that do not name a specific method.
      enum:
      - sms
      - call
      - email
      - totp
      - push
      - password
      - switch
      example: sms
      type: string
    ManagedAuthField:
      additionalProperties: false
      description: Canonical field awaiting user input.
      properties:
        hint:
          description: Context shown near the field, including a masked code destination.
          type: string
        id:
          description: Stable field identifier for canonical submit.
          example: field_email
          type: string
        input_mode:
          description: Virtual keyboard hint, independent of field type and browser validation.
          enum:
          - text
          - email
          - tel
          - numeric
          example: email
          type: string
          x-enum-varnames:
          - ManagedAuthFieldInputModeText
          - ManagedAuthFieldInputModeEmail
          - ManagedAuthFieldInputModeTel
          - ManagedAuthFieldInputModeNumeric
        label:
          description: Human-readable label shown to the user.
          example: Email address
          type: string
        observed_selector:
          description: Selector for the visible field, when available.
          example: input[name="identifier"]
          nullable: true
          type: string
        reason:
          description: Why the field requires user input.
          enum:
          - missing
          - rejected
          example: missing
          type: string
          x-enum-varnames:
          - ManagedAuthFieldReasonMissing
          - ManagedAuthFieldReasonRejected
        ref:
          description: Credential reference name to store the submitted value under.
          example: email
          type: string
        required:
          default: true
          description: Whether this field is required.
          type: boolean
        type:
          description: Managed-auth field type.
          enum:
          - identifier
          - password
          - code
          - totp_code
          - totp_secret
          - text
          example: identifier
          type: string
          x-enum-varnames:
          - ManagedAuthFieldTypeIdentifier
          - ManagedAuthFieldTypePassword
          - ManagedAuthFieldTypeCode
          - ManagedAuthFieldTypeTotpCode
          - ManagedAuthFieldTypeTotpSecret
          - ManagedAuthFieldTypeText
      required:
      - id
      - ref
      - type
      - reason
      type: object
    SignInOption:
      additionalProperties: false
      description: A non-MFA choice presented during the auth flow (e.g. account selection, org picker)
      properties:
        description:
          description: Additional context such as email address or org name
          example: user@company.com
          nullable: true
          type: string
        id:
          description: Unique identifier for this option (used to submit selection back)
          example: work-account
          type: string
        label:
          description: Display text for the option
          example: Work Account (user@company.com)
          type: string
      required:
      - id
      - label
      type: object
    ManagedAuthTimelineEvent:
      description: A single event in an auth connection's history — a login attempt, an automatic re-auth attempt, or a health check.
      properties:
        browser_session_id:
          description: Browser session that produced the event, if one was created.
          type: string
        completed_at:
          description: When the login/reauth attempt first reached a terminal status. Stable across retries and subsequent cleanup writes. Absent for in-progress attempts, health checks, and historical attempts without a recorded completion time.
          format: date-time
          type: string
        error_code:
          description: Machine-readable error code. Present when a login/reauth event failed.
          type: string
        error_message:
          description: Human-readable error message. Present when a login/reauth event failed.
          type: string
        id:
          description: Identifier of the underlying login/reauth session or health check.
          type: string
        previous_status:
          description: The session state observed before this event. Present for health_check events that recorded a prior state.
          enum:
          - AUTHENTICATED
          - NEEDS_AUTH
          type: string
        replay_id:
          description: Replay recording ID for the event's browser session, if session recording was enabled.
          type: string
        status:
          description: 'Outcome of the event. For login/reauth events this is the flow status

            (IN_PROGRESS, SUCCESS, EXPIRED, CANCELED, FAILED). For health_check events

            it is the observed session state (AUTHENTICATED, NEEDS_AUTH).

            '
          enum:
          - IN_PROGRESS
          - SUCCESS
          - EXPIRED
          - CANCELED
          - FAILED
          - AUTHENTICATED
          - NEEDS_AUTH
          type: string
        step:
          description: The step the flow reached. Present for login/reauth events.
          enum:
          - INITIALIZED
          - DISCOVERING
          - AWAITING_INPUT
          - AWAITING_EXTERNAL_ACTION
          - AWAITING_HUMAN_INTERVENTION
          - SUBMITTING
          - COMPLETED
          - EXPIRED
          type: string
        telemetry_captured:
          description: Whether browser telemetry capture started for this event's browser session.
          type: boolean
        timestamp:
          description: When the event occurred.
          format: date-time
          type: string
        type:
          description: The kind of event. "login" and "reauth" are authentication attempts; "health_check" is a periodic session-validity check.
          enum:
          - login
          - reauth
          - health_check
          type: string
        updated_at:
          description: When the event was last updated. Present for login/reauth events.
          format: date-time
          type: string
        website_error:
          description: Visible error message from the website (e.g., 'Incorrect password'). Present when the website displayed an error during the attempt.
          type: string
      required:
      - type
      - id
      - timestamp
      - status
      type: object
    ManagedAuthEvent:
      description: Union type representing any managed auth event.
      discriminator:
        mapping:
          error: '#/components/schemas/ErrorEvent'
          managed_auth_state: '#/components/schemas/ManagedAuthStateEvent'
          sse_heartbeat: '#/components/schemas/SSEHeartbeatEvent'
        propertyName: event
      oneOf:
      - $ref: '#/components/schemas/ManagedAuthStateEvent'
      - $ref: '#/components/schemas/ErrorEvent'
      - $ref: '#/components/schemas/SSEHeartbeatEvent'
    CredentialReference:
      additionalProperties: false
      description: 'Reference to credentials for the auth connection. Use one of:

        - { name } for Kernel credentials

        - { provider, path } for external provider item

        - { provider, auto: true } for external provider domain lookup

        '
      properties:
        auto:
          description: If true, lookup by domain from the specified provider
          example: true
          type: boolean
        name:
          description: Kernel credential name
          example: my-netflix-creds
          type: string
        path:
          description: Provider-specific path (e.g., "VaultName/ItemName" for 1Password)
          example: Personal/Netflix
          type: string
        provider:
          description: External provider name (e.g., "my-1p")
          example: my-1p
          type: string
      type: object
    BrowserTelemetryOTLPExportRequestConfig:
      description: OTLP export settings for a browser session.
      properties:
        destination:
          $ref: '#/components/schemas/OTLPDestinationRef'
          description: OTLP destination to export this session's captured telemetry to. Provide either id or name. Requires telemetry capture to be enabled.
        enabled:
          description: Whether to export captured telemetry over OTLP. Setting destination implies enabled=true, so this only needs to be set explicitly to disable export (enabled=false with a destination is rejected).
          type: boolean
      type: object
    MFAOption:
      additionalProperties: false
      description: An MFA method option for verification
      properties:
        description:
          description: Additional instructions from the site
          example: We'll send a 6-digit code to your phone
          nullable: true
          type: string
        label:
          description: The visible option text
          example: Text me a code
          type: string
        target:
          description: The masked destination (phone/email) if shown
          example: '***-***-5678'
          nullable: true
          type: string
        type:
          $ref: '#/components/schemas/MFAType'
      required:
      - type
      - label
      type: object
    ManagedAuthChoice:
      additionalProperties: false
      description: Canonical auth-flow choice awaiting user selection.
      properties:
        context:
          description: Context captured for a choice.
          nullable: true
          type: string
        description:
          description: Additional context for the choice.
          nullable: true
          type: string
        display_text:
          description: Display text captured for a choice.
          nullable: true
          type: string
        id:
          description: Stable choice identifier for canonical submit.
          example: google
          type: string
        label:
          description: Human-readable choice label.
          example: Google
          type: string
        masked_destination:
          description: Masked phone number or email address shown for an MFA choice.
          nullable: true
          type: string
        mfa_type:
          $ref: '#/components/schemas/ManagedAuthMFAMethod'
          description: Semantic MFA method. Choice id remains the stable identity of the exact option selected.
          nullable: true
        observed_selector:
          description: Selector for the visible choice, when available.
          example: button:has-text("Google")
          nullable: true
          type: string
        type:
          description: Choice type.
          enum:
          - mfa_method
          - sso_provider
          - sign_in_method
          - auth_method
          - identifier_method
          - account
          - other
          example: sso_provider
          type: string
          x-enum-varnames:
          - ManagedAuthChoiceTypeMfaMethod
          - ManagedAuthChoiceTypeSsoProvider
          - ManagedAuthChoiceTypeSignInMethod
          - ManagedAuthChoiceTypeAuthMethod
          - ManagedAuthChoiceTypeIdentifierMethod
          - ManagedAuthChoiceTypeAccount
          - ManagedAuthChoiceTypeOther
      required:
      - id
      - type
      - label
      type: object
    ManagedAuth:
      additionalProperties: false
      description: Managed authentication that keeps a profile logged into a specific domain. Flow fields (flow_status, flow_step, discovered_fields, mfa_options) reflect the most recent login flow and are null when no flow has been initiated.
      properties:
        allowed_domains:
          description: 'Additional hostname roots valid for this auth flow, besides the primary domain. Each value allows credential entry on that exact hostname and its subdomains. Leading `www.` and `*.` labels are normalized away. When omitted or empty, credential entry is unrestricted.


            The following SSO/OAuth provider domains are automatically allowed by default and do not need to be specified:

            - Google: accounts.google.com

            - Microsoft/Azure AD: login.microsoftonline.com, login.live.com

            - Okta: *.okta.com, *.oktapreview.com

            - Auth0: *.auth0.com, *.us.auth0.com, *.eu.auth0.com, *.au.auth0.com

            - Apple: appleid.apple.com

            - GitHub: github.com

            - Facebook/Meta: www.facebook.com

            - LinkedIn: www.linkedin.com

            - Amazon Cognito: *.amazoncognito.com

            - OneLogin: *.onelogin.com

            - Ping Identity: *.pingone.com, *.pingidentity.com

            '
          example:
          - login.netflix.com
          - auth.netflix.com
          items:
            type: string
          type: array
        auto_reauth:
          description: 'Whether automatic re-authentication is permitted for this connection. This is an opt-in

            flag only — it does not check whether re-auth is actually feasible. Even when true,

            re-auth only runs when the system has what it needs to perform it (for example, saved

            credentials for the required login fields), and only after a scheduled health check

            detects an expired session — so this flag has no effect when `health_checks` is false.

            When false, expired sessions detected by a health check are marked as `NEEDS_AUTH`

            instead of attempting re-auth.

            '
          example: true
          type: boolean
        browser:
          $ref: '#/components/schemas/ManagedAuthBrowserConfig'
          description: Default browser configuration for login, reauthentication, and health-check sessions.
        browser_session_id:
          description: 'ID of the underlying browser session driving the current flow (present when flow in progress).

            Use this to inspect or terminate the browser session via the `/browsers` API.

            '
          example: bs_abc123xyz
          nullable: true
          type: string
        browser_telemetry:
          $ref: '#/components/schemas/BrowserTelemetryRequestConfig'
          deprecated: true
          description: Deprecated. Use browser.telemetry. Retained during migration for existing clients.
          nullable: true
        can_reauth:
          description: Whether this connection's stored requirements are eligible for unattended re-authentication. A true value can represent either fully satisfiable requirements or a best-effort attempt. It does not account for whether automatic re-authentication is enabled or parent workflow state such as an active flow or circuit-breaker cooldown, so it does not guarantee an attempt on the next health check. See `can_reauth_reason` for the specific outcome.
          example: true
          type: boolean
        can_reauth_reason:
          description: "Machine-readable reason for the current value of `can_reauth`.\nAffirmative values (requirements are eligible for unattended re-authentication):\n  - `external_credential` — an external credential provider is attached\n  - `cua_has_credential` — CUA flow with a stored credential\n  - `has_credential` — Kernel credential is attached (optimistic; plan viability not checked)\n  - `viable_plans_found` — at least one stored login plan can be replayed\n  - `no_requirements_recorded` — no recorded credential requirements to fail against\n  - `totp_reauth_allowed` — TOTP is the only recorded requirement and a stored secret can generate the code\n  - `optimistic_totp_attempt` — TOTP was previously required but no reusable secret is stored; the connection remains eligible for a circuit-breaker-bounded attempt because the site may not challenge returning sessions\n  - `requirements_satisfiable` — recorded requirements contain no recognized blocker\n\nNegative values (a human must complete the login flow):\n  - `no_prior_successful_login` — connection has never completed a successful login\n  - `no_credential` — no Kernel or external credential attached\n  - `no_viable_plans` — credential attached but no replayable login plan exists yet\n  - `viable_plans_require_external_action` — stored plans need an external step (email link, push, etc.)\n  - `requires_external_action` — recorded requirements include an external step\n  - `requires_totp_without_secret` — flow needs a TOTP code but no TOTP secret is stored\n  - `requires_sms_code` — flow needs an SMS code that cannot be received automatically\n  - `requires_email_code` — flow needs an email code that cannot be received automatically\n  - `requires_customer_input` — flow needs another field or choice that is unavailable during unattended re-authentication"
          enum:
          - external_credential
          - cua_has_credential
          - has_credential
          - viable_plans_found
          - no_requirements_recorded
          - totp_reauth_allowed
          - optimistic_totp_attempt
          - requirements_satisfiable
          - no_prior_successful_login
          - no_credential
          - no_viable_plans
          - viable_plans_require_external_action
          - requires_external_action
          - requires_totp_without_secret
          - requires_sms_code
          - requires_email_code
          - requires_customer_input
          example: has_credential
          type: string
        choices:
          description: Canonical choices awaiting selection. Prefer this over pending_sso_buttons, mfa_options, and sign_in_options when present.
          items:
            $ref: '#/components/schemas/ManagedAuthChoice'
          nullable: true
          type: array
        credential:
          $ref: '#/components/schemas/CredentialReference'
        discovered_fields:
          description: Fields awaiting input (present when flow_step=awaiting_input; may also be present with awaiting_external_action as fallback actions)
          items:
            $ref: '#/components/schemas/DiscoveredField'
          nullable: true
          type: array
        domain:
          description: Target domain for authentication
          example: netflix.com
          type: string
        error_code:
          description: Machine-readable error code (present when flow_status=failed)
          nullable: true
          type: string
        error_message:
          description: Error message (present when flow_status=failed)
          example: Invalid password
          nullable: true
          type: string
        external_action_message:
          description: Instructions for external action (present when flow_step=awaiting_external_action)
          example: Tap 'Yes' on the Google prompt on your phone
          nullable: true
          type: string
        fields:
          description: Canonical fields awaiting input. Prefer this over discovered_fields when present.
          items:
            $ref: '#/components/schemas/ManagedAuthField'
          nullable: true
          type: array
        flow_expires_at:
          description: When the current flow expires (null when no flow in progress). A flow past this timestamp is no longer valid and its `flow_status` will be `EXPIRED`. Clients may start a new login to supersede a stale `IN_PROGRESS` flow past this timestamp.
          example: '2025-11-05T20:00:00Z'
          format: date-time
          nullable: true
          type: string
        flow_status:
          description: Current flow status (null when no flow in progress)
          enum:
          - IN_PROGRESS
          - SUCCESS
          - FAILED
          - EXPIRED
          - CANCELED
          example: IN_PROGRESS
          nullable: true
          type: string
        flow_step:
          description: Current step in the flow (null when no flow in progress)
          enum:
          - DISCOVERING
          - AWAITING_INPUT
          - AWAITING_EXTERNAL_ACTION
          - SUBMITTING
          - COMPLETED
          example: AWAITING_INPUT
          nullable: true
          type: string
        flow_type:
          description: Type of the current flow (null when no flow in progress)
          enum:
          - LOGIN
          - REAUTH
          example: LOGIN
          nullable: true
          type: string
        health_check_interval:
          description: 'Interval in seconds between automatic health checks. When set, the system periodically

            verifies the authentication status and triggers re-authentication if needed.

            Maximum is 86400 (24 hours). Default is 3600 (1 hour) or your plan minimum, whichever

            is larger. The minimum depends on your plan: Enterprise: 300 (5 minutes), Startup: 1200

            (20 minutes), Hobbyist: 3600 (1 hour), Free: 21600 (6 hours).

            '
          example: 3600
          maximum: 86400
          minimum: 300
          nullable: true
          type: integer
        health_check_unavailable_reason:
          description: Why health checks cannot verify this connection. Present when health checks are enabled but no auth check URL is available; a recent last_auth_check_at is not evidence of a valid session.
          enum:
          - no_auth_check_url
          type: string
        health_checks:
          description: 'Whether periodic health checks are enabled for this connection. When false, the system

            will not automatically verify authentication status, and `auto_reauth` has no effect on

            the automatic flow (since re-auth is only triggered by a failed scheduled health check).

            Manually triggering a health check via the API still works regardless of this setting.

            '
          example: true
          type: boolean
        hosted_url:
          description: URL to redirect user to for hosted login (present when flow in progress)
          example: https://auth.kernel.com/login/abc123xyz
          format: uri
          nullable: true
          type: string
        id:
          description: Unique identifier for the auth connection
          example: ma_abc123xyz
          type: string
        interaction_id:
          description: Opaque identifier for the current canonical interaction. Required when submitting fields or choices and changes for each new actionable pause.
          example: mai_abc123xyz
          nullable: true
          type: string
        last_auth_at:
          deprecated: true
          description: Deprecated alias for `last_auth_check_at`. Despite the name, this is the last health-check timestamp, not the last successful authentication. Use `last_auth_check_at` instead.
          example: '2025-01-15T10:30:00Z'
          format: date-time
          type: string
        last_auth_check_at:
          description: When the most recent auth health check ran for this connection, regardless of outcome. Updated on every health check and does not by itself indicate that the profile is currently authenticated - use `status` for that. May be newer than `flow_expires_at` when a flow is still in progress because health checks continue to run in parallel.
          example: '2025-01-15T10:30:00Z'
          format: date-time
          type: string
        live_view_url:
          description: Browser live view URL for debugging (present when flow in progress)
          example: https://live.kernel.com/abc123xyz
          format: uri
          nullable: true
          type: string
        login_url:
          description: Optional login page URL to skip discovery
          example: https://example.com/login
          format: uri
          type: string
        mfa_options:
          description: MFA method options (present when flow_step=awaiting_input; may also be present with awaiting_external_action as fallback actions)
          items:
            $ref: '#/components/schemas/MFAOption'
          nullable: true
          type: array
        pending_sso_buttons:
          description: SSO buttons available (present when flow_step=awaiting_input; may also be present with awaiting_external_action as fallback actions)
          items:
            $ref: '#/components/schemas/SSOButton'
          nullable: true
          type: array
        post_login_url:
          description: URL where the browser landed after successful login
          example: https://www.netflix.com/browse
          format: uri
          type: string
        profile_name:
          description: Name of the profile associated with this auth connection
          example: my-netflix-profile
          type: string
        proxy_id:
          deprecated: true
          description: Deprecated. Read browser.proxy instead. Retained during migration for existing clients.
          type: string
        record_session:
          description: Whether to record browser session replays for this connection by default. Useful for debugging login flows. Can be overridden per-login.
          example: false
          type: boolean
        save_credentials:
          description: Whether credentials are saved after every successful login. One-time codes (TOTP, SMS, etc.) are not saved.
          example: true
          type: boolean
        sign_in_options:
          description: Non-MFA choices presented during the auth flow, such as account selection or org pickers (present when flow_step=awaiting_input; may also be present with awaiting_external_action as fallback actions).
          items:
            $ref: '#/components/schemas/SignInOption'
          nullable: true
          type: array
        sso_provider:
          description: SSO provider being used (e.g., google, github, microsoft)
          example: google
          nullable: true
          type: string
        status:
          description: Last known authentication status of the managed profile. An inconclusive health check preserves this status and does not verify the current session.
          enum:
          - AUTHENTICATED
          - NEEDS_AUTH
          example: AUTHENTICATED
          type: string
        website_error:
          description: Visible error message from the website (e.g., 'Incorrect password'). Present when the website displays an error during login.
          nullable: true
          type: string
      required:
      - id
      - profile_name
      - domain
      - status
      - save_credentials
      - record_session
      type: object
    ManagedAuthStateEvent:
      description: An event representing the current state of a managed auth flow.
      properties:
        choices:
          description: Canonical choices awaiting selection. Prefer this over pending_sso_buttons, mfa_options, and sign_in_options when present.
          items:
            $ref: '#/components/schemas/ManagedAuthChoice'
          type: array
        discovered_fields:
