            - Amazon Cognito: *.amazoncognito.com

            - OneLogin: *.onelogin.com

            - Ping Identity: *.pingone.com, *.pingidentity.com

            '
          example:
          - login.netflix.com
          - auth.netflix.com
          items:
            type: string
          type: array
        auto_reauth:
          default: true
          description: 'Whether to permit automatic re-authentication when a scheduled health check detects an

            expired session. This is an opt-in flag only — it does not check whether re-auth is

            actually feasible. Even when true, re-auth only runs when the system has what it needs

            to perform it (for example, saved credentials for the required login fields), and only

            after a scheduled health check detects an expired session — so this flag has no effect

            when `health_checks` is false. When false, expired sessions are marked as `NEEDS_AUTH`

            instead of attempting re-auth. Defaults to true.

            '
          example: true
          type: boolean
        browser:
          $ref: '#/components/schemas/ManagedAuthBrowserConfig'
          description: Default browser configuration for login, reauthentication, and health-check sessions.
        browser_telemetry:
          $ref: '#/components/schemas/BrowserTelemetryRequestConfig'
          deprecated: true
          description: Deprecated. Use browser.telemetry. Retained during migration for existing clients.
          nullable: true
        credential:
          $ref: '#/components/schemas/CredentialReference'
        domain:
          description: Domain for authentication
          example: netflix.com
          type: string
        health_check_interval:
          description: 'Interval in seconds between automatic health checks. When set, the system periodically

            verifies the authentication status and triggers re-authentication if needed.

            Maximum is 86400 (24 hours). Default is 3600 (1 hour) or your plan minimum, whichever

            is larger. The minimum depends on your plan: Enterprise: 300 (5 minutes), Startup: 1200

            (20 minutes), Hobbyist: 3600 (1 hour), Free: 21600 (6 hours).

            '
          example: 3600
          maximum: 86400
          minimum: 300
          type: integer
        health_checks:
          default: true
          description: 'Whether to enable periodic health checks. When false, the system will not automatically

            verify authentication status, and `auto_reauth` has no effect on the automatic flow

            (since re-auth is only triggered by a failed scheduled health check). Defaults to true.

            '
          example: true
          type: boolean
        login_url:
          description: Optional login page URL to skip discovery
          example: https://netflix.com/login
          format: uri
          type: string
        profile_name:
          description: Name of the profile to manage authentication for. If the profile does not exist, it is created automatically.
          example: user-123
          type: string
        proxy:
          $ref: '#/components/schemas/ProxyRef'
          deprecated: true
          description: Deprecated. Use browser.proxy. Retained during migration for existing clients.
        record_session:
          default: false
          description: Whether to record browser sessions for this connection by default. Useful for debugging. Can be overridden per-login. Defaults to false.
          example: false
          type: boolean
        save_credentials:
          default: true
          description: Whether to save credentials after every successful login. Defaults to true. One-time codes (TOTP, SMS, etc.) are not saved.
          example: true
          type: boolean
      required:
      - domain
      - profile_name
      type: object
    ManagedAuthMFAMethod:
      description: Canonical MFA method, independent of a site's stable choice identifier.
      enum:
      - sms
      - call
      - email
      - totp
      - push
      - password
      - passkey
      - switch
      - other
      example: sms
      type: string
    OTLPDestinationRef:
      description: 'OTLP destination selection. Provide either id or name. The destination

        must be customer-visible in the authenticated organization. A

        project-scoped credential can select any such destination for workloads

        in its project.

        '
      oneOf:
      - required:
        - id
      - required:
        - name
      properties:
        id:
          description: OTLP destination ID
          type: string
        name:
          description: OTLP destination name
          type: string
      type: object
    ErrorEvent:
      description: An error event from the application.
      properties:
        error:
          $ref: '#/components/schemas/Error'
        event:
          const: error
          description: Event type identifier (always "error").
          type: string
        timestamp:
          description: Time the error occurred.
          format: date-time
          type: string
      required:
      - event
      - timestamp
      - error
      type: object
    BrowserTelemetryCdpControlConfig:
      description: Settings for the cdp_command events the CDP proxy reports.
      properties:
        excluded_methods:
          description: 'Methods to leave out of the cdp_command stream. Omit the list to keep the current one; send an empty list to report every supported method again. Exclusion is a telemetry setting only: an excluded command is still relayed to the browser unchanged, it simply produces no event. Use it to drop the highest-volume methods — Input.dispatchMouseEvent during a humanized cursor path, or Page.captureScreenshot under a screencast — without turning the whole category off. Excluded commands are counted in cdp_disconnect.telemetry_excluded.'
          items:
            $ref: '#/components/schemas/BrowserCdpCommandMethod'
          type: array
      type: object
    BrowserProxyMode:
      description: 'Proxy egress mode. direct forces no proxy regardless of stealth. default uses the browser''s stealth-derived default: Kernel''s default stealth proxy when stealth=true, or direct egress when stealth=false.

        default is primarily useful on browser update to restore the browser default after selected-proxy egress.

        '
      enum:
      - direct
      - default
      type: string
      x-enum-varnames:
      - Direct
      - Default
    LoginResponse:
      additionalProperties: false
      description: Response from starting a login flow
      properties:
        flow_expires_at:
          description: When the login flow expires
          example: '2025-11-05T20:00:00Z'
          format: date-time
          type: string
        flow_type:
          description: Type of login flow started
          enum:
          - LOGIN
          - REAUTH
          example: LOGIN
          type: string
        handoff_code:
          description: One-time code for handoff (internal use)
          example: aBcD123EfGh456IjKl789MnOp012QrStUvWxYzAbCdEf
          type: string
        hosted_url:
          description: URL to redirect user to for login
          example: https://auth.kernel.com/login/abc123xyz
          format: uri
          type: string
        id:
          description: Auth connection ID
          example: ma_abc123xyz
          type: string
        live_view_url:
          description: Browser live view URL for watching the login flow
          example: https://live.onkernel.com/abc123xyz
          format: uri
          type: string
      required:
      - id
      - flow_type
      - hosted_url
      - flow_expires_at
      type: object
    BrowserTelemetryRequestConfig:
      description: Telemetry request configuration for a browser session.
      properties:
        browser:
          $ref: '#/components/schemas/BrowserTelemetryCategoriesConfig'
          description: Per-category capture flags. The operational categories (control, connection, system, captcha) are captured whenever telemetry is enabled; set one to enabled=false to opt out. The CDP categories (console, network, page, interaction), screenshot and platform are off by default; set enabled=true to opt in. On create, provided categories layer onto the default set. On update, provided categories merge onto the session's current config; when no telemetry is active this falls back to the default set (matching create). If browser is omitted or empty, the default set is used. A browser config that disables every category stops capture on update and starts no capture on create.
        enabled:
          description: Request shortcut for browser telemetry capture. True enables capture; with no browser category settings it captures the default set (control, connection, system, captcha), and any browser category settings are layered onto that default set. On update, enabled=true resolves the config fresh from the default set plus any provided categories, replacing the session's current selection rather than merging onto it; omit enabled to merge categories onto the current selection instead. False stops capture on update and starts no capture on create. enabled=false cannot be combined with browser category settings.
          type: boolean
        export:
          $ref: '#/components/schemas/BrowserTelemetryExportRequestConfig'
          description: Where to export this session's captured telemetry. Omit to capture without exporting.
        storage:
          $ref: '#/components/schemas/BrowserTelemetryStorageRequestConfig'
          description: Whether to persist this session's captured telemetry to Kernel storage.
      type: object
    BrowserTelemetryCategoriesConfig:
      description: 'Per-category telemetry capture settings layered onto the default set. The operational signals (control, connection, system, captcha) are on by default and are opt-out: set one to enabled=false to stop capturing it. The CDP categories (console, network, page, interaction), screenshot and platform are off by default and are opt-in: set enabled=true to capture them.'
      properties:
        captcha:
          $ref: '#/components/schemas/BrowserTelemetryCategoryConfig'
          description: Captcha solver tasks and visible challenge outcomes. On by default.
        connection:
          $ref: '#/components/schemas/BrowserTelemetryCategoryConfig'
          description: Client attach/detach lifecycle for the CDP proxy and live view. On by default.
        console:
          $ref: '#/components/schemas/BrowserTelemetryCategoryConfig'
          description: Console output (log, warn, error) and uncaught exceptions. CDP category; off by default.
        control:
          $ref: '#/components/schemas/BrowserTelemetryControlConfig'
          description: Agent-driven actions against the browser — computer-control calls, Playwright code execution, screenshots, clipboard access, and browser-control commands sent over the CDP proxy. On by default.
        interaction:
          $ref: '#/components/schemas/BrowserTelemetryCategoryConfig'
          description: User interaction events including clicks, keydowns, and scroll-settled events. CDP category; off by default.
        network:
          $ref: '#/components/schemas/BrowserTelemetryCategoryConfig'
          description: HTTP request and response metadata including URL, method, status code, and timing. Request post data is forwarded as-is from CDP. Text response bodies are truncated at 8 KB for structured types (JSON, XML, form data) and 4 KB for other text types. Binary responses (images, fonts, media) are excluded. CDP category; off by default.
        page:
          $ref: '#/components/schemas/BrowserTelemetryCategoryConfig'
          description: Page lifecycle events including navigation, DOMContentLoaded, load, layout shifts, and LCP. CDP category; off by default.
        platform:
          $ref: '#/components/schemas/BrowserTelemetryCategoryConfig'
          description: In-VM API calls that manage the browser VM rather than drive the browser (recording, filesystem, process, telemetry and browser configuration). Mostly platform-induced; off by default and must be opted into.
        screenshot:
          $ref: '#/components/schemas/BrowserTelemetryCategoryConfig'
          description: Periodic base64-encoded viewport screenshots. High volume; off by default and must be opted into.
        system:
          $ref: '#/components/schemas/BrowserTelemetryCategoryConfig'
          description: Browser VM health, such as out-of-memory kills and managed-service crashes. On by default.
      type: object
    ProxyRef:
      description: 'Proxy selection. Provide either id or name. The proxy must be in the same project as the resource referencing it.

        When selecting by name, the name must match exactly one active proxy in the project. Ambiguous names return a 400; use id for stable references.

        '
      oneOf:
      - required:
        - id
      - required:
        - name
      properties:
        id:
          description: Proxy ID
          type: string
        name:
          description: Proxy name
          type: string
      type: object
    SSOButton:
      additionalProperties: false
      description: An SSO button for signing in with an external identity provider
      properties:
        label:
          description: Visible button text
          example: Continue with Google
          type: string
        provider:
          description: Identity provider name
          example: google
          type: string
        selector:
          description: XPath selector for the button
          example: xpath=//button[contains(text(), 'Continue with Google')]
          type: string
      required:
      - selector
      - provider
      - label
      type: object
  responses:
    BadRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Bad Request – invalid input
    Forbidden:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Forbidden – insufficient permissions or plan
    Unauthorized:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Unauthorized – missing or invalid authorization token
    Gone:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Resource expired or no longer available
    InternalError:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Internal Server Error
    NotFound:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Resource not found
  securitySchemes:
    bearerAuth:
      scheme: bearer
      type: http
x-service-info:
  categories:
  - browsers
  docs:
    apiReference: https://www.kernel.sh/docs
    homepage: https://www.kernel.sh
    llms: https://api.onkernel.com/llms.txt
