          example: true
          type: boolean
        selector:
          description: CSS selector for the field
          example: input#email
          type: string
        type:
          description: Field type
          enum:
          - text
          - email
          - password
          - tel
          - number
          - url
          - code
          - totp
          example: email
          type: string
      required:
      - name
      - type
      - label
      - selector
      type: object
