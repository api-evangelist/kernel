          description: 'Video memory (VRAM) for a GPU browser session. Requires gpu=true. Defaults to 2GiB, which comes with 4 vCPU and 6GiB memory. 4GiB comes with 8 vCPU and 12GiB memory.

            '
        viewport:
          $ref: '#/components/schemas/BrowserViewport'
      required: []
      type: object
    BrowserProxyRoute:
