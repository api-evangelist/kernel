        proxy:
          $ref: '#/components/schemas/BrowserProxyConfig'
          description: 'Proxy configuration to apply. Omit to leave the current configuration unchanged. Cannot be combined with proxy_id or disable_default_proxy.

            Set mode to direct to switch to direct egress regardless of stealth. Set mode to default to restore the browser default after using a selected proxy: Kernel''s default stealth proxy for a stealth browser, or direct egress for a non-stealth browser.

            Updating proxy does not change stealth or CAPTCHA solver behavior.

            '
        proxy_id:
          deprecated: true
          description: ID of the proxy to use. Omit to leave unchanged, set to empty string to remove proxy. Deprecated in favor of proxy.
          nullable: true
          type: string
          x-deprecated-reason: Use proxy instead.
        start_url:
          description: 'Optional URL to navigate the browser to after applying this update. When a profile is loaded in the same update, this overrides the profile''s restored tabs. Navigation is best-effort, so failures do not fail the update. Omit or set to an empty string to leave the current page unchanged.

            '
          example: https://example.com
          maxLength: 2048
          type: string
        tags:
          $ref: '#/components/schemas/Tags'
          description: 'User-defined key-value tags for the browser session. Omit to leave unchanged. Provide a map to replace the entire tag set (full replace, not a merge). Set to an empty object ({}) to clear all tags. Up to 50 pairs.

            '
          nullable: true
        telemetry:
          $ref: '#/components/schemas/BrowserTelemetryRequestConfig'
          description: 'Telemetry configuration. Omit, set to null, or set to an empty object ({}) to leave the existing configuration unchanged. Set enabled to true to enable capture using VM defaults. Set enabled to false to stop capture. Provide browser category settings for per-category updates. Explicitly disabling all four categories also stops capture.

            '
          nullable: true
        viewport:
          $ref: '#/components/schemas/BrowserViewportUpdate'
          description: Viewport configuration to apply to the browser session.
      type: object
    BrowserCurlTransportError:
