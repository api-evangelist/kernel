openapi: 3.2.0
info:
  description: Developer tools and cloud infrastructure for AI agents to use web browsers
  title: Kernel Browsers API
  version: 0.1.0
servers:
- description: API Server
  url: https://api.onkernel.com
security:
- bearerAuth: []
tags:
- description: Create and manage browser sessions.
  name: Browsers
paths:
  /browsers:
    get:
      description: List all browser sessions with pagination support. Use status parameter to filter by session state.
      operationId: getBrowsers
      parameters:
      - description: Filter sessions by status. "active" returns only active sessions (default), "deleted" returns only soft-deleted sessions, "all" returns both.
        in: query
        name: status
        required: false
        schema:
          default: active
          enum:
          - active
          - deleted
          - all
          type: string
          x-enum-varnames:
          - GetBrowsersParamsStatusActive
          - GetBrowsersParamsStatusDeleted
          - GetBrowsersParamsStatusAll
      - deprecated: true
        description: 'Deprecated: Use status=all instead. When true, includes soft-deleted browser sessions in the results alongside active sessions.'
        in: query
        name: include_deleted
        required: false
        schema:
          default: false
          type: boolean
      - description: Maximum number of results to return. Defaults to 20, maximum 100.
        in: query
        name: limit
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          type: integer
      - description: Number of results to skip. Defaults to 0.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: Search browsers by name, session ID, profile name or ID, proxy ID, or pool name.
        in: query
        name: query
        required: false
        schema:
          type: string
      - description: 'Filter sessions by tag key-value pairs using deepObject style, e.g. ?tags[team]=backend&tags[env]=staging. Multiple pairs are ANDed: a session must match every supplied pair exactly.

          '
        explode: true
        in: query
        name: tags
        required: false
        schema:
          additionalProperties:
            type: string
          type: object
        style: deepObject
      - description: Filter sessions by geographic region. Omit to list sessions in all regions.
        in: query
        name: region
        required: false
        schema:
          $ref: '#/components/schemas/Region'
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Browser'
                type: array
          description: List of browsers
          headers:
            X-Has-More:
              description: Whether more results are available
              schema:
                type: boolean
            X-Limit:
              description: The limit used for pagination
              schema:
                type: integer
            X-Next-Offset:
              description: The offset where the next page starts. 0 when there are no more results.
              schema:
                type: integer
            X-Offset:
              description: The offset used for pagination
              schema:
                type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - bearerAuth: []
      summary: List browser sessions
      tags:
      - Browsers
    post:
      description: Create a new browser session from within an action.
      operationId: postBrowsers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrowserRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Browser'
          description: Successful response
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '529':
          $ref: '#/components/responses/CapacityExhausted'
      security:
      - bearerAuth: []
      summary: Create a browser session
      tags:
      - Browsers
  /browsers/{id_or_name}:
    delete:
      operationId: deleteBrowsersByIdOrName
      parameters:
      - description: Browser session ID or name
        example: htzv5orfit78e1m2biiifpbv
        in: path
        name: id_or_name
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Browser session deleted successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - bearerAuth: []
      summary: Delete a browser session by ID or name
      tags:
      - Browsers
    get:
      description: Get information about a browser session.
      operationId: getBrowsersByIdOrName
      parameters:
      - description: Browser session ID or name
        example: htzv5orfit78e1m2biiifpbv
        in: path
        name: id_or_name
        required: true
        schema:
          type: string
      - description: When true, includes soft-deleted browser sessions in the lookup.
        in: query
        name: include_deleted
        required: false
        schema:
          default: false
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Browser'
          description: Browser session retrieved successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - bearerAuth: []
      summary: Get browser session details
      tags:
      - Browsers
    patch:
      description: Update a browser session.
      operationId: patchBrowsersByIdOrName
      parameters:
      - description: Browser session ID or name
        example: htzv5orfit78e1m2biiifpbv
        in: path
        name: id_or_name
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrowserUpdateRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Browser'
          description: Browser session updated successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - bearerAuth: []
      summary: Update browser session
      tags:
      - Browsers
  /browsers/{id_or_name}/curl:
    post:
      description: 'Sends an HTTP request through Chrome''s HTTP request stack, inheriting

        the browser''s TLS fingerprint, cookies, proxy configuration, and headers.

        Returns a structured JSON response with status, headers, body, and timing.'
      operationId: browserCurl
      parameters:
      - description: Browser session ID or name
        example: htzv5orfit78e1m2biiifpbv
        in: path
        name: id_or_name
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrowserCurlRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserCurlResult'
          description: Response from target URL
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserCurlTransportError'
          description: Upstream transport failure
        default:
          $ref: '#/components/responses/BrowserProxyError'
      security:
      - bearerAuth: []
      summary: Make an HTTP request through the browser's network stack
      tags:
      - Browsers
  /browsers/{id_or_name}/extensions:
    post:
      description: Loads one or more unpacked extensions using live CDP activation when eligible. Chromium restarts when enterprise policy requires it or live activation fails.
      operationId: uploadExtensionsToBrowser
      parameters:
      - description: Browser session ID or name
        example: htzv5orfit78e1m2biiifpbv
        in: path
        name: id_or_name
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                extensions:
                  description: List of extensions to upload and activate
                  items:
                    properties:
                      name:
                        description: Folder name to place the extension under /home/kernel/extensions/<name>
                        maxLength: 255
                        minLength: 1
                        pattern: ^[a-zA-Z0-9._-]{1,255}$
                        type: string
                      zip_file:
                        description: Zip archive containing an unpacked Chromium extension (must include manifest.json)
                        format: binary
                        type: string
                    required:
                    - zip_file
                    - name
                    type: object
                  type: array
              required:
              - extensions
              type: object
        required: true
      responses:
        '201':
          description: Extensions uploaded, Chromium restarted, and DevTools is ready
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        default:
          $ref: '#/components/responses/BrowserProxyError'
      security:
      - bearerAuth: []
      summary: Ad-hoc upload one or more unpacked extensions to a running browser instance
      tags:
      - Browsers
  /mpp/browsers:
    post:
      description: 'Buys a stealth headful browser for the duration in the offer with a Machine Payments Protocol (MPP) payment, without a Kernel account. A request without an `Authorization: Payment` credential gets a 402 challenge; the paid retry returns the browser and a `Payment-Receipt` header. A challenge can be paid until its `expires` time, 30 minutes after it is issued by default. A challenge buys one browser. Resending the same paid credential is intentional and safe: it returns the same browser without charging again until the session expires, even after the challenge has expired, so an agent can retry after a timeout. After the session expires it gets a 402 with a fresh challenge and `code: session_expired`. A different payment for a challenge that was already charged is rejected with a 402 before any charge.'
      operationId: postMppBrowsers
      requestBody:
        content:
          application/json:
            schema:
              properties:
                email:
                  description: Optional address for the Stripe receipt. When omitted, the billing email shared with the payment token is used, if any. A malformed address is rejected with a 400 before any challenge or charge.
                  format: email
                  type: string
              type: object
        required: false
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  access:
                    properties:
                      type:
                        enum:
                        - session_urls
                        type: string
                    required:
                    - type
                    type: object
                  browser_live_view_url:
                    type: string
                  cdp_ws_url:
                    type: string
                  created_at:
                    format: date-time
                    type: string
                  duration_minutes:
                    type: integer
                  expires_at:
                    format: date-time
                    type: string
                  headless:
                    type: boolean
                  payment:
                    properties:
                      amount:
                        description: Amount in cents
                        type: integer
                      currency:
                        type: string
                      reference:
                        description: Stripe PaymentIntent ID
                        type: string
                    required:
                    - reference
                    - amount
                    - currency
                    type: object
                  session_id:
                    type: string
                  stealth:
                    type: boolean
                  webdriver_ws_url:
                    type: string
                required:
                - session_id
                - cdp_ws_url
                - webdriver_ws_url
                - headless
                - stealth
                - duration_minutes
                - created_at
                - expires_at
                - payment
                - access
                type: object
          description: The purchased browser session.
          headers:
            Payment-Receipt:
              description: Base64url-encoded MPP receipt.
              schema:
                type: string
        '400':
          content:
            application/problem+json:
              schema:
                type: object
          description: The request body is not a JSON object, or `email` is malformed.
        '402':
          content:
            application/problem+json:
              schema:
                properties:
                  challengeId:
                    type: string
                  code:
                    enum:
                    - session_expired
                    type: string
                  detail:
                    type: string
                  expires_at:
                    format: date-time
                    type: string
                  status:
                    type: integer
                  title:
                    type: string
                  type:
                    type: string
                type: object
          description: 'Payment required. The `WWW-Authenticate` header carries a fresh Payment challenge; the body is RFC 9457 problem details. When the session this credential bought has expired, the problem type is `invalid-challenge` with `code: session_expired` and `expires_at`.'
          headers:
            WWW-Authenticate:
              description: MPP Payment challenge.
              schema:
                type: string
        '429':
          description: Too many requests from this client.
        '503':
          content:
            application/problem+json:
              schema:
                type: object
          description: Paid browsers are unavailable, at capacity, or the browser could not be created (payment refunded).
      security: []
      summary: Buy a browser session with a machine payment
      tags:
      - Browsers
      x-cli-skip: true
      x-hidden: true
      x-payment-info:
        offers:
        - amount: '50'
          currency: usd
          description: Kernel stealth headful browser, 30 minutes
          intent: charge
          method: stripe
      x-stainless-skip: true
components:
  schemas:
    BrowserTelemetryCategoryConfig:
      description: Per-category telemetry configuration.
      properties:
        enabled:
          description: Whether this category is captured. Operational categories (control, connection, system, captcha) default to true; set false to opt out. CDP categories (console, network, page, interaction), screenshot and platform default to false; set true to opt in.
          type: boolean
      type: object
    Profile:
      description: Browser profile metadata.
      properties:
        created_at:
          description: Timestamp when the profile was created
          format: date-time
          type: string
        id:
          description: Unique identifier for the profile
          type: string
        last_used_at:
          description: Timestamp when the profile was last used
          format: date-time
          type: string
        name:
          description: Optional, easier-to-reference name for the profile
          nullable: true
          type: string
        updated_at:
          description: Timestamp when the profile was last updated
          format: date-time
          type: string
      required:
      - id
      - created_at
      type: object
    Region:
      description: 'Geographic region for hosting browser sessions or pools.

        '
      enum:
      - us-east
      - us-west
      - eu-west
      - ap-southeast
      type: string
    BrowserVideoMemory:
      description: 'Video memory (VRAM) of a GPU browser session. 2GiB sessions have 4 vCPU and 6GiB memory. 4GiB sessions have 8 vCPU and 12GiB memory.

        '
      enum:
      - 2GiB
      - 4GiB
      example: 2GiB
      type: string
      x-enum-varnames:
      - BrowserVideoMemoryN2GiB
      - BrowserVideoMemoryN4GiB
    BrowserProxyConfig:
      additionalProperties: false
      description: 'Browser proxy configuration. Provide exactly one of mode, id, or name; an empty object is invalid.

        Set mode to direct for no proxy regardless of stealth. Set mode to default to use the browser''s stealth-derived default: Kernel''s default stealth proxy when stealth=true, or direct egress when stealth=false.

        Select id or name to use that proxy regardless of stealth. The selected proxy must be in the same project as the browser. Names must match exactly one active proxy; use id for stable references.

        Proxy configuration changes only egress and does not change stealth or CAPTCHA solver behavior. A stealth browser using mode=direct still runs in stealth mode with the CAPTCHA solver enabled.

        When proxy is omitted on browser creation, stealth browsers use Kernel''s default stealth proxy and non-stealth browsers use direct egress. When omitted on update, the current configuration is unchanged.

        '
      oneOf:
      - required:
        - mode
      - required:
        - id
      - required:
        - name
      properties:
        id:
          description: Proxy ID.
          minLength: 1
          type: string
        mode:
          $ref: '#/components/schemas/BrowserProxyMode'
        name:
          description: Proxy name. Must match exactly one active proxy in the project.
          minLength: 1
          type: string
      type: object
    BrowserCdpCommandMethod:
      description: 'A browser-control CDP method the proxy reports. The set covers the commands an agent drives the browser with; configuration, DOM and Runtime bookkeeping, and Chrome-specific UI commands are outside it. Canonical definitions: devtools-protocol@2d019e73.

        '
      enum:
      - Input.dispatchMouseEvent
      - Input.dispatchKeyEvent
      - Input.insertText
      - Input.imeSetComposition
      - Input.dispatchTouchEvent
      - Input.dispatchDragEvent
      - Input.cancelDragging
      - Input.emulateTouchFromMouseEvent
      - Input.synthesizePinchGesture
      - Input.synthesizeScrollGesture
      - Input.synthesizeTapGesture
      - DOM.setFileInputFiles
      - DOM.focus
      - DOM.scrollIntoViewIfNeeded
      - Page.bringToFront
      - Page.captureScreenshot
      - Page.captureSnapshot
      - Page.handleJavaScriptDialog
      - Page.navigate
      - Page.navigateToHistoryEntry
      - Page.reload
      - Page.printToPDF
      - Page.startScreencast
      - Page.stopScreencast
      - Page.stopLoading
      - Page.close
      - Page.setWebLifecycleState
      - Target.activateTarget
      - Target.closeTarget
      - Target.createTarget
      - Target.createBrowserContext
      - Target.disposeBrowserContext
      - Target.openDevTools
      - Browser.cancelDownload
      - Browser.close
      - Browser.setWindowBounds
      - Browser.setContentsSize
      - Autofill.trigger
      type: string
    BrowserTelemetryControlConfig:
      description: Configuration for the control category. Same enabled semantics as any other category, plus settings for the browser-control commands the CDP proxy reports.
      properties:
        cdp:
          $ref: '#/components/schemas/BrowserTelemetryCdpControlConfig'
          description: Settings for the cdp_command events the CDP proxy reports. Merged independently of enabled, so a later update that only sets enabled keeps the current exclusion list.
        enabled:
          description: Whether this category is captured. Control is on by default; set false to opt out.
          type: boolean
      type: object
    BrowserAllowlistState:
      properties:
        base_revision:
          description: Revision against which that mutation was accepted; reuse it when retrying the mutation.
          type: string
        mutation_id:
          description: ID of the last conditional allowlist update saved on this browser.
          type: string
        revision:
          description: Opaque revision to pass as network.expected_allowlist_revision on an update.
          type: string
      required:
      - revision
      type: object
    Error:
      properties:
        code:
          description: Application-specific error code (machine-readable)
          example: bad_request
          type: string
        details:
          description: Additional error details (for multiple errors)
          items:
            $ref: '#/components/schemas/ErrorDetail'
          type: array
        inner_error:
          $ref: '#/components/schemas/ErrorDetail'
        message:
          description: Human-readable error description for debugging
          example: 'Missing required field: app_name'
          type: string
      required:
      - code
      - message
      type: object
    BrowserCurlRequest:
      additionalProperties: false
      description: Request to make an HTTP request through the browser's network stack.
      properties:
        body:
          description: Request body (for POST/PUT/PATCH).
          type: string
        headers:
          additionalProperties:
            type: string
          description: Custom headers merged with browser defaults.
          type: object
        method:
          default: GET
          description: HTTP method.
          enum:
          - GET
          - HEAD
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
          type: string
        response_encoding:
          default: utf8
          description: Encoding for the response body. Use base64 for binary content.
          enum:
          - utf8
          - base64
          type: string
        timeout_ms:
          default: 30000
          description: Request timeout in milliseconds.
          maximum: 60000
          minimum: 1000
          type: integer
        url:
          description: Target URL (must be http or https).
          type: string
      required:
      - url
      type: object
    BrowserProfile:
      description: 'Profile selection for the browser session. Provide either id or name. If specified, the

        matching profile will be loaded into the browser session. Profiles must be created beforehand.

        '
      oneOf:
      - required:
        - id
      - required:
        - name
      properties:
        id:
          description: Profile ID to load for this browser session
          type: string
        name:
          description: Profile name to load for this browser session (instead of id). Must be 1-255 characters, using letters, numbers, dots, underscores, or hyphens.
          maxLength: 255
          minLength: 1
          pattern: ^[a-zA-Z0-9._-]{1,255}$
          type: string
        save_changes:
          default: false
          description: If true, save changes made during the session back to the profile when the session ends.
          type: boolean
      type: object
    BrowserMemory:
      description: Memory allocated to the browser session.
      enum:
      - 1GiB
      - 2GiB
      - 4GiB
      - 6GiB
      - 8GiB
      - 12GiB
      - 16GiB
      example: 8GiB
      type: string
    BrowserNetworkUpdate:
      additionalProperties: false
      description: Network configuration changes for a running browser session. Other network settings can only be set at creation.
      properties:
        allowed_hosts:
          description: 'Replaces the session''s egress allowlist, using the same entry rules as network.allowed_hosts on create. Only an allowlist the browser was created with can be changed: a browser created without one can''t be given one, and an allowlist removed with null can''t be added back. Omit to leave the allowlist unchanged, or set to null to remove it and return to unfiltered egress; an empty list is invalid. The new list applies without restarting the browser: new requests to destinations it no longer allows are refused within a few seconds, and open connections to them are closed within about 30 seconds, or up to 10 minutes during a Kernel deploy. Connections to destinations it still allows, such as WebSockets, stay open. A start_url in the same request must be allowed by the updated list, and is loaded only after the list takes effect. Requires a browser created with proxy v3. Supported on leased pooled browsers; the pool''s allowlist is restored before reuse, or the browser is destroyed if it cannot be safely restored. If the request fails, retry it: the new list may already apply to some requests.

            '
          example:
          - example.com
          - '*.example.com'
          items:
            maxLength: 253
            type: string
          maxItems: 100
          minItems: 1
          nullable: true
          type: array
          x-go-type: AllowedHostsUpdate
          x-go-type-skip-optional-pointer: true
          x-omitzero: true
        expected_allowlist_revision:
          description: 'The network.allowlist_state.revision from the browser''s last saved snapshot. Supply together with mutation_id to opt into conditional allowlist updates. The revision is checked atomically with the configuration write. A stale request returns 409 stale_network without changing the allowlist. A GET alone does not fence an earlier unfinished PATCH.

            '
          maxLength: 64
          minLength: 64
          type: string
        mutation_id:
          description: 'A unique ID for this allowlist update, supplied together with expected_allowlist_revision. Reuse both values and the identical allowed_hosts payload when retrying an uncertain update. If it is still the current mutation, the retry finishes proxy and VM application without creating another revision. A superseded mutation returns 409 stale_network. These fields guard only network.allowed_hosts, not other browser update fields.

            '
          maxLength: 64
          minLength: 1
          pattern: ^[A-Za-z0-9_-]+$
          type: string
      type: object
    InstanceProxyError:
      properties:
        code:
          $ref: '#/components/schemas/InstanceProxyErrorCode'
        message:
          description: Human-readable error description for debugging
          type: string
      required:
      - code
      - message
      type: object
    BrowserViewportUpdate:
      allOf:
      - $ref: '#/components/schemas/BrowserViewport'
      - properties:
          force:
            default: false
            description: 'If true, allow the viewport change even when a live view or recording/replay is active.

              Active recordings will be gracefully stopped and restarted at the new resolution as

              separate segments. If false (default), the resize is refused when a live view or recording is active.

              '
            type: boolean
        type: object
      description: Viewport configuration for updating a browser session. Extends BrowserViewport with update-only options.
    BrowserViewport:
      description: 'Initial browser window size in pixels with optional refresh rate.

        If omitted, image defaults apply (1920x1080@25).

        For GPU images, the default is 1920x1080@60.

        Arbitrary viewport dimensions and refresh rates are accepted.

        Known-good presets include:

        2560x1440@10, 1920x1080@25, 1920x1200@25, 1440x900@25, 1280x800@60, 1024x768@60, 1200x800@60, 768x1024@60, 390x844@60.

        For GPU images, recommended presets use one of these resolutions with refresh rates 60, 30, 25, or 10:

        800x600, 960x720, 1024x576, 1024x768, 1152x648, 1200x800, 1280x720, 1368x768, 1440x900, 1600x900, 1920x1080, 1920x1200, 390x844, 360x250, 768x1024, 800x1600.

        Viewports outside this list may exhibit unstable live view or recording behavior.

        If refresh_rate is not provided, it will be automatically determined based on the resolution

        (higher resolutions use lower refresh rates to keep bandwidth reasonable).

        '
      properties:
        height:
          description: Browser window height in pixels. Any positive integer is accepted.
          example: 800
          minimum: 1
          type: integer
        refresh_rate:
          description: Display refresh rate in Hz. Any positive integer is accepted; if omitted, automatically determined from width and height.
          example: 60
          minimum: 1
          type: integer
