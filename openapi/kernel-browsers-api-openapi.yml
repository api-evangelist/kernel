          description: Active OTLP export state.
      type: object
    OTLPDestinationRef:
      description: 'OTLP destination selection. Provide either id or name. The destination

        must be customer-visible in the authenticated organization. A

        project-scoped credential can select any such destination for workloads

        in its project.

        '
