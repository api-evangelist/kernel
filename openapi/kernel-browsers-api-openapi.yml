        name:
          description: 'Optional human-readable name for the browser session, used to find it later in the dashboard. Must be unique among active sessions within the project. Can be changed later via PATCH /browsers/{id_or_name}.

            '
          example: checkout-flow-1
          maxLength: 255
          minLength: 1
          pattern: ^[a-zA-Z0-9._-]{1,255}$
          type: string
        network:
          $ref: '#/components/schemas/BrowserNetworkConfig'
          description: 'Network configuration for the browser session. Only allowed_hosts can be changed after creation, with PATCH /browsers/{id_or_name}.

            '
        profile:
          $ref: '#/components/schemas/BrowserProfile'
        proxy:
          $ref: '#/components/schemas/BrowserProxyConfig'
          description: 'Proxy configuration for the browser session. Cannot be combined with proxy_id.

            Omit to use the browser default: stealth browsers use Kernel''s default stealth proxy, while non-stealth browsers use direct egress.

            Set mode to direct to force direct egress regardless of stealth. Set mode to default to explicitly use the browser default: Kernel''s default stealth proxy when stealth=true, or direct egress when stealth=false.

            Select id or name to use that proxy regardless of stealth. Proxy selection does not change stealth or CAPTCHA solver behavior.

            '
        proxy_id:
          deprecated: true
          description: Optional proxy to associate to the browser session. Must reference a proxy in the same project as the browser session. Deprecated in favor of proxy.
          type: string
          x-deprecated-reason: Use proxy instead.
        region:
          $ref: '#/components/schemas/Region'
          description: 'Geographic region for the browser session. It is fixed once the session is created. Region selection requires a Start-Up or Enterprise plan, defaults to us-east when omitted on create.

            '
        start_url:
          description: Optional URL to open when the browser session is created. Navigation is best-effort, so navigation failures do not prevent the session from being created.
          example: https://example.com
          type: string
        stealth:
          description: 'If true, launches the browser in stealth mode and enables the CAPTCHA solver. Defaults to false.

            When proxy is omitted, stealth browsers use Kernel''s default stealth proxy and non-stealth browsers use direct egress.

            An explicit proxy configuration changes only egress; it does not enable or disable stealth or the CAPTCHA solver.

            '
          example: true
          type: boolean
        tags:
          $ref: '#/components/schemas/Tags'
          description: 'Optional user-defined key-value tags for the browser session, used to find and group sessions later. Can be changed later via PATCH /browsers/{id_or_name}. Up to 50 pairs.

            '
        telemetry:
          $ref: '#/components/schemas/BrowserTelemetryRequestConfig'
          description: 'Telemetry configuration for the browser session. Set enabled to true to start capture using VM defaults, or provide browser category settings. If omitted, null, set to an empty object ({}), set to enabled: false without browser category settings, or all four categories are explicitly disabled, capture is not started.

            '
          nullable: true
        timeout_seconds:
          description: The number of seconds of inactivity before the browser session is terminated. Activity includes CDP connections and live view connections. Defaults to 60 seconds. Minimum allowed is 10 seconds. Maximum allowed is 259200 (72 hours). We check for inactivity every 5 seconds, so the actual timeout behavior you will see is +/- 5 seconds around the specified value.
          maximum: 259200
