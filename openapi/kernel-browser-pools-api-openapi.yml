      properties:
        id:
          type: string
        name:
          maxLength: 255
          minLength: 1
          type: string
      type: object
    BrowserTelemetryStorageRequestConfig:
      description: Kernel storage settings for a session's captured telemetry.
      properties:
        enabled:
          description: Whether captured telemetry is persisted to Kernel storage. Defaults to true. Setting false requires an OTLP destination and cannot be changed after the browser is created.
          type: boolean
      type: object
    BrowserTelemetryExportRequestConfig:
      description: Export destinations for a session's captured telemetry, by protocol. Honored when creating a browser, including the browser a managed auth connection creates for a login. Browser pools do not support export and reject it; on a browser update it is ignored, so the session keeps the destination it was created with.
      properties:
        otlp:
          $ref: '#/components/schemas/BrowserTelemetryOTLPExportRequestConfig'
          description: Export captured telemetry over OTLP to one of the org's configured destinations.
      type: object
    BrowserTelemetryExportConfig:
      description: Active export state for a session's captured telemetry, by protocol.
      properties:
        otlp:
          $ref: '#/components/schemas/BrowserTelemetryOTLPExportConfig'
          description: Active OTLP export state.
      type: object
    OTLPDestinationRef:
      description: 'OTLP destination selection. Provide either id or name. The destination

        must be customer-visible in the authenticated organization. A

        project-scoped credential can select any such destination for workloads

        in its project.

        '
      oneOf:
      - required:
        - id
      - required:
        - name
      properties:
        id:
          description: OTLP destination ID
          type: string
        name:
          description: OTLP destination name
          type: string
      type: object
    BrowserTelemetryCdpControlConfig:
      description: Settings for the cdp_command events the CDP proxy reports.
      properties:
        excluded_methods:
          description: 'Methods to leave out of the cdp_command stream. Omit the list to keep the current one; send an empty list to report every supported method again. Exclusion is a telemetry setting only: an excluded command is still relayed to the browser unchanged, it simply produces no event. Use it to drop the highest-volume methods — Input.dispatchMouseEvent during a humanized cursor path, or Page.captureScreenshot under a screencast — without turning the whole category off. Excluded commands are counted in cdp_disconnect.telemetry_excluded.'
          items:
            $ref: '#/components/schemas/BrowserCdpCommandMethod'
          type: array
      type: object
    BrowserPoolDeleteRequest:
      description: 'Parameters for deleting a browser pool.

        '
      properties:
        force:
          default: false
          description: If true, force delete even if browsers are currently leased. Leased browsers will be terminated.
          type: boolean
      required: []
      type: object
    BrowserProxyMode:
      description: 'Proxy egress mode. direct forces no proxy regardless of stealth. default uses the browser''s stealth-derived default: Kernel''s default stealth proxy when stealth=true, or direct egress when stealth=false.

        default is primarily useful on browser update to restore the browser default after selected-proxy egress.

        '
      enum:
      - direct
      - default
      type: string
      x-enum-varnames:
      - Direct
      - Default
    BrowserExtension:
      description: 'Extension selection for the browser session. Provide either id or name of an extension uploaded to Kernel.

        '
      oneOf:
      - required:
        - id
      - required:
        - name
      properties:
        id:
          description: Extension ID to load for this browser session
          type: string
        name:
          description: Extension name to load for this browser session (instead of id). Must be 1-255 characters, using letters, numbers, dots, underscores, or hyphens.
          maxLength: 255
          minLength: 1
          pattern: ^[a-zA-Z0-9._-]{1,255}$
          type: string
      type: object
    BrowserTelemetryCategoriesConfig:
      description: 'Per-category telemetry capture settings layered onto the default set. The operational signals (control, connection, system, captcha) are on by default and are opt-out: set one to enabled=false to stop capturing it. The CDP categories (console, network, page, interaction), screenshot and platform are off by default and are opt-in: set enabled=true to capture them.'
      properties:
        captcha:
          $ref: '#/components/schemas/BrowserTelemetryCategoryConfig'
          description: Captcha solver tasks and visible challenge outcomes. On by default.
        connection:
          $ref: '#/components/schemas/BrowserTelemetryCategoryConfig'
          description: Client attach/detach lifecycle for the CDP proxy and live view. On by default.
        console:
          $ref: '#/components/schemas/BrowserTelemetryCategoryConfig'
          description: Console output (log, warn, error) and uncaught exceptions. CDP category; off by default.
        control:
          $ref: '#/components/schemas/BrowserTelemetryControlConfig'
          description: Agent-driven actions against the browser — computer-control calls, Playwright code execution, screenshots, clipboard access, and browser-control commands sent over the CDP proxy. On by default.
        interaction:
          $ref: '#/components/schemas/BrowserTelemetryCategoryConfig'
          description: User interaction events including clicks, keydowns, and scroll-settled events. CDP category; off by default.
        network:
          $ref: '#/components/schemas/BrowserTelemetryCategoryConfig'
          description: HTTP request and response metadata including URL, method, status code, and timing. Request post data is forwarded as-is from CDP. Text response bodies are truncated at 8 KB for structured types (JSON, XML, form data) and 4 KB for other text types. Binary responses (images, fonts, media) are excluded. CDP category; off by default.
        page:
          $ref: '#/components/schemas/BrowserTelemetryCategoryConfig'
          description: Page lifecycle events including navigation, DOMContentLoaded, load, layout shifts, and LCP. CDP category; off by default.
        platform:
          $ref: '#/components/schemas/BrowserTelemetryCategoryConfig'
          description: In-VM API calls that manage the browser VM rather than drive the browser (recording, filesystem, process, telemetry and browser configuration). Mostly platform-induced; off by default and must be opted into.
        screenshot:
          $ref: '#/components/schemas/BrowserTelemetryCategoryConfig'
          description: Periodic base64-encoded viewport screenshots. High volume; off by default and must be opted into.
        system:
          $ref: '#/components/schemas/BrowserTelemetryCategoryConfig'
          description: Browser VM health, such as out-of-memory kills and managed-service crashes. On by default.
      type: object
    BrowserTelemetryOTLPExportConfig:
      description: Active OTLP export state for a browser session.
      properties:
        destination:
          description: ID of the OTLP destination the session is bound to. Omitted when the session is not exporting.
          type: string
        enabled:
          description: Whether the session is exporting captured telemetry over OTLP.
          type: boolean
      type: object
    BrowserUsage:
      description: Session usage metrics.
      properties:
        uptime_ms:
          description: Time in milliseconds the session was actively running.
          type: integer
      required:
      - uptime_ms
      type: object
    BrowserTelemetryRequestConfig:
      description: Telemetry request configuration for a browser session.
      properties:
        browser:
          $ref: '#/components/schemas/BrowserTelemetryCategoriesConfig'
          description: Per-category capture flags. The operational categories (control, connection, system, captcha) are captured whenever telemetry is enabled; set one to enabled=false to opt out. The CDP categories (console, network, page, interaction), screenshot and platform are off by default; set enabled=true to opt in. On create, provided categories layer onto the default set. On update, provided categories merge onto the session's current config; when no telemetry is active this falls back to the default set (matching create). If browser is omitted or empty, the default set is used. A browser config that disables every category stops capture on update and starts no capture on create.
        enabled:
          description: Request shortcut for browser telemetry capture. True enables capture; with no browser category settings it captures the default set (control, connection, system, captcha), and any browser category settings are layered onto that default set. On update, enabled=true resolves the config fresh from the default set plus any provided categories, replacing the session's current selection rather than merging onto it; omit enabled to merge categories onto the current selection instead. False stops capture on update and starts no capture on create. enabled=false cannot be combined with browser category settings.
          type: boolean
        export:
          $ref: '#/components/schemas/BrowserTelemetryExportRequestConfig'
          description: Where to export this session's captured telemetry. Omit to capture without exporting.
        storage:
          $ref: '#/components/schemas/BrowserTelemetryStorageRequestConfig'
          description: Whether to persist this session's captured telemetry to Kernel storage.
      type: object
    BrowserTelemetryConfig:
      description: Active telemetry configuration for a browser session.
      properties:
        browser:
          $ref: '#/components/schemas/BrowserTelemetryCategoriesConfig'
          description: Per-category enable/disable flags.
        export:
          $ref: '#/components/schemas/BrowserTelemetryExportConfig'
          description: Where the session's captured telemetry is being exported. Omitted when the export state is unknown.
        storage:
          $ref: '#/components/schemas/BrowserTelemetryStorageConfig'
          description: Whether the session's captured telemetry is persisted to Kernel storage. Omitted for browsers created before this setting existed, which persist it.
      type: object
  responses:
    BadRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Bad Request – invalid input
    Forbidden:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Forbidden – insufficient permissions or plan
    Unauthorized:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Unauthorized – missing or invalid authorization token
    Conflict:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Conflict – resource already exists
    TooManyRequests:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Too Many Requests – rate limit exceeded
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: integer
    InternalError:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Internal Server Error
    NotFound:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Resource not found
  securitySchemes:
    bearerAuth:
      scheme: bearer
      type: http
